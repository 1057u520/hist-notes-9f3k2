function openNode(pi,ci){
  const p=P[pi], col=colByI(ci);
  let body='<div class="lead-in">'+fmt(p.feature)+'</div>'+fmt(p.cells[String(ci)]||"")+fmtSupp(suppOf(pi,ci));
  openModal(p.name+" ｜ "+p.span, col.title, body);
}
function openTheme(ci){
  const col=colByI(ci);
  let body='<p class="note">按时间顺序看「'+esc(col.title)+'」的跨朝代演变。</p>';
  body+=P.map((p,i)=>({p,i})).filter(x=>x.p.cells[String(ci)]||suppOf(x.i,ci).length)
      .map(x=>'<div class="tl-item"><div class="when">'+esc(x.p.name)+'<span class="span">'+esc(x.p.span)+'</span></div>'
             +fmt(x.p.cells[String(ci)]||"")+fmtSupp(suppOf(x.i,ci))+'</div>').join('');
  if(DS.cross[String(ci)]) body+='<h4 class="sec">跨阶段脉络梳理</h4>'+fmt(DS.cross[String(ci)]);
  openModal("专题 · 纵向演变", col.title, body);
}
function openPeriod(pi){
  const p=P[pi];
  let body='<div class="lead-in">'+fmt(p.feature)+'</div><h4 class="sec">重要历史时期及事件</h4>'+fmt(p.events)+fmtSupp(suppOf(pi,"events"));
  body+='<h4 class="sec">本阶段各专题</h4><div class="jump">'+COLS.map(c=>'<span class="j" data-p="'+pi+'" data-c="'+c.i+'">'+esc(c.title)+'</span>').join('')+'</div>';
  openModal(p.position+" ｜ "+p.sub, p.name, body);
  mb.querySelectorAll('.j').forEach(el=>el.onclick=()=>openNode(+el.dataset.p,+el.dataset.c));
}
function openGaps(){
  let body='<p class="note">整张表覆盖面已经很完整。带「已并入」的条目已经合并进正文，用“补”标记与原内容区分。</p>';
  for(const sec of GAPS){
    body+='<h4 class="sec">'+esc(sec.cat)+'</h4>';
    for(const it of sec.items)
      body+='<div class="gapcard"><h4>'+esc(it.t)+'<span class="lv '+it.lv+'">'+esc(it.tag)+'</span></h4><p>'+esc(it.d)+'</p></div>';
  }
  openModal("自查补充","可能缺漏的重要考点",body);
}

/* ======= TREE ======= */
function buildTree(){
  document.documentElement.style.setProperty('--ncols', P.length);
  const tl=document.getElementById("tl");
  tl.innerHTML='<div class="lead">时间轴</div>'+P.map((p,i)=>'<div class="chip'+(p.isNew?' new':'')+'" data-p="'+i+'"><div class="cn">'+esc(p.name.replace("（补充）",""))+'</div><div class="yr">'+esc(p.span)+'</div></div>').join('');
  tl.querySelectorAll('.chip').forEach(el=>el.onclick=()=>openPeriod(+el.dataset.p));
  const map=document.getElementById("map");
  let m='<div class="row head"><div></div>'+P.map(p=>'<div class="tcell"><b>'+esc(p.name.replace("（补充）",""))+'</b>'+esc(p.span)+'</div>').join('')+'</div>';
  let count=0;
  GROUPS.forEach(g=>{
    const cols=COLS.filter(c=>c.group===g);
    m+='<div class="row grp '+GCLS[g]+'"><span class="bar"></span>'+esc(g)+'<span class="gi">'+cols.length+' 个专题</span></div>';
    cols.forEach(c=>{
      const hint=c.outer&&c.outer!==c.title?'<small>'+esc(c.outer)+'</small>':'';
      m+='<div class="row trow" data-c="'+c.i+'"><div class="tlabel" data-c="'+c.i+'">'+esc(c.title)+hint+'</div>';
      P.forEach((p,pi)=>{
        const has=p.cells[String(c.i)]||suppOf(pi,c.i).length;
        if(has) count++;
        const cls='node '+GKEY[g]+(suppOf(pi,c.i).length?' '+'' : '');
        const style=suppOf(pi,c.i).length?' style="box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--supp);"':'';
        m+='<div class="ncell"><div class="'+cls+'" data-p="'+pi+'" data-c="'+c.i+'" title="'+esc(p.name+' · '+c.title)+'"'+style+'></div></div>';
      });
      m+='</div>';
    });
  });
  map.innerHTML=m; document.getElementById("nCount").textContent=count;
  map.querySelectorAll('.node').forEach(el=>el.onclick=()=>{
    map.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel'); openNode(+el.dataset.p,+el.dataset.c);
  });
  map.querySelectorAll('.tlabel').forEach(el=>el.onclick=()=>openTheme(+el.dataset.c));
}

const RKEY='zgds-read-v2';
let readSet=new Set(JSON.parse(localStorage.getItem(RKEY)||"[]"));
let cur=0, quiz=false;
const saveRead=()=>localStorage.setItem(RKEY,JSON.stringify([...readSet]));

function renderToc(){
  const t=document.getElementById("toc");
  let h='<div class="toc-h">朝代目录<span class="prog">'+readSet.size+' / '+N+' 已读</span></div>';
  P.forEach((p,i)=>{
    h+='<div class="item'+(i===cur?' active':'')+(readSet.has(i)?' read':'')+'" data-i="'+i+'">'
      +'<span class="ck">'+(readSet.has(i)?'✓':'')+'</span><span><b>'+esc(p.name.replace("（补充）",""))
      +(p.isNew?'<span class="newtag">补</span>':'')+'</b><em>'+esc(p.span)+'</em></span></div>';
  });
  h+='<div class="allbtn" id="allBtn">全部标记为已读 / 全部重置</div>';
  t.innerHTML=h;
  t.querySelectorAll('.item').forEach(el=>el.onclick=()=>go(+el.dataset.i));
  document.getElementById("allBtn").onclick=()=>{
    if(readSet.size===N) readSet.clear(); else P.forEach((_,i)=>readSet.add(i));
    saveRead(); renderToc(); renderArt();
  };
}

function renderArt(){
  const p=P[cur], art=document.getElementById("art");
  let h='<div class="art-head">'+(p.isNew?'<span class="ribbon">补充页</span>':'')
      +'<div class="kicker">'+esc(p.position)+'</div><h2 class="art-title">'+esc(p.name.replace("（补充）",""))+'</h2>'
      +'<div class="art-span">'+esc(p.span)+(p.sub?' ｜ '+esc(p.sub):'')+'</div>'+(p.note?'<div class="art-note">※ '+esc(p.note)+'</div>':'')+'</div>';
  h+='<div class="q-wrap lead-in">'+fmt(p.feature)+'</div>';
  h+='<div class="blk"><h3 class="blk-h">重要历史时期及事件</h3><div class="q-wrap">'+fmt(p.events)+fmtSupp(suppOf(cur,"events"))+'</div></div>';
  GROUPS.forEach((g,gi)=>{
    const cols=COLS.filter(c=>c.group===g);
    const filled=cols.filter(c=>p.cells[String(c.i)]||suppOf(cur,c.i).length);
    h+='<section class="bigsec '+GCLS[g]+'"><h3 class="bigsec-h"><span class="num">'+CN[gi]+'</span>'+esc(g)+'</h3>';
    cols.forEach(c=>{
      const sub=c.outer&&c.outer!==c.title?' <small>'+esc(c.outer)+'</small>':'';
      if(filled.includes(c)){
        h+='<div class="topic"><h4 class="topic-h" data-c="'+c.i+'">'+esc(c.title)+sub+'</h4>'
          +'<div class="q-wrap">'+fmt(p.cells[String(c.i)]||"")+fmtSupp(suppOf(cur,c.i))+'</div></div>';
      } else {
        h+='<div class="topic empty"><h4 class="topic-h">'+esc(c.title)+sub+'</h4><p class="para">—</p></div>';
      }
    });
    h+='</section>';
  });
  h='<div class="art-body">'+h+'</div>';
  const done=readSet.has(cur);
  h+='<div class="readnav">'
    +(cur>0?'<button class="pill" id="prevBtn">← '+esc(P[cur-1].name.replace("（补充）",""))+'</button>':'<span></span>')
    +'<div class="spacer"></div><button class="pill '+(done?'done':'')+'" id="doneBtn">'+(done?'✓ 已读':'标记为已读')+'</button><div class="spacer"></div>'
    +(cur<N-1?'<button class="pill" id="nextBtn">'+esc(P[cur+1].name.replace("（补充）",""))+' →</button>':'<span></span>')+'</div>';
  art.innerHTML=h;
  const _v=VIEW()[p.name]; if(_v && art.querySelector('.art-body')) art.querySelector('.art-body').innerHTML=_v;
  art.querySelectorAll('.topic-h').forEach(el=>el.onclick=()=>{ if(!editing) openTheme(+el.dataset.c); });
  const pb=document.getElementById("prevBtn"); if(pb) pb.onclick=()=>go(cur-1);
  const nb=document.getElementById("nextBtn"); if(nb) nb.onclick=()=>go(cur+1);
  document.getElementById("doneBtn").onclick=()=>{ readSet.has(cur)?readSet.delete(cur):readSet.add(cur); saveRead(); renderToc(); renderArt(); };
  document.getElementById("rbPos").textContent='第 '+(cur+1)+' / '+N+' 朝';
  document.getElementById("rbProg").textContent='已读 '+readSet.size+' / '+N;
}

const EKEY='zgds-edit-v1';
let EDIT=JSON.parse(localStorage.getItem(EKEY)||"{}");        /* 本机自己的改动 */
const RKEY2='zgds-remote-v1';
let REMOTE=JSON.parse(localStorage.getItem(RKEY2)||"{}");      /* 云端最新快照 */
const _st=document.getElementById('editstore');
if(_st){ try{ REMOTE=Object.assign(REMOTE, JSON.parse(_st.textContent)); }catch(e){} }  /* 离线兜底 */
function VIEW(){ return Object.assign({}, REMOTE, EDIT); }     /* 云端 + 本机，本机优先 */
function setRemote(o){ if(!o) return; REMOTE=Object.assign(REMOTE, o); try{ localStorage.setItem(RKEY2, JSON.stringify(REMOTE)); }catch(e){} }
let editing=false, saveT=null;
function saveEdit(){
  const b=document.querySelector('#art .art-body');
  if(!b) return;
  EDIT[P[cur].name]=b.innerHTML;
  try{ localStorage.setItem(EKEY, JSON.stringify(EDIT)); }catch(e){}
  pushToServer();
}
let pushT=null;
function pushToServer(){
  if(!/^https?:/.test(location.protocol)) return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>{
    fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(EDIT)})
      .then(r=>{ const s=document.getElementById('saveState'); if(s) s.textContent = r.ok ? '已保存到本地文件 ✓' : '保存失败'; })
      .catch(()=>{ const s=document.getElementById('saveState'); if(s) s.textContent='保存失败（已存浏览器）'; });
  },300);
}
async function loadServerEdits(){
  if(!/^https?:/.test(location.protocol)) return;
  try{
    const r=await fetch('/api/load');
    if(!r.ok) return;
    const o=await r.json();
    if(o && Object.keys(o).length){
      EDIT=Object.assign(EDIT,o);
      document.getElementById('editHint').textContent='（已连接本地文件，改动会自动保存到磁盘）';
      if(document.getElementById('readView').classList.contains('on')) renderArt();
    } else {
      document.getElementById('editHint').textContent='（已连接本地文件，改动会自动保存到磁盘）';
    }
  }catch(e){}
}
loadServerEdits();
function setEdit(on){
  editing=on;
  if(on && quiz) setQuiz(false);
  document.getElementById('main').classList.toggle('edit',on);
  document.getElementById('editBtn').classList.toggle('primary',on);
  const b=document.querySelector('#art .art-body');
  if(b){ b.setAttribute('contenteditable', on?'true':'false'); }
  if(on) b && b.focus();
}
document.getElementById('editBtn').onclick=()=>{ if(editing) saveEdit(); setEdit(!editing); };
document.getElementById('saveBtn').onclick=()=>{ saveEdit(); setEdit(false); renderArt(); };
document.getElementById('revertBtn').onclick=()=>{ delete EDIT[P[cur].name]; localStorage.setItem(EKEY, JSON.stringify(EDIT)); setEdit(false); renderArt(); };
function buildExportHTML(){
  saveEdit();
  const clone=document.documentElement.cloneNode(true);
  clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
  clone.querySelectorAll('.q-wrap.revealed').forEach(e=>e.classList.remove('revealed'));
  let s=clone.querySelector('#editstore');
  if(!s){ s=document.createElement('script'); s.id='editstore'; s.type='application/json';
    const d=clone.querySelector('#data'); d.parentNode.insertBefore(s, d); }
  s.textContent=JSON.stringify(EDIT).replace(/<\//g,'<\\/');
  return '<!DOCTYPE html>\n'+clone.outerHTML;
}
function doExport(){
  const html=buildExportHTML();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  a.download='中国古代史知识树-修改版.html';
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('exportBtn').onclick=doExport;
document.getElementById('art').addEventListener('input',()=>{ if(editing){ clearTimeout(saveT); saveT=setTimeout(saveEdit,600); } });
document.addEventListener('keydown',e=>{ if(editing && (e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); saveEdit(); setEdit(false); renderArt(); } });

function go(i){ if(i<0||i>=N) return; cur=i; renderToc(); renderArt(); document.getElementById("readView").scrollIntoView({behavior:"smooth",block:"start"}); }
document.addEventListener("keydown",e=>{
  if(!document.getElementById("readView").classList.contains("on")) return;
  if(mask.classList.contains("on")) return;
  if(e.key==="ArrowRight") go(cur+1);
  if(e.key==="ArrowLeft") go(cur-1);
});

/* ======= SWITCH ======= */
function switchView(v){
  const tree=document.getElementById("treeView"), read=document.getElementById("readView");
  document.querySelectorAll("#seg button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  if(v==="read"){
    tree.classList.add("off"); read.classList.add("on");
    document.getElementById("searchBox").style.display="none"; document.getElementById("resetBtn").style.display="none";
    renderToc(); renderArt();
  } else {
    tree.classList.remove("off"); read.classList.remove("on");
    document.getElementById("searchBox").style.display=""; document.getElementById("resetBtn").style.display="";
  }
}
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>switchView(b.dataset.v));

/* ======= SEARCH ======= */
const q=document.getElementById("q");
q.addEventListener("input",()=>{
  const term=q.value.trim(), map=document.getElementById("map");
  map.querySelectorAll('.trow').forEach(r=>{ r.classList.remove('hit'); r.querySelectorAll('.node').forEach(n=>n.classList.remove('hl')); });
  if(!term) return;
  map.querySelectorAll('.trow').forEach(row=>{
    const ci=row.dataset.c; let hit=false;
    P.forEach((p,pi)=>{
      const v=p.cells[String(ci)]||"";
      if(v.includes(term)||suppOf(pi,ci).join("").includes(term)||colByI(ci).title.includes(term)||p.name.includes(term)){
        hit=true; const n=row.querySelector('.node[data-p="'+pi+'"]'); if(n) n.classList.add('hl');
      }
    });
    if(hit) row.classList.add('hit');
  });
});
document.getElementById("resetBtn").onclick=()=>{ q.value=""; q.dispatchEvent(new Event('input')); };
document.getElementById("gapsBtn").onclick=openGaps;

/* ================= GitHub cloud sync ================= */
/* 默认仓库：本地文件（file://）打开时也能从云端同步 */
const DEFAULT_REPO = {owner:"1057u520", repo:"hist-notes-9f3k2", branch:"main", path:"edits.json"};
/* 从 GitHub Pages 网址自动认出 用户名/仓库名  */
function detectRepo(){
  const h=location.hostname||"";
  const m=h.match(/^([^.]+)\.github\.io$/i);
  if(m){
    const seg=location.pathname.split('/').filter(Boolean);
    if(seg.length) return {owner:m[1], repo:seg[0]};
  }
  return null;
}
/* 从各处尝试读取 edits.json */
async function readRemoteEdits(){
  const tries=[];
  tries.push((async()=>{ const r=await fetchTO('./edits.json',{cache:'no-store'},8000); if(!r.ok) throw 0; return await r.json(); })());
  let d = (CLOUD.owner&&CLOUD.repo) ? {owner:CLOUD.owner,repo:CLOUD.repo,branch:CLOUD.branch||'main',path:CLOUD.path||'edits.json'} : (detectRepo()||DEFAULT_REPO);
  if(d){
    const br=d.branch||'main', pa=d.path||'edits.json';
    tries.push((async()=>{ const r=await fetchTO('https://api.github.com/repos/'+d.owner+'/'+d.repo+'/contents/'+pa+'?ref='+br,{headers:ghHead(),cache:'no-store'},9000); if(!r.ok) throw 0; const j=await r.json(); return JSON.parse(b64dec(j.content)||'{}'); })());
    tries.push((async()=>{ const r=await fetchTO('https://raw.githubusercontent.com/'+d.owner+'/'+d.repo+'/'+br+'/'+pa,{cache:'no-store'},9000); if(!r.ok) throw 0; return await r.json(); })());
  }
  tries.push((async()=>{ const r=await fetchTO('/api/load',{cache:'no-store'},6000); if(!r.ok) throw 0; return await r.json(); })());
  const res=await Promise.allSettled(tries);
  let merged=null;
  for(const x of res){ if(x.status==='fulfilled' && x.value && Object.keys(x.value).length){ merged=Object.assign(merged||{}, x.value); } }
  return merged;
}
/* 打开页面就自动同步一次（不需要配置、不需要 Token） */
async function autoLoadEdits(){
  try{
    const d=detectRepo();
    if(d && !CLOUD.owner){ CLOUD.owner=d.owner; CLOUD.repo=d.repo; CLOUD.branch=CLOUD.branch||'main'; CLOUD.path=CLOUD.path||'edits.json';
      try{ localStorage.setItem(CKEY, JSON.stringify(CLOUD)); }catch(e){} }
    const remote=await readRemoteEdits();
    if(remote){
      setRemote(remote);                        /* 云端快照，本机改动仍优先 */
      if(document.getElementById('readView').classList.contains('on')) renderArt();
      const s=document.getElementById('saveState'); if(s) s.textContent='已自动同步云端 '+Object.keys(remote).length+' 页 ✓';
    }
  }catch(e){}
}

const CKEY='zgds-cloud-v1';
let CLOUD=JSON.parse(localStorage.getItem(CKEY)||"{}");
function cloudReady(){ return !!(CLOUD.owner && CLOUD.repo); }
function ghHead(){ const h={'Accept':'application/vnd.github+json'}; if(CLOUD.token) h['Authorization']='Bearer '+CLOUD.token; return h; }
function b64enc(str){ const b=new TextEncoder().encode(str); let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
function b64dec(b64){ const bin=atob((b64||'').replace(/\s/g,'')); const b=Uint8Array.from(bin,c=>c.charCodeAt(0)); return new TextDecoder().decode(b); }
function cpath(){ return CLOUD.path || 'edits.json'; }
function fetchTO(url,opts,ms){ ms=ms||15000; const ac=new AbortController(); const id=setTimeout(()=>ac.abort(),ms);
  return fetch(url,Object.assign({},opts||{},{signal:ac.signal})).finally(()=>clearTimeout(id)); }
function cstate(msg,ok){ const s=document.getElementById('cState'); if(s){ s.textContent=msg; s.style.color = ok===false?'#c0392b':'#2c7a55'; } }
async function cloudPull(silent){
  if(!cloudReady()){ if(!silent) cstate('请先填写用户名与仓库名'); return false; }
  try{
    const r=await fetchTO('https://api.github.com/repos/'+CLOUD.owner+'/'+CLOUD.repo+'/contents/'+cpath()+'?ref='+(CLOUD.branch||'main'),{headers:ghHead()});
    if(r.status===404){ cstate('云端还没有 '+cpath()+'（首次上传后会生成）'); return false; }
    if(!r.ok){ cstate('拉取失败：HTTP '+r.status); return false; }
    const j=await r.json();
    const remote=JSON.parse(b64dec(j.content)||'{}');
    const n=Object.keys(remote).length;
    setRemote(remote);
    if(document.getElementById('readView').classList.contains('on')) renderArt();
    cstate('已从云端拉取，共 '+n+' 处修改', true);
    return true;
  }catch(e){ cstate('拉取失败：'+e.message, false); return false; }
}
async function cloudPush(){
  if(!cloudReady()){ cstate('请先填写用户名与仓库名'); return false; }
  if(!CLOUD.token){ cstate('上传需要 Token，请填写后保存'); return false; }
  saveEditLocalOnly();
  try{
    const api='https://api.github.com/repos/'+CLOUD.owner+'/'+CLOUD.repo+'/contents/'+cpath();
    let sha=null;
    const g=await fetchTO(api+'?ref='+(CLOUD.branch||'main'),{headers:ghHead()});
    if(g.ok){ const j=await g.json(); sha=j.sha; }
    const body={ message:'update my edits '+new Date().toLocaleString('zh-CN'), content:b64enc(JSON.stringify(VIEW(),null,0)), branch:(CLOUD.branch||'main') };
    if(sha) body.sha=sha;
    const p=await fetchTO(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead()),body:JSON.stringify(body)});
    if(p.ok){ cstate('已上传到云端 ✓（其他电脑刷新即可看到）', true); return true; }
    const e=await p.json().catch(()=>({}));
    cstate('上传失败：HTTP '+p.status+' '+(e.message||''), false); return false;
  }catch(e){ cstate('上传失败：'+e.message, false); return false; }
}
function saveEditLocalOnly(){
  const b=document.querySelector('#art .art-body');
  if(b) EDIT[P[cur].name]=b.innerHTML;
  try{ localStorage.setItem(EKEY, JSON.stringify(EDIT)); }catch(e){}
}
function openCloud(){
  const d=detectRepo()||{};
  document.getElementById('cOwner').value=CLOUD.owner||d.owner||'';
  document.getElementById('cRepo').value=CLOUD.repo||d.repo||'';
  document.getElementById('cBranch').value=CLOUD.branch||'main';
  document.getElementById('cPath').value=CLOUD.path||'edits.json';
  document.getElementById('cToken').value=CLOUD.token||'';
  document.getElementById('cmask').classList.add('on');
}
document.getElementById('cloudBtn').onclick=openCloud;
document.getElementById('cx').onclick=()=>document.getElementById('cmask').classList.remove('on');
document.getElementById('cmask').addEventListener('click',e=>{ if(e.target.id==='cmask') document.getElementById('cmask').classList.remove('on'); });
document.getElementById('cSave').onclick=()=>{
  CLOUD={owner:document.getElementById('cOwner').value.trim(), repo:document.getElementById('cRepo').value.trim(),
         branch:(document.getElementById('cBranch').value.trim()||'main'), path:(document.getElementById('cPath').value.trim()||'edits.json'),
         token:document.getElementById('cToken').value.trim()};
  localStorage.setItem(CKEY, JSON.stringify(CLOUD));
  if(/^https?:/.test(location.protocol)){
    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(CLOUD)})
      .then(()=>cstate('设置已保存（本机服务已记住，启动时会自动从云端同步）', true))
      .catch(()=>cstate('设置已保存', true));
  } else { cstate('设置已保存', true); }
};
document.getElementById('cPull').onclick=()=>cloudPull(false);
document.getElementById('cPush').onclick=()=>cloudPush();

buildTree();
autoLoadEdits();
if(cloudReady() && CLOUD.token){ cloudPull(true); }
</script>
