重内轻之势由此形成，成为东晋南朝政局动荡与割据之根源。", "5": "• 九品中正制之立：220年曹丕采陈群之议，于州郡设中正官，品第人物为上中下九等，吏部据以授官，所选渐重家世门第。选官之权收于中正，初意综核名实，终为高门垄断，门阀政治之核心制度由此确立。\n• 察举之衰：两晋察举孝廉秀才仍岁岁举行，然中正评语定其高下，贡举徒具仪文，州郡所举多豪门子弟。察举与九品中正并行而实权尽归中正，选举之公信渐失，寒素进身之途由此日窄，取士之公难以为继。\n• 寒素之沉滞：中正品第以家世为首要，所谓上品无寒门、下品无势族，寒门才俊屈沉下僚，势族子弟坐至公卿。阶层流动之门壅塞，人才选拔失其公正，社会固化之势由此加深，门阀政治之弊积重难返。\n• 清浊官分之途：官职分清官浊官，清官职闲廪重、地位清显，士族垄断清途，寒人只能充任浊职卑位。身份等级渗入官制之中，选官与门第合而为一，流品之分成为南朝官制之显著特征，寒裔进身愈艰。", "6": "• 御史台之独立：魏晋御史台脱离少府而成独立监察机构，御史中丞纠劾百官、肃正朝仪，治书侍御史分掌其职，监察不隶行政而直属君主。台谏体制之骨架由此确立，纠弹之威较前代更峻，吏治整饬赖此维系。\n• 校事与刺奸之察：曹魏设校事官伺察群下，以特务手段监察臣僚，卢洪赵达之流罗织成风，群僚侧目，校事之制至嘉平年间始废。特务监察伤君臣之信，风闻纠劾之弊由此显现，后世引为深戒。\n• 中正兼司清议：州郡中正品第人物之外，兼有访察乡论清议之责，士人名节由乡里舆论与中正品题共同裁定。选官与监察职能合一，考课核实之功能反受侵蚀，监察之效为门第所夺，制度运行由此失其公正。", "7": "• 魏律与晋律：魏明帝命陈群刘劭等制新律十八篇，删汉律之繁；晋武帝泰始年间颁泰始律，贾充杜预等主其事，凡二十篇，首立准五服以制罪。礼律融合至此深入，中华法系之基本框架由此奠定，引礼入律垂范隋唐。\n• 张杜律注：张斐杜预分别为晋律作注，明发律之意理、疏通条文，杜预注随律颁行，与律文同具效力。律学注释自成体系，断狱有了统一依据，律学之独立地位由此确立，注律成为历代修法之传统。\n• 复肉刑之议：汉末以来屡有恢复肉刑之议，主张以劓刖代死刑以惩奸止罪，曹操魏文帝两度议而未行，陈群钟繇主之而王朗等驳之。乱世司法严苛、刑讯时有，刑罚轻重之辩长期未决，宽严之取舍影响后世法制。", "8": "• 黄籍白籍并行：东晋侨人以白籍登记、免纳调役，土著以黄籍著籍、承担赋役，户籍制度黄白双轨并行。籍注淆乱而赋役不均，冒注伪状之风渐炽，版籍之整理成为南朝长期难题，土断之政由此屡行。\n• 宗主督护之制：十六国北魏初期北方坞堡林立，豪强聚宗族乡党自保，北魏因之以宗主督护统摄民户，赋役多入私门。国家编户为豪强荫占，基层掌控空虚，三长制改革由此蓄势，基层治理之重构势在必行。\n• 三长制之立：北魏太和年间李冲建言，五家立邻长、五邻立里长、五里立党长，三长检括户口、征收租调、维持治安，取代宗主督护。荫户大量出而复为编户，国家掌控基层之力由此恢复，均田制与租调制赖以落实。", "9": "• 户调式之颁：西晋颁户调式，丁男占田七十亩课田五十亩，丁女减半，丁男之户岁输绢三匹绵三斤，次丁户减半。以户为征收单位而田赋口赋合于户调，赋役定额化由此确立，然豪强荫户如故，实效有限。\n• 北魏均田租调：北魏与均田令相配套，一夫一妇纳粟二石、调帛一匹，受田者即负纳税之责，租调随田而定。赋役与土地授受相结合，民有恒产而国有常税，租庸调制之雏形由此孕育，北朝财政之基赖此而立。\n• 徭戍之重：分裂时期军兴频仍，筑城转漕、运输攻守皆驱编户充役，役无虚岁而征发无常，民多逃亡脱籍。重役逼民流散，在籍户口锐减，赋役基础为之动摇，成为各国财政与统治之共同困境。\n• 盐税与关市杂征：各国擅盐铁之利以充军资，又加关市之征，杂调屡兴，苛细横敛不一而足，商旅困顿而民力凋敝。横征虽济一时军国之用，然竭泽而渔，民怨积聚，赋役紊乱成为割据政权难以久立之因。", "10": "• 世兵制与士家：三国行世兵制，兵户别立户籍、父死子继、世代为兵，魏之士家吴之兵户婚配限于同类，身份低于编户齐民。兵农分途而军户地位卑贱，逃亡叛乱时有，兵源素质渐降，职业世袭兵制之弊端由此显现。\n• 北府兵之建：东晋谢玄镇广陵，募徐兖流民劲勇组建北府兵，淝水一战大破前秦，刘牢之统军威震江淮。流民帅以武力跻身政治，寒门武人势力上升，兵权渐归方镇，刘裕即以北府之众开创刘宋基业。\n• 府兵制之创：西魏宇文泰仿鲜卑部落兵制与周官六军之意，立八柱国十二大将军二十四开府统军，府兵另籍、免除租调，农隙训练、轮番宿卫。胡汉兵制融为一体，兵农合一之制由此奠基，隋唐军制沿此发展。\n• 部曲与私兵之盛：乱世将帅募兵蓄养部曲，拥兵自随、兵为将有，将帅易主而兵随人走，国家征发之制形同虚设。中央军权涣散，武人跋扈之势由此滋长，兵权私属成为南朝政权更迭频繁之重要原因。", "11": "• 士族门阀之盛：两晋南朝士族以婚宦自守，王谢袁萧并称侨姓望族，平流进取、坐至公卿，不涉武事而清谈终日。门第成为社会分层之首要标准，皇权亦须仰士族鼻息，等级固化达于极致，寒门与士族之对立由此加深。\n• 部曲佃客之依附：士族豪强荫占佃客，部曲耕战皆隶于主家，世袭相承、身系于主，国家编户为其侵夺。依附人口不入版籍、不纳国税，税基萎缩而私门力厚，人身依附关系由此强化，成为此期社会结构之突出现象。\n• 流民与孙恩之乱：北方流民南下依人而食，东晋孙恩卢循以五斗米道聚众起事，纵横东海沿海十余年，建康为之震动。流民起事与门阀压迫交织，阶级矛盾与海寇之患并发，门阀统治之脆弱由此暴露。\n• 奴婢与良贱之隔：战俘掠卖没官者沦为奴婢，奴婢耕织供役、子孙相袭，良贱不婚、身份悬隔，赎免之途有限。贱口制度显示社会之不平等，奴婢与部曲构成依附阶层之底层，身份等级之制由此固化，影响至唐犹存。", "12": "• 玄学清谈：正始年间何晏王弼祖述老庄、倡贵无之论，名教出于自然之说风靡士林，竹林七贤纵酒放达抗礼法，清谈遂为士族日常。玄学使儒学独尊之局松动，思辨之风大兴，士人精神由经世转向超脱，思想解放由此开启。\n• 佛教之盛：般若学与弥陀信仰东传，道安整理经典、鸠摩罗什译经长安，大乘义理大畅，出家之风盛行，南朝郭祖深叹言僧尼之众。乱世民众皈依以求慰藉，寺院成为信仰与社会活动之中心，三教论争与交融由此展开。\n• 儒玄交融：南朝士人兼修三玄与经术，明经修礼者代不乏人，皇侃论语义疏兼采玄义，名教与自然之辩渐趋调和。儒学失去独尊而仍居官学之位，经学玄学化为其存续之道，三教并立之思想格局初步形成。\n• 道教之定型：葛洪抱朴子集神仙方术之大成，寇谦之清整天师道、制定戒律仪轨，得北魏太武帝崇奉，陆修静陶弘景整理经典斋仪于南方。道教由民间信仰升为国家承认之宗教，成熟教团体系由此确立，与儒佛鼎足而三。", "13": "• 均田令之颁行：485年北魏孝文帝颁均田令，十五岁以上男夫受露田四十亩桑田二十亩，妇人减半，老免还田，桑田为世业可传子孙。国家掌握授田还受之权，无地少地之民获得耕种之本，土地制度之新框架由此确立。\n• 占田制之限：西晋户调式规定丁男占田七十亩、丁女三十亩，官品第一至第九荫占田宅佃客各有等差，意在抑制兼并。限田之义可取而执行乏力，势家逾限如故，兼并之势未能遏止，制度理想与豪强现实之落差由此可见。\n• 庄园经济之张：士族豪强广占田园山泽，封锢山水之禁屡下屡犯，庄园内佃客部曲耕作、自给自足，谢灵运山居赋可证其盛。大土地所有制持续扩张，国家税源为其侵夺，与均田小农经济构成消长之势，影响南朝经济格局。\n• 屯田与公田之营：曹魏许下屯田及郡国屯田最著，邓艾淮南屯田蓄水为陂，北朝亦以官田荒田授民、边镇营屯，军资民食赖以补给。国有土地经营补私田之不足，恢复生产之效显著，为乱世农业复苏提供制度支撑，作用深远。", "14": "• 草市之兴：南北分裂而域内互市不绝，长江津渡、军镇近旁草市渐起，乡村集市交易盐铁布粟，南北互市之使亦岁岁相通。民间市场网络在乱局中生长，为唐宋草市镇之先导，商业活力由此延续不绝。\n• 海上交通与互市：孙吴遣卫温诸葛直浮海求夷洲，番禺交州为南海贸易之港，香料犀象珠玑自海外输入，扶南林邑遣使通好。海上商路渐次开通，东南港市由此兴起，对外贸易重心渐向江南转移。\n• 关市之征：各国于关津设卡征税、市租入官，盐铁利入与市税成为军国费用之重要来源，税率苛细而商旅困顿。关市之征虽碍流通，然南北互市、胡汉贸易未尝断绝，物资交流于战乱中维系不断。\n• 贵族官僚之商：士族官僚兼营殖货，邸店遍设、囤积居奇，南朝诸王及权贵竞逐商利，官僚资本充斥市场。权势与商业资本结合，豪商倚势而平民受挤，市场结构因之畸变，身份经商成为此期商业之突出现象。", "15": "• 蜀锦与江南丝织：蜀汉设锦官专掌织锦，成都机杼相闻，蜀锦行销吴魏，为军资大宗；江南丝织自吴而兴，技艺由粗转精。丝织中心由北向南扩展，产业格局因乱世而调整，江南手工业基础由此奠定。\n• 造纸之普及：麻纸产量大增而价格渐廉，南北文书典籍渐用纸张，桓玄诏令以纸代简，官府文书随之改易。书写载体之变促进典籍整理与学术下移，文人抄书藏书之风渐盛，文化传播因此加速。\n• 青瓷之成：越窑婺窑瓯窑烧造青瓷，釉色青润、器形规整，鸡首壶莲花尊为其名品，六朝墓葬青瓷出土众多。制瓷技术趋于成熟，日用器皿渐代铜陶，江南窑业体系由此形成，外销之途亦已启程。\n• 冶铸与造船：灌钢法发明，生熟铁合炼而钢质均匀，水排鼓风改进冶铁效率；江南滨江造船业盛，吴舰楼船远航夷洲，法显归国乘商船自海而还。冶铁造船技术并进，农战之器与航海之资兼备，手工业整体水平由此提升。", "16": "• 钱法之乱：三国分铸异币，蜀铸直百五铢大面虚值，吴行大泉五百当千，敛财于民而物价腾踊；东晋不铸新钱，沿用孙吴旧钱。钱币割裂紊乱，钱轻物重，交易受阻，货币经济退化为实物经济之过渡由此显现。\n• 谷帛为币：战乱铸币衰退，民间交易以谷帛为媒，绢布粟米兼充货币，剪凿布帛、湿谷薄绢之弊丛生，魏文帝一度罢钱而用谷帛。实物货币回潮显示金属铸币供给不足，商品经济受抑，交易之困由此加深。\n• 太和五铢之复：北魏孝文帝太和十九年铸太和五铢，令钱行于京师及诸州，听官民同铸，北方钱法自乱而复整。货币秩序恢复促进商贸流通，洛阳市场钱货并行，北朝币制由此渐归统一，商品经济复苏由此加速。", "17": "• 北魏统一北方：439年太武帝拓跋焘灭北凉沮渠氏，结束十六国纷争，黄河流域归于统一，与南朝形成对峙之局。北方整合为孝文帝改革奠定政治前提，南北朝格局由此形成，多民族政权建设之经验由此积累。\n• 前秦之经略西域：苻坚遣吕光西征，破龟兹而西域诸国降附，前秦声教远达葱岭，西域与中原政治联系一度恢复。经略随淝水之败而中断，然中原政权经营西域之传统由此延续，为隋唐治理西域提供先例。\n• 六镇之设：北魏为防柔然，自西而东设沃野怀朔武川抚冥柔玄怀荒六军镇，镇兵镇民戍守北边，出镇多为鲜卑贵人。六镇拱卫平城而镇人身份渐卑，积怨日深，六镇之乱由此酝酿，北朝政局因之剧变。\n• 东北之经营：公孙氏据辽东，毌丘俭征高句丽刻石纪功，前燕慕容氏兴于辽西而入主中原，高句丽渐强而与北魏南朝并遣使通好。东北边疆政权更迭与民族角逐交织，疆域经略与朝贡往来并行，边疆格局由此演变。", "18": "• 五胡内迁：匈奴羯氐羌鲜卑诸族自汉魏以来渐次内迁，居于并州关中等地，与汉人错居杂处，胡汉界限渐泯于日用。内迁改变北方族群结构，融合之机与冲突之险并存，永嘉之后诸族建国由此成为北方政治之常态。\n• 十六国兴替：刘渊建汉、石勒建后赵、苻健立前秦、慕容氏建诸燕，五胡政权迭兴迭灭，百余年间北方大小政权分合不定。诸政权或胡汉分治或力行汉化，制度探索积累统治经验，为北魏统一与整合奠定基础。\n• 孝文帝汉化：494年孝文帝迁都洛阳，禁胡服胡语、改鲜卑姓为汉姓、定族姓与汉人高门通婚、改籍贯为洛阳人，全面推行汉化。鲜卑贵族融入华夏士族之林，胡汉畛域渐消，民族融合深度空前，为隋唐统一之文化基础奠定根基。\n• 胡汉双向交融：北人习胡床貊炙，胡服骑射渐入中原生活，胡乐胡舞胡食风靡，汉族士民亦染胡风，双向涵化自然进行。民族界限在日用而不觉中消融，中华文明包容性由此增强，多元一体格局因之深化。", "19": "• 官渡之战：曹操与袁绍相持于官渡，曹操夜袭乌巢焚其粮谷，袁军溃散，袁绍忧愤而亡，曹操尽有河北之地。以少胜多之典型战例，北方统一之主导权由此归属曹操，曹魏基业由此奠定。\n• 赤壁之战：208年曹操南征荆州，刘备与孙权结盟，周瑜黄盖火攻焚其船舰，曹军败退北归，刘备旋取荆益。曹操统一天下之势受挫，三分鼎立之格局由此奠定，南北对峙之军事地理初步定型。\n• 平吴之役：晋武帝遣王濬王浑诸路伐吴，王濬楼船顺流出建业，孙皓面缚出降，三国归于西晋一统。分裂近百年的政局暂告终结，太康之治随之出现，然分封诸王与州镇之兵埋下乱源。\n• 淝水之战：苻坚率大军号称百万南下，谢玄谢石以八万北府兵迎战于淝水，趁秦军半渡而击，秦军溃散、风声鹤唳。东晋以少胜多保住江左，前秦瓦解而北方再裂，南北对峙之局由此延长百余年。", "20": "• 佛教东传之潮：汉末安世高支娄迦谶始译经于洛阳，鸠摩罗什入长安主译场，法华维摩诸经大乘义理大备，译业蔚为大观。外来宗教深植中土，译经与义解并盛，中外思想交流之高潮由此开启，影响中国思想千年。\n• 法显西行求法：东晋法显以六十余岁高龄自长安西行，度流沙、越葱岭，历天竺三十余国求取戒律，浮海而归携经籍返国，撰佛国记记行程风物。中国人西行求法之始，中印交通之实录由此留存，地理知识因之扩展。\n• 东亚册封往来：孙吴遣使通辽东公孙氏与高句丽，倭国卑弥呼遣使入贡，魏封之为亲魏倭王，南朝亦与倭国百济相通。四夷使节往来，册封朝贡网络初步成形，汉字儒学随之东传，东亚文化圈之基础由此奠定。\n• 丝路商旅不绝：河西走廊虽经战乱，西域胡商东来未断，粟特商人络绎于凉州长安，祆教渐传中土，葡萄石榴等物种入华。分裂未能阻断欧亚贸易，商业往来维系文明交流之脉，中西互通之格局由此延续。", "21": "• 三国志与后汉书：陈寿撰三国志，分立魏书蜀书吴书，行文简净而有良史之称；范晔撰后汉书，增设类传、论赞精深，表彰党锢气节。二书与史记汉书并列前四史，纪传体正史在乱世中延续，史学经世之传统由此传承。\n• 裴注之学：裴松之注三国志，博采群书百四十余种，补其阙、订其谬、辨其疑、存其异，注文所引史料多于本文。史注由训诂转向集解考异，史料范围大为扩展，考据之学由此发端，为史学方法之重要进步。\n• 十八家晋书之修：两晋南朝私修晋史蔚然成风，臧荣绪晋书勒成一家，王隐虞预干宝诸家并存，唐初官修晋书出而诸家渐废。当代史私家竞修展现史家自主精神，史才史识互见长短，官修史书体制由此酝酿形成。\n• 世说新语之纂：刘义庆招集文士纂汉末至东晋名士言行，分德行言语政事文学等三十六门，刘孝标为之作注，援引详博。志人小说之代表，摹写人物风神传神入微，清谈风气与士族生活之史料由此留存，文史价值兼备。", "22": "• 圆周率之算：祖冲之推圆周率——南朝祖冲之推算圆周率在三丈一尺四寸一分五厘九毫二秒六忽与七忽之间，又定约率密率，密率之值领先世界近千年。算学精度之高峰由此铸就，历算测地皆得其益，数学实测精神彰显于世。\n• 齐民要术：农学集大成——北魏贾思勰撰齐民要术十卷，起耕田讫制酱醋，备述谷蔬果木畜产鱼养酿造之法，引农谚古书百余种。黄河流域农耕经验之总结，精耕细作体系之集成，古代农学之地位由此奠定，后世农书奉为圭臬。\n• 水经注：郦道元注水经——北魏郦道元为水经作注，记水道千余条，兼述流域山川城邑物产风俗故实，文笔清丽如山水画卷。古代地学之集大成，山水散文之典范，地理志与游记文学之双重价值由此确立。\n• 文心雕龙：文论双星——南朝刘勰撰文心雕龙五十篇，论文体、剖情采、体大思精，钟嵘诗品品第汉魏以来诗人，溯源流、别高下。文学批评自成体系之始，创作与鉴赏之法则由此确立，南朝文风之总结影响后世文论。\n• 石窟艺术：云冈与龙门——北魏文成帝命昙曜开凿云冈五窟，帝佛合一、雄浑壮大，迁洛后龙门石窟继起，造像渐呈褒衣博带中原风韵，魏碑书法亦随之传世。造像艺术本土化进程由此开启，民族融合之艺术结晶传世至今。\n• 脉经针灸：医典之成——魏晋王叔和撰脉经，定二十四脉、明脉理证候，皇甫谧撰针灸甲乙经，厘定孔穴、明针灸之法，为针灸学第一部专书。诊断与针灸皆有经典可循，中医诊疗体系由此完备，济世之术泽被东亚。"}}, {"id": "p5", "name": "隋与唐前期", "position": "大一统的重建与盛世", "span": "581—755年", "sub": "（隋：581—618年 / 唐前期：618—755年）", "feature": "隋唐重建大一统并臻于盛世。隋结束数百年分裂，创三省六部、科举、运河、均田府兵，制度之创影响千年，然炀帝急政而二世亡。唐承隋制而损益，贞观开元相继，政治清明、经济繁荣、文化开放、民族融合，长安为国际都会，丝路臻于极盛。此期中国为世界最先进文明之一，制度输出东亚，中华文化圈正式形成，中华文明之开放包容与制度成熟达于古典时代之高峰。", "events": "• 隋灭陈之战：开皇八年文帝下诏数陈主之恶，晋王杨广统五十八万大军分八路南下，杨素率水军下三峡，贺若弼、韩擒虎自广陵、庐江渡江，589年攻破建康，俘陈后主，陈亡而南北一统，结束西晋末以来近三百年分裂之局，为隋唐盛世奠定疆域与政治前提，统一之格局由此确立。\n• 大运河之开凿：炀帝大业年间先后开通济渠、永济渠、邗沟、江南河，全长两千余公里，贯通海河、黄河、淮河、长江、钱塘五大水系，征发民力数百万，历时六年而功成，遂成南北经济之大动脉，促进经济重心南移与南北整合，漕运之利绵延千余年，泽被后世之功由此奠定。\n• 隋末农民起义：炀帝三征高丽、营建东都、巡幸江都，徭役兵役苛急，山东河北民不聊生，大业七年王薄于长白山首举义旗，自称知世郎，群雄并起，炀帝终为禁军所弑于江都而隋亡，急政亡国之鉴促使唐初行轻徭薄赋与休养生息之政，贞观治世之端由此开启。\n• 贞观之治：武德九年太宗李世民即位，次年改元贞观，虚心纳谏，任用房玄龄、杜如晦、魏徵为相，轻徭薄赋，完善三省六部与府兵科举之制，政治清明、仓廪渐实、四夷宾服，史称贞观之治，奠定唐代盛世之根基，贞观政风遂为后世帝王施政之典范，其影响垂于千年。\n• 武周革命：天授元年武则天革唐命称帝，改国号为周，为中国历史上唯一女皇帝，开创殿试、设武举、行自荐之制，破关陇门第之垄断，拔擢狄仁杰、姚崇等寒俊而控驭蕃部，为开元之治储备人才，女主临朝虽引发徐敬业兵变与政争，然上承贞观下启开元，过渡之功由此体现。\n• 开元盛世：玄宗即位后任姚崇、宋璟为相，整顿吏治、革除弊政、检田括户、抑制奢靡，开元年间户口滋盛、仓廪丰实、四夷宾服，海内殷富，行旅万里不持寸兵，唐代国力臻于顶峰，史称开元之治，亦为中古盛世之典范，其后天宝承平既久而危机潜伏，盛衰之变由此埋下。", "cells": {"3": "• 三省六部制确立：隋文帝废北周六官，确立尚书、门下、内史三省分掌执行、封驳、决策之权，下辖吏户礼兵刑工六部，唐初完善为中书出令、门下封驳、尚书执行，三省分权制衡而相权不专，集皇权与行政效率于一体，为中国古代最成熟之中央行政体制，后世官制之骨干由此确立。\n• 政事堂宰相合议：唐初宰相于门下省政事堂合议军国大政，后移至中书省并改称中书门下，设同中书门下三品、同平章事等衔，宰相由独任转为群任，集体宰相制分散相权而强化皇权，为前期政局稳定之重要保障，唐代中枢决策制度由此定型，开集体宰相制之先例。\n• 翰林学士之设：玄宗开元年间始置翰林学士院，专掌四方表疏批答与机密诏敕之草拟，分割中书舍人之权，内廷近臣参预机要，德宗以后号内相，使职差遣之风浸染中枢，为唐后期内朝压倒外朝、宦官干政之局埋下伏笔，中枢权力结构之变动由此肇端，内朝之势渐重。\n• 台省职权之变：唐前期三省职权分明，开元以后翰林学士专掌内制而中书舍人止草外制，德宗以降学士号内相，枢密使传宣命于中书，三省渐成虚衔，宰相名实相分离，中枢由三省制衡转向内朝主导，宰相之权为近侍所分，为宋代二府制之先声，皇权独尊之格局由此奠定。", "4": "• 州县两级之制：隋文帝罢郡存州，改州郡县三级为州县两级，炀帝一度改州为郡，唐兴复为州县，太宗并省州县、因山川形便分天下为十道，地方行政层级精简，官吏冗费减省而行政效率提高，统御更为直接，中央集权之地方基础由此夯实，为历代地方行政之基调。\n• 节度使之设立：唐初于边要之地置都督府总揂数州军事，睿宗时贺拔延嗣为河西节度使，始有节度使之号，玄宗缘边设安西、北庭、河西、范阳、平卢等十节度使，兼掌军政财权，边将权重而内轻外重之势渐成，安史之乱与藩镇割据之祸由此埋下，兵制政区相绾之弊已显。\n• 道制之演变：太宗分天下为十道，玄宗增为十五道，初为监察区，遣采访使巡察州县官吏，安史乱后观察使兼理民政赋税，道渐成州县之上实级政区，监察区行政化之规律再现，为唐末藩镇割据提供政区之载体，宋代路制与元代行省由此发端，高层政区之演化轨迹于此可见。", "5": "• 科举制之创立：隋文帝废九品中正与州郡辟举，命诸州岁贡三人，炀帝始建进士科，唐承隋制增明经、明法、明算诸科，以考试定去留，打破门阀对仕途之垄断，寒门庶族得凭才学进身，选官制度发生根本变革，沿用至清末凡千三百年，官僚政治之基石由此奠定。\n• 门荫与流外入流：唐科举之外，门荫、流外入流仍为重要仕途，勋贵子弟凭先代官品得荫补斋郎、卫官，三卫考满亦得放出身，胥吏积劳经考课得入流品，诸途并行而科举渐居主流，士族凭经学文化之优势延续势力，新旧选官方式并行更替之际，门第观念之渐消由此可征。\n• 学校与科举相维：中央设国子监统国子、太学、四门、律、书、算六学，州县亦立学校，生徒由学馆出而就试省闱，乡贡则怀牒自列于州县，教育、考试、选官三位一体，儒学因官学而复兴普及，唐代官僚之文化素质整体提升，学制与文官考试相维之格局由此确立，为后世所承袭。\n• 进士科之贵重：进士科试诗赋杂文，为诸科目之中最贵重者，最矜时望，时谚有三十老明经、五十少进士之说，及第者曲江赐宴、雁塔题名，座主门生结为恩门，士人倾慕而奔竞于科场，文学与政治因科举结合，文治风气由此大盛，唐代社会尚文之风形成。\n• 武举之创设：武则天长安二年始设武举，兵部主之，试长垛、马射、步射、翘关、负重诸目，兼课言语身才，以武艺弓马选拔将才，郭子仪即以武举异等出身，与文举并行而开以考试选武之先例，军功技艺得为正途进身，武人入仕之渠道由此拓宽，唐代文武并重之选官格局于斯奠定。", "6": "• 御史台三院制：唐御史台下分台院、殿院、察院三院，侍御史纠弹百僚、殿中侍御史整肃朝仪、监察御史巡按州县，分巡分察制度化，监察网络覆盖中央与地方，台官品卑权重、以小制大，为后世监察制度之定型奠定基础，唐代监察体系由此完备，历代台院之制多承其规。\n• 三司推事之制：中央遇大狱诏大理寺卿、刑部侍郎、御史中丞同鞫，号三司推事，地方大案则遣三司使前往按覆，审判、复核、监察三权分立而相互制衡，断狱有据而冤滥稍减，司法与监察相维之制由此确立，后世明清三法司会审之先例于此开创，刑事审判程序益趋严密。\n• 封驳谏诤之制：门下省给事中掌读署奏抄、驳正违失，诏敕有不便者涂窜而奏还，谓之涂归，谏议大夫、拾遗、补阙掌规谏讽谕，封驳与谏诤构成决策纠错机制，贞观之治赖此纳谏而改正过失，君主之失得以上闻而朝政少阙，古代谏议封驳制度由此臻于完备，为宋以后所沿袭。", "7": "• 开皇律与唐律疏议：隋文帝命高颎、苏威等修《开皇律》，蠲除前代枭轘之酷，定十二篇五百条，唐太宗贞观修律、高宗永徽撰律疏，成《唐律疏议》三十卷，律疏合一、体例谨严，为中华法系之代表作，日本、朝鲜、越南立法皆取资焉，东亚法律体系之格局由此奠定，影响及于近代。\n• 礼法合流之趋向：唐律一准乎礼，引礼入法，八议、官当、依服制定罪诸制明定尊卑亲疏之别，礼之所许律亦不禁，德礼为政教之本、刑罚为政教之用，礼刑交融而相为表里，中华法系伦理法之特质由此彰显，后世历代立法之精神为之一贯，礼法合流之传统于此定型。\n• 五刑十恶之定：笞、杖、徒、流、死五刑体系定型，流刑分二千里、二千五百里、三千里三等，谋反、谋大逆、谋叛等十恶承北齐重罪十条而损益之，犯者常赦不原，贵族官僚凭八议、官当而得减赎，良贱同罪异罚，法律之等级性与伦理法特征兼备，历代刑统之框架由此确立。", "8": "• 大索貌阅与输籍定样：隋文帝开皇间令州县大索貌阅，按籍核验丁口年貌，不实者里正、党长远配，又采高颎之议行输籍定样，定户等以为征课之准，括出隐漏丁口数十万，国家控制之户口大增，隋代户籍之严密由此确立。\n• 手实计帐之造：民户岁终具手实，自申报丁口、田宅之数，里正、坊正核实汇总，州县造计帐、三年造户籍，逐级上报尚书省户部，国家据以定课征发、按丁授田，户口与土田之数皆有凭籍，唐代赋役征派之基础由此奠定。\n• 户籍三年一造：唐制手实、计帐、户籍相维，户籍三年一造，具载户口、年纪、田地之数，依户等定税、按丁口授田，籍帐与均田、租庸调紧密结合，既为财政征课之据，亦为国家控制基层之具，中古户籍制度之典型由此形成。", "9": "• 均田制之推行：隋及唐初沿用北魏以来均田之制，丁男受口分田八十亩、永业田二十亩，永业可传子孙、口分身没还官，老男笃疾废疾者亦受田，官僚另有永业、职分诸田，国家授田以扶植自耕农，与户籍相维而征课有据，租庸调与府兵制之经济基础由此奠定。\n• 租庸调之法：武德定令，每丁岁纳租粟二石、调随乡土所产绫绢二丈、绵三两或布五丈，岁役二旬，不役者每日纳绢三尺代之，谓之庸，以人丁为本而计丁征课，纳庸使农民得以绢代役、专力农桑，人身控制之下尚存弹性，唐代前期财政之支柱由此形成，为租调制以来一大变。\n• 庸代役之利：以庸代役使民免旬月之征，不误农时而生产不废，纳庸之绢帛使农家副业与国用相接，府兵自备资装亦赖租调以给，农兵兼顾而民力稍纾，贞观开元间百姓安业、仓廪充盈、行旅不赍粮，赋役制度之效能由此体现，唐代民生之宽裕可见一斑。\n• 户税地税并起：唐前期户税按户等纳钱、地税按亩纳粟以充义仓，王公以下垦田亩纳二升，与租庸调并行，义仓贮粟以备凶年，太宗置义仓，高宗武后间其粟渐移国用，资产税之因素潜滋暗长，两税法代租庸调之伏笔由此埋下，税基转移之势已见端倪。", "10": "• 府兵制之完善：唐设折冲府六百三十四，分布于关内、河东诸道而举关中之众以临四方，府兵平日务农、农隙讲武、冬季教阅、轮番宿卫，自备弓刀粮麦，兵农合一而国家养兵之费甚省，贞观间兵威之盛与府兵相为表里，隋唐军制之基础由此奠定，兵农合一之制至此臻备。\n• 兵募与防人：府兵之外，战时临时征发兵募出征，官给衣粮而多仰临时科敛，事罢则散归乡里，边镇置防人岁番戍守，又用蕃兵蕃将隶于边将，兵制多元并行，高宗武后以降府兵番上失期、逃亡渐多，募兵之比例渐增，府兵制之衰落由此肇端，兵农分离之势渐显。\n• 节度使拥边兵：玄宗缘边置安西、北庭、河西等十节度使，统兵四十九万，募兵久戍而将专其兵，边镇兵力远逾中央宿卫十二万，内轻外重之势既成，安禄山身兼范阳、平卢、河东三镇节度使而拥兵自重，安史之乱遂起，唐前期兵制之败坏由此暴露，藩镇割据之祸根由是深植。\n• 彍骑与神策禁军：开元间府兵制坏，宰相张说请募壮士充宿卫，号长从宿卫，寻改称彍骑，宿卫亦行募兵，天宝间折冲府无兵可交，兵农分离而职业兵兴起，安史乱后神策军为中央禁军之主力，宦官典禁军之局由此形成，唐代兵权下移之祸遂不可解，募兵代征兵之势已成。", "11": "• 士族之渐衰：科举兴起使寒门凭文学进身，进士科尤为清贵，山东士族虽以礼法门风自高而渐失仕途之垄断，关陇集团以军功立国而趋于官僚化，庶族地主官僚崛起，社会流动加快，中古门阀政治向官僚政治之转变由此开启，唐代社会结构为之一变。\n• 良贱身份之别：唐律明定良贱，部曲、奴婢、官户、杂户、太常音声人隶于贱籍，不得应举、不得与良人通婚，同罪异罚，部曲殴良人者加凡人一等而良人殴之减一等，然较之魏晋奴客部曲，贱口数量渐减、放免渐多，人身依附稍弛，中古等级社会之松动由此可征。\n• 均田农民之分化：均田农民为国家编户之主体，然高宗武后以降土地兼并渐盛，豪强侵并、赋役繁重，农民失田逃亡，客户佃农日增，小农经济脆弱而分化加速，宽乡授田亦不足额，均田制与租庸调之瓦解由此埋下根源，社会矛盾渐积，为唐后期社会问题之伏线。\n• 寺观经济之盛：佛道并盛，寺观广占田产、庄硙相望，蓄养净人奴婢、荫庇逃户，度牒之利更滋其财，寺院地主与世俗地主并立而争利，国家户口赋税为之流失，朝廷屡议沙汰伪滥僧尼、检括寺院户口，玄宗开元初曾沙汰僧尼万二千余人，政教争利之势由此形成，兼并之患暗长。", "12": "• 经学之统一：太宗命孔颖达等撰《五经正义》，贞观中颁行天下，明经取士悉以为准，又令颜师古考订五经文字成《五经定本》，经义归一而汉魏以来南北经学之分歧渐泯，儒学重居官学之正统，科举与经义相结合而士人诵习有常，宋代经学之发展由此奠定根基，经学统一之功垂于后世。\n• 佛道之并盛：玄奘西行归国创唯识宗，法藏立华严宗、善导弘净土宗，宗派竞起而义学大盛，李氏自托老子之后而尊崇道教，追号老子为太上玄元皇帝，王公妃主多崇奉之，寺观遍布州县、寺院经济膨胀，儒释道三教并立，唐代宗教之多元格局由此形成，信仰深入民间。\n• 三教论衡之势：朝廷岁时集三教学者于殿廷论议，武德七年高祖幸国学，命三教讲论而儒者讥佛老之无君父，释道互诘而各竞其说，思想交锋之中相互吸收，佛学心性之论渗入儒学，三教由并立而渐趋融合，宋明理学吸收佛老以成新儒学之途径由此开启。\n• 排佛之议初兴：韩愈著《原道》，力排佛老，倡尧舜禹汤文武周公孔孟一脉相承之道统，以仁义为定名，元和十四年宪宗迎佛骨，愈上表切谏而贬潮州刺史，人其人、火其书、庐其居之策并见《原道》，卫道意识自此抬头，儒学复兴之呼声渐起，中唐思想转向之端由此显露，儒门重建之志已萌。", "13": "• 均田制与授田：隋唐承北齐之制颁行均田，丁男受口分、永业田百亩，宽乡授足、狭乡减半，永业田树榆枣桑麻，口分田不许买卖，身没还官，贵族官僚另有永业、勋、职分诸田，国家以授田限制买卖、抑制兼并，小农经济与国家课税之基础由此奠定，中古田制至此集其大成。\n• 私田兼并之滋长：均田令许狭乡迁就宽乡、卖充口分，永业田亦许贴赁货易，口分买卖之禁渐弛，豪强官僚置庄占田、隐匿田亩、荫庇户口，私田日滋而授田日缩，田制紊乱、税基动摇，土地私有化之趋势由此加速，田制之坏实兆于此，国家抑兼并之能力日渐衰退。\n• 庄园兴与均田瓦解：贵族官僚寺观广占田地，置庄经营、庄客耕种，天宝以降籍帐紊乱、授田遂废，客户佃农遍于畿甸，庄园经济代小农授田而起，国家再不能按丁授田，均田制名存实亡，两税法之颁行由此成为必然，中古田制之转折于此完成，此后不抑兼并遂为常制。", "14": "• 长安坊市制度：长安东西两市为商业中心，市内货财有二百二十行，四面立邸，邸店林立，坊市分离、市门以午时启闭，日暮鼓绝而闭，市署掌度量、平物价、检校交易，胡汉商货鳞次栉比，规范管理之下商业繁荣，唐代商业制度之成熟由此可见，后世市制之范本于此确立。\n• 胡商与市舶：西域昭武九姓胡商、波斯大食贾人聚居长安、洛阳、广州、扬州，贩运珠宝、香料、药材，唐于广州置市舶使以掌海外诸国朝贡贸易，中外商货往来不绝，都市胡风浸染、商气浓厚，扬州雄富甲天下，唐代对外贸易之盛由此彰显，广州遂为南方第一大港。\n• 柜坊飞钱之兴：商旅于柜坊寄附钱帛、凭帖取付，开钱币保管兑换之业，宪宗时商贾至京师委钱诸道进奏院及诸军诸使飞钱，以轻装趋四方而合券取之，号飞钱亦称便换，汇兑之制由此肇创，长途贸易免转输之险，宋代纸币之产生于此酝酿，金融信用之萌芽可见。", "15": "• 南青北白之瓷业：越窑青瓷类玉类冰、邢窑白瓷类银类雪，南青北白双峰并峙，陆羽《茶经》品第诸窑，又有唐三彩以铅釉五彩施于陶塑，驼马人物形神兼备，制瓷技术成熟而远销海外，后世名窑体系与外销瓷之基础由此奠定。\n• 丝织技艺之精进：织染署隶少府监，掌织纴色染之政，绫锦坊户技艺精湛，定州、益州、扬州绫锦名闻天下，纬锦代经锦而纹样繁丽，联珠团窠纹兼收波斯风样，丝织为出口之大宗而远行西域南海，唐代纺织技艺之精进由此可征。\n• 官营民营并行：少府监掌百工技巧、将作监掌土木营造，官府作坊以轮番匠、明资匠供役，行会约束民间作坊，官营主精工而民营供日用，丝织、造船、造纸诸业并盛，唐代手工业规模宏大、技艺精湛，官私并进之格局由此形成。\n• 造船航海之利：扬子江口广置船场，江海之舟大者长二十丈、载重万斛，出海之船以水密隔舱御险，海舶通南海、波斯诸国，贾人竞附番舶以逐利，远洋商旅与军运转运皆赖之，唐代航海能力之强由此可见，海上丝路之畅达赖之。", "16": "• 开元通宝之铸行：隋末钱货滥恶，武德四年废五铢钱，铸开元通宝，钱文改纪重为通宝，每十文重一两，出于欧阳询之手，后世沿其形制至于清末，中国钱制由纪重向通宝之转折由此完成，通宝钱制沿用千三百年。\n• 私铸恶钱之弊：盗铸之利所在而民间蜂起，恶钱杂行于市，官府屡申盗铸之禁，括恶钱以善钱易之，然销钱为器、铸钱获利者众，好恶二钱并行、物价参差，币值紊乱而市易受困，钱法之坏由此可见，禁而不绝之势终唐不改。\n• 钱帛兼行之制：铜钱与绢帛并充货币，大数用缣、小数用钱，绢帛匹段计直，军费官俸亦以帛计，乾元重宝虚值大钱扰市而旋废，钱帛兼行反映商品经济之下货币供给之不足，实物货币之残余由此可见，过渡性币制之特征明显。", "17": "• 安西北庭都护府：657年唐灭西突厥，分置昆陵、濛池二都护府以领其众，此前已灭东突厥并置安西都护府移治龟兹，统龟兹、于阗、疏勒、碎叶四镇，后设北庭都护府于天山之北，军政直接统治及于中亚碎叶之城，唐代边疆经营之盛由此奠定，丝路畅通而疆域空前。\n• 都护四镇之守：安西都护府治龟兹，四镇屯戍扼西域之要冲，戍卒更代、烽燧相望，商旅出玉门者持过所以行，诸国朝贡禀命于都护，吐蕃、突厥屡争四镇而唐军力保不失，中原政令文化西被于葱岭，西域经营之成效由此体现，唐代西北国防赖以支撑，安西健儿之名远播。\n• 羁縻府州之制：唐于突厥、回纥、党项、西南诸蛮之地置羁縻府州八百五十六，以部落首领为都督刺史，世袭统领、贡赋版籍多不上户部，因俗而治、不编齐民，都护府综领其地，怀柔远人而边地自治，羁縻之制由此确立，开因俗而治之先例，后世土司制度之渊源实在于此。\n• 边镇戍防之重：与吐蕃争河湟、与契丹争辽西，缘边置军、守捉、城、镇，烽戍相望，十节度使拥重兵镇边，戍卒岁更而募兵久戍，防御体系强化而军权外移，外重内轻之局由此成形，边防之利与割据之患并存，唐代军政格局之转变由此肇端，为安史之乱之伏线。", "18": "• 天可汗体系：贞观四年灭东突厥，四夷君长诣阙请尊太宗为天可汗，此后唐以天可汗名义行号令于诸蕃，突厥、回纥、契丹首领入朝宿卫，蕃将阿史那社尔、契苾何力统兵立功，胡汉通婚任使而无猜忌，开放包容之民族政策由此确立，唐代多民族国家气象一新。\n• 蕃将与胡风：突厥、铁勒、粟特将帅隶于唐军而立功边陲，哥舒翰、高仙芝皆蕃将而统重兵，边镇多用蕃兵蕃马，长安胡服胡食胡乐盛行，柘枝之舞、羯鼓之声动于都邑，太常乐工半是胡人，民族界限因仕宦通婚而渐泯，唐代社会兼容并蓄之风由此彰显，胡汉交融深入日常。\n• 唐蕃和亲：641年文成公主嫁吐蕃赞普松赞干布，携经史、工技、谷物种子入藏，吐蕃遣子弟入国学受业，请蚕种及造酒碾硙工匠，景龙间金城公主复和亲，唐蕃虽战和相间而舅甥之谊不改，汉藏经济文化往来日密，西藏与内地联系由此加强，统一多民族国家之发展受益于和亲。\n• 南诏渤海内附：唐扶南诏皮逻阁统一六诏而封云南王，开元间遣崔忻册大祚荣为渤海郡王，渤海遣使通贡、遣子弟入国学，习唐文、仿唐制，南诏亦数遣子弟就学成都，号称海东盛国，边疆政权尊唐正朔而自治其地，中华文化之影响由此扩展，多民族政治格局更趋完备。", "19": "• 隋灭陈之战：开皇八年文帝下诏数陈主之恶，晋王杨广统五十八万大军，杨素率水军出三峡顺流而下，贺若弼、韩擒虎分自广陵、庐江渡江，先取建康外围，589年攻破建康，俘陈后主，水陆并进、多路合击，结束近三百年分裂之关键战役由此告成，为隋唐盛世奠定疆域基础。\n• 唐灭东突厥之战：贞观三年冬李靖以定襄道行军总管节度诸军，率骁骑三千自马邑夜袭定襄，颉利惊溃，四年春冒雪进击阴山，俘颉利可汗，东突厥遂亡，漠北震动而诸部内附，北方边患由此解除，太宗获天可汗之号，唐威播于塞外，西域门户由此打开。\n• 唐征高丽之役：太宗贞观十九年亲征高丽，破辽东城而顿兵于安市城下，会天寒粮尽而还，高宗继之，显庆五年苏定方自海道灭百济，总章元年李勣拔平壤、俘高藏，高丽亡，置安东都护府统其地，然新罗渐并其境而唐势退出，东北亚格局重组而经营难久，扩张之极限由此显现。\n• 唐蕃青海之战：吐蕃并吐谷浑，唐蕃争河湟，大非川、青海之役唐军皆败，薛仁贵、李敬玄先后丧师，为唐立国以来外战之大挫，天宝间王忠嗣、哥舒翰数大破吐蕃于陇右，方收河湟之势，战线绵长而耗力甚巨，唐蕃相持之局由此形成，西陲之患牵制国力，边防之重由此可见。", "20": "• 丝路贸易极盛：陆上丝路经安西四镇通中亚、波斯、大食，海路自广州通南海、印度洋，长安、广州、扬州胡商云集，市舶使掌海外贸易，丝、纸输出而珠宝、香药输入，中外物质文明双向流通，唐代为当时世界最开放之商业帝国，丝路文明之交融由此达于高峰。\n• 玄奘西行求法：贞观初玄奘私度玉门，历葱岭、雪山至天竺那烂陀寺，从戒贤受学，遍游五印度，曲女城无遮大会辩经无对而声震五天，携经像六百余部归国，太宗敕译经于弘福寺，撰《大唐西域记》十二卷，记一百三十八国风物，佛教义学与中亚地理之知传入，中印文化交流之高峰由此树立。\n• 遣唐使与鉴真东渡：日本十余次遣唐使来华，阿倍仲麻吕、吉备真备留学受业，鉴真六次东渡，天宝十二载抵日本，传戒授律、营唐招提寺，日本大化改新仿唐制行班田收授与租庸调，汉字、律令、都城规制悉取于唐，东亚汉字文化圈由此形成，中日交流之盛可见。\n• 三夷教之传入：景教、祆教、摩尼教相继传入，贞观九年阿罗本携经入长安，义宁坊立大秦寺，祆教源出波斯而祠于两京，《大秦景教流行中国碑》记其流布，胡乐、胡舞、胡服盛行都下，多元宗教并容而未碍本土主流，唐代文明之包容性由此彰显，长安成为国际文化都会。", "21": "• 史馆官修八史：唐设史馆于禁中，以宰相监修国史，诏修《晋书》《梁书》《陈书》《北齐书》《周书》《隋书》并李延寿《南史》《北史》，凡八史，官修取代私撰而制度化，正史编纂之传统由此确立，后世正史多出官修。\n• 实录国史之修：史馆撰起居注、时政记、实录，君主言行、朝政得失按日记注，累修实录以成国史，吴兢、韦述相继典其事，记注与撰述相维，鉴戒之义存乎笔削，唐代官方史学之体系由此形成，后世实录制度之规模于此奠定。\n• 史通开史学论：刘知几久居史职，感史馆监修之牵制，景龙间私撰《史通》，内篇论史家体例，外篇评历代史书，直书曲笔之辨凛然，倡史才、史学、史识三长之说，为中国第一部系统性史学理论专著，史学自觉之里程碑由此树立。\n• 通典创政书体：杜佑历三十余年撰《通典》二百卷，分食货、选举、职官、礼、乐、兵刑、州郡、边防八门，会通历代典章之沿革，以食货为首而知政本，开创典制体史书，唐会要记本朝制度与之相辅，宋三通之编由此发端，政书之学自此立。\n• 贞观政要之撰：吴兢任史官，采太宗朝君臣问对、诏诰奏议，分君道、政体、任贤、纳谏等四十篇，类编成《贞观政要》十卷，录一代致治之嘉言，立为后世帝王之镜鉴，专题性政论史书由此开创，资治鉴戒之旨后世相承。", "22": "• 制度（三省六部与科举）：隋唐确立三省六部之中央行政架构与科举取士之选官制度，分工制衡、考试进身——官僚政治臻于成熟，制度框架为宋元明清所承袭而沿用至清末，且输出于东亚各国，日本大化改新悉仿唐制，古代政制之典范由此确立，其影响垂于千年而不衰。\n• 法律（《唐律疏议》）：永徽四年高宗诏长孙无忌等撰律疏，律疏合一体例谨严，十二篇五百条纲目分明——为中华法系之代表作，日本、朝鲜、越南立法皆取资焉，东亚法律文化圈以之为母法，礼法合一之精神为后世立法所本，中华法系之地位由此确立，影响及于近代。\n• 工程（大运河与长安城）：大运河贯通五大水系而为南北动脉，漕运岁转江淮之粟以实京师——长安外郭城街衢纵横如棋局、规制宏大，功在千秋而长安为东亚都城之范本，日本平城京、平安京皆仿其制，经济重心南移由此加速，古代城市规划之成就于此登峰。\n• 科技（雕版印刷与天文）：雕版印刷发明于唐，剑南两川印卖历日文字，市有印板之业——僧一行主持实测子午线之长度，造《大衍历》，制成黄道游仪覆矩图，文化传播之效率由此提升，天文大地测量领先世界，为宋代活字印刷与历法之进步奠定基础，唐代科技之成就由此可见。\n• 赵州桥之营造：隋大业间匠师李春于赵州洨河上建安济桥，单孔坦弧敞肩石拱，净跨三十七米余，两肩各设小拱以分洪减重，桥身以铁腰加固——其结构之巧超前代，历千四百余年而基本完好，为中国现存最早之敞肩石拱桥，桥梁营造技艺之高峰由此彰显，世界桥梁史上之杰作。"}}, {"id": "p6", "name": "唐中后期与五代十国", "position": "割据、蜕变与再统一的前夜", "span": "755—960年", "sub": "（唐中后期：755—907年 / 五代十国：907—960年）", "feature": "安史之乱为唐代由盛转衰之转折点，此后藩镇割据、宦官专权、朋党之争交织，中央权威衰落；均田租庸调崩溃，两税法代之，经济重心加速南移。黄巢起义瓦解唐统，907年朱温代唐，五代十国更迭战乱，然南方相对安定、经济持续发展。此期政治分裂动荡，制度却孕育转型：两税法奠赋税格局，科举成主要入仕途，经济重心南移完成，为宋之统一与繁荣创造条件。", "events": "• 安史之乱：755年安禄山以讨杨国忠为名起兵范阳，陷洛阳称帝，破潼关而玄宗奔蜀，马嵬驿兵变贵妃缢死，肃宗即位灵武，借回纥兵与朔方军力战八年，广德元年史朝义穷蹙自缢而乱平，唐由盛转衰之转折由此确立，藩镇割据、宦官专权之祸自此肇端，经济重心南移加速。\n• 两税法之颁行：建中元年宰相杨炎建议行两税法，户无主客以见居为簿，人无丁中以贫富为差，分夏秋两征而量出以制入，废租庸调与诸色杂税，赋税由人丁为本转为资产为本，中国古代税制之根本转向由此完成，历宋元明清之赋税框架于此奠定。\n• 元和中兴：宪宗以刚明之资嗣位，任杜黄裳、裴度主兵，先平西川、镇海之叛，元和九年力排众议讨淮西，李愬雪夜入蔡州擒吴元济，淄青李师道旋亦授首，诸镇奉命惟谨。安史乱后中央威权一度复振，然两河赋税不入有司，削藩终限于一隅，宪宗暴崩而宦官立君之局成，中兴难乎为继，元和之政与宪宗俱逝。\n• 黄巢起义与唐亡：乾符间王仙芝首义于长垣，黄巢继起而转战南北，广明元年入长安建大齐，唐借沙陀李克用之骑镇压，巢败死于狼虎谷，然唐室名存实亡，朱温降唐后专擅朝政，尽杀朝士于白马驿，天祐四年废哀帝自立建后梁，农民战争瓦解唐统，五代分裂之局由此开启。\n• 周世宗改革：郭威建后周而惩兵骄之弊，柴荣继立，显德年间整军经武，高平之战后诛樊爱能等溃将而严军律，均定田赋、毁佛铸钱、疏浚汴渠，西败后蜀、三征南唐取江北十四州、北伐契丹复三关，改革为统一奠基，赵匡胤陈桥兵变代周建宋，再统一之势由此促成。", "cells": {"3": "• 使职差遣之制：盐铁转运、度支、户部三司掌天下财赋，观察、经略、招讨诸使分掌一方军政，皆以他官带使职而差遣任事，职事官渐成寄禄之阶官，行政由职官制转向使职制，旧三省六部名存实废，因事设官、随宜任使之灵活可见，宋代官制以差遣为实之格局由此开启。\n• 中书门下合署：肃宗以降政事堂改称中书门下，列五房以理庶务，宰相聚议而印署号令出于一堂，三省分权之制塌缩为合一之体，决策与执行趋于简捷，内朝之势压倒外朝，唐代中枢体制之蜕变由此完成，宋代以中书门下为最高行政机关实本于此。\n• 枢密院权重突起：代宗以宦官充枢密使掌文书进奏，唐末遂参机密，后梁改置崇政院以敬翔为使，后唐复称枢密院掌军国机务，多用亲信武臣，枢密使之权几埒宰相，军事与行政渐分，与中书对掌文武，为宋代二府三司之先声，文武分途之中枢格局由此形成。\n• 三省名存实亡：唐后期翰林学士掌内制、枢密使传宣旨于中书，宰相之权为内朝所分，尚书六部政务多归盐铁、度支诸使，三省渐成闲司，中枢紊乱而名实相悖，旧制名存实亡可见一斑，唐季政柄下移之制度根源由此暴露，中枢之败坏与国势之衰相终始，季世之象已成。\n• 南衙北司之争：宦官掌神策禁军、居枢密之任，号为北司，宰相率百官治事南省，是为南衙，两司争权而废立相寻，文宗谋诛宦官，甘露之变败，宰相王涯等十一族被害，宦官仇士良专横，天子废立出于其手，宦官专擅之祸由此达于极点，正常行政体制遭严重破坏，唐亡之祸根深植。", "4": "• 藩镇割据之局：安史乱平，唐以降将李宝臣、田承嗣、李怀仙分帅成德、魏博、卢龙，号河朔三镇，自署官吏、不输贡赋、父子相袭，朝廷惟务姑息，诸道方镇亦各拥兵自重，中央号令不出关中，集权瓦解而割据成，唐后期最严重之政治痼疾由此形成，至唐亡而不能解。\n• 方镇为实政区：观察使例兼节度、都团练、都防御诸使，统辖数州，刺史受其节制，道遂为州县之上实级政区，地方行政由两级变三级，赋税上供、送使、留州三分，使府幕职参预民政，为宋代路制与元代行省之前奏，高层政区之演进由此可见，区划制度之转折于此完成。\n• 五代收权之措：五代诸朝惩藩镇之弊，罢支郡使直属朝廷，移易节帅、收其牙兵，置殿前诸班为天子亲军，漕运财赋归于三司，中央渐收地方之权，后周世宗尤致力于此，为宋代杯酒释兵权、强干弱枝之策提供经验，藩镇之祸由此渐弭，宋初集权之基础于此奠定。", "5": "• 科举地位之隆：唐后期进士科愈重，座主门生之恩结为朋党之渐，及第者曲江宴集、杏园探花、慈恩题名，衣冠满座而士人趋之若鹜，牛李党争两派领袖皆由科第出身而相攻不已，士人阶层壮大而官僚文士化，为宋代文官政治之成熟奠定根基，科举社会之形态于此定型。\n• 制举搜遗才：天子御殿亲策制举，贤良方正、直言极谏、博通坟典诸科间设，以待非常之才，文宗大和间刘蕡对策极言宦官擅权之祸，考官叹服而不敢取，士论惜之，寒俊得以特达，选举之途益宽，唐代选官制度之多元由此体现，文治之盛赖以维持不坠，拔擢之恩及于孤寒。\n• 科目取士定制：礼部掌贡举，进士试诗赋、明经试帖经墨义，及第后守选注官渐成常轨，寒素之家凭场屋之文进身，牛僧孺、李宗闵皆以进士起家而致位宰相，及第者多致通显，门第仕进之特权进一步削弱，选官凭才之原则由此巩固，宋代科举规模之扩于此蓄势。\n• 荫叙之余绪：公卿子弟仍以门荫入仕，径入清途而与科举分途并进，李德裕以门荫显达而不喜科场，谓朝廷显官须公卿子弟为之，然晚唐宰执多由进士出身而位极人臣，荫叙之势渐衰，新旧两途之消长由此可征，门阀政治之终结已为期不远，士庶之别渐泯。", "6": "• 台谏之失职：宦官擅权而御史不敢纠弹，谏官封驳之权为北司所夺，太和九年甘露之变，宰相王涯等十一家族诛，朝士闭口，宪纲废弛，台谏缄默自保，中枢失监而弊政丛生，唐之宦祸为历代最烈者，监察制度之败坏由此暴露，纠错机制失灵与国运同衰。\n• 考课之犹行：州县官考课以四善二十七最为目，以户口增减、赋役平允、盗贼息否为殿最，考功岁终校考，中书门下覆奏黜陟，观察使课其属县，然方镇自擅、法纪既弛，考第徒为文牍，循吏黜陟之实效渐减，考课制度之形式化由此可见，吏治之衰与藩镇之专相为表里。\n• 监军使之设：诸道以宦官充监军使，位在节将之上而专达天子，干预军政、进退将帅，监军与节帅相猜而师出无功，战阵功过决于内廷之喜怒，僖宗时监军遍于诸道，军中号令因之不一，将帅莫能自专，宦官典兵与藩镇之患相激，唐军政之不振由此暴露，武备因之隳坏。\n• 方镇兼按察：节度使例兼观察处置使，纠劾所部、黜陟官吏，监察之权下移方镇，监察与军政合于一身，朝廷御史不复分道巡按州县，地方威福自专而宪纲不行，中央监察网络之松弛由此形成，五代诸道亦以藩帅兼领按察，监察之制愈坏，宪权之移至此完成。", "7": "• 格后敕之繁兴：律令之外，随时损益之敕格渐居实用，编敕成风，宣宗大中年间纂《大中刑法统类》，以刑律分类为门而附以格敕，律文渐屈于诏敕，断狱引敕而旧律退居其次，法律渊源趋于多元，唐代立法之转向由此可见，宋代以敕代律之先例于此开启。\n• 律学传习未绝：国子监六学中有律学，置律学博士掌教，生徒习律令格式，业成者应明法科，试律七条、令三条，司法参军掌律令定罪，《唐律疏议》行世而断狱引疏以为准，注习者众，刑名之学赖以传承不绝，中华法系之统绪由此延续，司法专门人才之培养制度可见。\n• 大周刑统之修：五代各朝屡修刑律，后唐颁《同光刑律统类》，周世宗显德间诏侍御史张湜等删定《大周刑统》二十一卷，律敕合编而刑名之要归于统类，便于官吏引用，礼法合一之精神犹存，为《宋刑统》之直接蓝本，五代法制承唐启宋之枢纽由此确立，法典编纂未尝辍。\n• 赦宥频繁之弊：唐末五代赦令屡下，郊祀、改元辄降德音，强盗杀人者遇赦辄原，恶徒恃赦横行而狱囚积滞，刑威不立而法纪弛紊，周世宗惩其弊，修刑统、严窃盗之法，赦滥之害由此稍戢，法度废弛之弊暴露无遗，五代法制之乱象可见，刑政之坏至于极点。", "8": "• 两税以赀定户：两税法以资产为宗，籍帐重在丁产田宅之数，户帖、手实据以定户等高下，土户客户并籍，客户既编而逃户复业者蠲其税以劝归，旧日计丁课役之籍渐弛，赋税基础由人丁转向财产，中古户籍制度之转型由此完成，宋代五等户之制于此发端。\n• 村正里正之职：乡置里正、村置村正，里正掌按比户口、课殖农桑、检察非违，村正掌坊门巡警之职，然战乱版籍散亡，乡职多委于土豪，官府责办苛急而里正往往破家，基层治理渐赖乡族之自治，职役之制由此渐变，宋代乡役保甲之先声可见，乡官之制遂衰。\n• 乡里坊市之变：坊墙之界渐破，街衢侵街建舍，草市夜市兴于州县之外，扬州夜市千灯照碧云，乡里组织因战乱离散，无籍之客户遍野，基层控制弱化而村落自治色彩转浓，两税以见居为簿正欲收其逃亡，中古乡里制度之松动由此可见，宋代乡治之变革由此酝酿。", "9": "• 两税法之实施：780年宰相杨炎定两税法，先计州县每岁所用及上供之数而赋于人，量出以制入，户无主客以见居为簿，人无丁中以贫富为差，分夏秋两征，租庸调与诸色杂徭悉省，赋税由人丁为本转为资产为本之根本转向由此完成，后世税制之框架于此奠定。\n• 地税义仓之存：地税按亩纳米麦以为义仓，贮于州县以备水旱，凶年开仓赈给，荒政之具犹存，然两税之外又有青苗钱、间架税等加征，仓储渐移作军费，赈济之实效渐减，国家荒政与仓储相维之制可见，税外之附加潜滋，两税之后杂税复生之渐已显，民困由是加深。\n• 夏秋两征定制：两税分夏秋两次输纳，夏税不过六月、秋税不过十一月，定税之数皆计缗钱，输纳则折为绫绢米粟，钱重物轻而折纳愈苦，穆宗时从杨于陵之议改以布帛丝纩定税，征敛有常期而民困于折变，货币赋税之倾向由此显现，两宋以钱纳赋之渐开启。\n• 榷盐茶之利：第五琦始行榷盐，就场专卖而价十倍，刘晏领盐铁改行民制官收商运商销之法，民获其利而国用亦足，盐利岁入六百余万缗，天下之赋盐利居半，贞元后榷茶、榷酒相踵，禁榷之制大行而财政倚之，国家与商民争利之局成，宋代专卖制度之源由此开启。", "10": "• 募兵代府兵：开元间府兵制坏，募彍骑宿卫、长征健儿戍边，安史乱后兵农分离而职业兵定制，禁军、方镇兵、边兵各成系统，国家养兵之费转巨，两税财赋什七八以赡军，兵权移于将帅而藩镇之势成，唐代兵制之转型由此完成，宋代募兵之规模于此发端。\n• 神策禁军之祸：神策军本边镇之兵，代宗时入卫京畿，遂为中央禁军之主力，宦官任神策中尉而典其兵，十五万之众拱卫京师，天子废立决于中尉之手，甘露之变后尤甚，中央兵柄落于家奴，唐室为家奴所制，宦官专兵之祸由此达于极点，唐亡之机深植。\n• 五代侍卫亲军：后梁以宣武牙兵为骨干置侍卫亲军，后周置殿前司，殿前都点检统禁旅，枢密使掌军政、三司掌粮饷，兵权渐集于中央，然骄将悍卒拥立之习未改，郭威以邺都之兵入汴，赵匡胤陈桥兵变袭其故智，兵变立君之局由此延续，宋初惩之而矫枉过正。\n• 牙兵骄悍难制：藩镇置牙兵为亲军，父子相袭、婚媾相结，赏赐稍薄则噪而逐帅，魏博牙兵最骄，自田承嗣以来盘踞二百年，帅之废立皆出其手，罗绍威借朱温之兵尽诛牙军八千家，而魏博自此衰弱，兵骄逐帅、帅强叛上，五代兵变之频繁实源于此，骄兵之祸烈于世。", "11": "• 门阀终告消亡：科举取士使官资代血统为社会身份之准，黄巢起义屠戮公卿，白马驿之祸杀衣冠清流三十余人而投尸于河，士族谱牒散亡、礼法门风失传，五代宰相多起于寒微，冯道历事四朝而出于孤寒，中古门阀制度至此终结，社会平民化之进程由此加速。\n• 贱口渐趋解放：放免奴婢之诏屡下，官户番户渐除，部曲之制向佃客嬗变，两税客户由浮客渐成佃农，人身依附较魏晋大弛，雇佣短工见于都市之酒肆作坊，贱民阶层缩小而平民扩大，中古身份制度之松动由此可征，宋代主佃契约关系之发达于此发端，社会流动益宽。\n• 贫富对立加剧：两税以资产为宗，豪猾转嫁于贫弱，地主庄田并进而连阡陌，客户佃耕而输其半租，逃户满山而税归见在之户，赋敛愈苛，懿宗朝浙东裘甫、桂林庞勋相继起事，黄巢之变遂席卷天下，阶级矛盾之深化由此暴露，唐亡之社会根源由此形成，民变之烈前所未有。\n• 衣冠南渡之势：中原士民多避地江淮，南方户口滋殖，杨行密、钱镠保境息民而十国相对安定，水利兴修、圩田渐辟，扬州、洪州、广州商贾辐辏，吴越南唐文物之盛甲于诸国，经济重心南移之势不可逆转，为宋代南方之繁荣奠定基础，南北强弱之势由此转换。", "12": "• 儒学复兴之潮：韩愈《原道》倡仁义与道统，作《原性》论性之三品，李翱《复性书》以性善情惑立论，援佛理入儒而论心性，排斥佛老以兴名教，古文运动与之相表里，儒学由章句训诂转向义理心性，宋明理学之路径由此开启，唐代思想之转关实在于此，新儒学之端绪已萌。\n• 道统观念确立：韩愈以尧舜禹汤文武周公孔孟递相传授之统绪自任，叹孟轲死不得其传，以此抗佛家之法统，文以载道之观念随之而行，古文家以明道为己任，正统论与道统论并兴于世，儒家主体意识由此强化，宋代理学道统之论实滥觞于此，思想史之影响深远。\n• 禅学兴盛于世：六祖慧能南宗倡顿悟，不立文字、直指人心，马祖道一、百丈怀海大振宗风，百丈立清规而农禅并重，沩仰、临济、曹洞诸宗竞起，士大夫与禅师往还唱和，白居易、裴休皆倾心禅悦，佛教中国化至此完成，宋儒心性之论由此汲取滋养，禅悦之风浸染朝野。\n• 会昌灭佛：武宗会昌年间恶僧尼之耗蠹天下，用李德裕之议沙汰佛教，拆寺四千六百余所、兰若四万，还俗僧尼二十六万余人，收寺田以充两税户，铜像钟磬铸为钱币，三夷教并遭禁绝，寺院经济受重挫，佛教诸宗由此衰落而禅净独盛，排佛思想之影响深远，会昌法难遂为佛门大劫。", "13": "• 均田制之瓦解：授田久已不足，天宝间户籍所载之田多为虚数，两税法行而朝廷不复授田，田制之文遂废，兼并之家连阡陌，庄田代小农授田而起，国家不再干预土地分配，中古国家土地所有制让位于私有之大势由此完成，宋代不抑兼并之制实基于此。\n• 田讼赋役之困：户籍失实而田亩隐漏，豪民诡名挟佃以避税，税役不均而民讼无门，两税以见居为簿欲均而不能，逃户之税摊于亲邻，赋重民逃而成恶性循环，土地问题成为乱政之根源，五代诸国屡行检田定税而终难根治，田政之弊深可见，为宋代田制改革之背景。\n• 庄田田制代兴：官庄私庄遍于畿甸，庄有庄宅、田土、碾硙之属，佃客耕种而纳租于主，寺观庄田尤盛，会昌检括寺院田产可见其规模，地主庄园经济为主而自耕农渐少，土地私有深化而租佃制扩张，赋税不得不依资产征收，宋代租佃关系之发展由此奠基，中古田制之转折完成。", "14": "• 经济重心南移：安史乱后江淮财赋甲于天下，韩愈谓当今赋出于天下而江南居十九，扬州雄富冠天下而有扬一益二之称，运河漕运转东南之粟以实京师，刘晏改革漕运岁转百万石，北方残破而南方相对安定，经济重心南移之趋势由此确立，宋代倚南方立国之局于此奠定。\n• 便换飞钱行用：诸道进奏院及诸军诸使为商贾代纳钱于京师，合券而取于诸道，号飞钱亦称便换，柜坊寄附钱帛、凭帖取付，长途贸易免转输之险，金融信用流通之具渐备，为宋代交子之产生准备条件，唐代货币信用之发展由此可见，商业运转因之灵便。\n• 榷商与市舶：广州置市舶使掌海外贸易，通海夷道达于波斯湾，蕃舶岁至而犀象珠玑充溢府库，五代吴越、闽、南汉皆倚海市以通商，钱镠、王审知招徕蕃舶而岁收其利，禁榷与外贸相维，地方政权竞逐商利，海外贸易之发展由此可见，宋元市舶司之设于此发端。", "15": "• 秘色瓷与南北窑：越窑烧成秘色瓷，釉如千峰翠色，法门寺地宫所出秘色瓷为其明证，邢窑白瓷类银类雪，南青北白之局延续未衰，长沙窑首创釉下彩绘而题诗其上，瓷器为外销之大宗，经海路远达西亚，制瓷技艺之精进由此可征，宋代名窑体系于此蓄势，唐代瓷业之盛可见。\n• 丝织产地广布：定州何明远家有机杼五六百张，私营丝织之规模可见一斑，官绫锦坊与民坊并作，越州缭绫、亳州轻纱名闻天下，缭绫织作费功而纹样生动，白居易《缭绫》诗状其精巧入微，丝织为南货北上之大宗，技艺传承而未衰，唐代纺织业之持续发展可见，江南织作尤盛。\n• 造纸印刷勃兴：益州麻纸为官府文书专用，剡溪藤纸、宣州宣纸争奇，纸张普及而书籍之价渐廉，雕版印刷起于民间，剑南两川印卖历日，后唐宰相冯道奏令国子监校刻九经，历四朝而成，官刻儒经由此始，知识传播加速而成本大降，宋代刻书之业于此奠基。\n• 造船技艺精进：刘晏督漕运，于扬子县置十船场，造歇艎支江船二千余艘，每船载千石行于汴淮，南方海船宏敞耐波，商贾乘之通南海、波斯，水密隔舱之法御险于重洋，漕运与沿海贸易皆赖之，转东南之粟以给京师，造船技艺之精进由此可征，海上丝路之通利赖以支撑。", "16": "• 钱荒与虚值大钱：两税计钱而纳实物，钱重物轻，民输税则加价以求钱，绢帛之价愈贱，销钱为器、铸像者众而钱愈少，穆宗诏改以布帛丝纩定税以纾其困，会昌铸钱、禁铜之令相踵，钱荒终唐不解，货币不足与商品经济之矛盾由此暴露，宋代钱荒交子之根源可于此求之。\n• 恶钱禁而不止：民间销钱铸器、盗铸恶钱，官钱恶钱杂行而物价腾踊，折算不齐而市易失信，宪宗元和间严禁销钱为器、钱不得出界，置钱监铸钱以广供给，然获利所在私铸不止，好钱恶钱并行而民受其困，币制之乱由此可见，钱法之坏与财政之困相为表里。\n• 楮币之先河：五代楚王马殷用高郁之策铸铅铁钱，商旅出境铁钱无所用，悉易他货而去，遂致百货流通于境内，闽铸开元通宝铅钱行于境内，蜀地行铁钱而重难致远，民间私券渐萌交子之雏形，信用货币之观念由此萌芽，宋代交子之产生于此发端，币制之地方化可见。\n• 绢帛渐退为币：唐初钱帛兼行，绢帛为计价之大宗，后期铜钱流通日广而绢帛渐退为折纳之物，岭南以银为货，西部边地犹行布帛，货币由实物与铜钱并行渐趋以钱为主，贵金属渐入货币之列，货币经济之深化由此可见，宋代银钱并行之局于此蓄势，实物货币渐衰。", "17": "• 藩镇御边失序：安史乱起，河陇戍卒东调，吐蕃乘虚尽取陇右河西，安西北庭孤悬绝域，将士坚守数十年而外援不至，回鹘道绝后音问遂绝，于阗、龟兹相继陷没，唐之西疆退至关陇，边疆控制体系崩解，国防线内缩之势由此形成，西域经营之成果尽失，河西沦陷之痛深矣。\n• 靺鞨渤海之守：渤海仿唐制立五京十五府、六十二州，号称海东盛国，遣使朝贡不绝而唐亦羁縻之，黑水靺鞨臣附于唐而控制转疏，契丹兴起后东疆渐为所迫，中原声教所及虽远而实权有限，羁縻名义与控制之实相分离，唐代东疆经营之局限由此可见，朝贡体系维系名义。\n• 羁縻之弛与复：唐后期羁縻府州名存实亡，回鹘、吐蕃、党项诸部叛附无常，宣宗大中年间张议潮率沙州起义，收复河湟十一州，图籍献于朝廷，然唐力不能久守，五代中原自顾不暇，边疆部族自立，惟朝贡之礼犹存，统御之实已薄，名义宗主权至五代犹存。", "18": "• 回鹘助唐之关系：回纥出兵助唐平安史之乱、收复两京，与唐绢马贸易而一马易绢四十缣，价直相偿而回鹘骄横，德宗改回纥为回鹘，太和公主嫁回鹘可汗，开成间回鹘为黠戛斯所破，部众西迁甘州、西州，漠北格局为之一变，民族关系以利相结之特征由此体现。\n• 沙陀入主中原：沙陀朱邪部内附而迁于代北，朱邪赤心以讨庞勋之功赐姓李名国昌，其子李克用据太原，率代北之兵镇压黄巢，封晋王而与朱温争衡，其子李存勖建后唐，石敬瑭、刘知远皆其部将，后唐后晋后汉三代皆沙陀所建，北族武人入主中原之局由此形成。\n• 唐蕃和战相寻：吐蕃陷河陇而唐蕃战争频仍，长庆间唐蕃会盟，立《唐蕃会盟碑》于逻些，甥舅二主商量社稷如一，盟后边境稍安，德宗时平凉劫盟而和局屡破，大中年间张议潮归唐、吐蕃内乱自分，汉藏茶马贸易渐兴，和盟之精神由此传承，民族交融之格局可见。\n• 南诏叛附无常：南诏受唐册封而叛附不定，劝丰祐遣兵陷成都外郭，掠子女工匠数万而去，世隆僭号称帝而与唐绝，屡寇安南、邕州，高骈破之而南诏遂衰，然南诏用汉人郑回为相，遣子弟就学成都，慕华之心与叛掠之行并存，云南与内地之联系赖文化以维系。", "19": "• 安史八年之祸：755年范阳节度使安禄山以十五万众反，渡河陷洛阳，哥舒翰守潼关而玄宗促战，灵宝一败潼关失守，两京相继沦陷，郭子仪、李光弼以朔方军力战，回纥兵助收长安，史思明再叛复陷洛阳，相州之败尤剧，八年间中原糜烂，唐由盛转衰之转折由此确立。\n• 唐蕃河湟之战：吐蕃尽取河西陇右，代宗广德间一度陷长安，立傀儡而旋退，凤翔以西尽没，唐蕃会盟而平凉劫盟复起，唐使死伤殆尽，西川节度使韦皋屡破吐蕃，大中年间河湟归唐而吐蕃内乱自分，数十年边战耗竭唐之力，外患牵制而内忧益深，西陲之患由此可见。\n• 黄巢横扫半壁：王仙芝起于长垣，黄巢继为义军首领，避实击虚而转战千里，渡江入浙、开山路七百里趋福建，陷广州而旋北，广明元年破潼关入长安，即位称大齐，李克用率沙陀骑破之，巢退至狼虎谷而死，历时十年波及大半中国，唐之统治因之崩溃，农民战争之规模于此空前。\n• 藩镇相攻之衅：朱温与李克用争河东而相攻数十年，后唐灭后梁，石敬瑭割燕云十六州以求契丹援，后晋遂亡于契丹，刘知远乘之建后汉，郭威、柴荣继起，高平一战整军经武，淮南之战取江北十四州，兵连祸结而中原板荡，武力代德为易君之常，兵变之习由此延续。", "20": "• 海陆丝路并行：吐蕃据河陇而陆路阻断，海路通波斯、大食、三佛齐诸国，广州、扬州、明州贾舶云集，中国商船远涉重洋，阿拉伯商人苏莱曼记中国海舶之巨，贾耽记边州入四夷之路尤详海道，香料、犀象、珠宝输入而丝瓷外销，海上丝路之地位由此超越陆路，宋元海外贸易之盛于此发端。\n• 商舶与蕃坊：大食、波斯贾人侨居广州、扬州，蕃坊置蕃长司而胡贾自守其俗，大食国人李彦升举进士第，新罗人崔致远宾贡登第而仕于扬州幕府，宾贡之制许蕃客应试，外来士人参与科场，中外人员之交流由此可见，唐代社会之开放气象延续不衰，侨居之制遂启后规。\n• 佛教东传新波：义净自广州取海路赴天竺，归译梵本五十六部，著《南海寄归内法传》，日僧圆仁随遣唐使入唐求法，巡礼五台山，著《入唐求法巡礼行记》，详记会昌法难之状，为唐末社会之实录，晚唐五代禅僧东渡、求法僧不绝于途，东亚文化圈赖交流而维系。\n• 三夷教之余绪：会昌禁佛而景教、祆教、摩尼教并遭禁绝，摩尼教南流入闽，呼禄法师入闽传教，泉州福州之间潜行不绝，景教寺院虽废而其碑埋没长安、后重见于世，教士匿于民间而余绪未绝，外来宗教之存续由此可征，宋元沿海多元宗教之盛于此见端。", "21": "• 旧唐书之纂修：后晋设史馆修唐史，宰相刘昫监修，张昭远、贾纬等纂成二百卷，采唐实录国史旧本而仓促成书，唐二百八十九年之文献赖以存传，乱世修史而保存之功巨，二十四史中唐史由此传世，五代修史承唐启宋，官修正史之体制赖以延续，史职未因乱而废。\n• 杂史笔记之兴：乱世士人私撰杂史而笔记蔚兴，王定保《唐摭言》详进士科掌故、记科场与社会百态，孙光宪《北梦琐言》录唐末五代轶闻，高彦休《唐阙史》补正史之阙，史学取材由官修渐及私撰，野史笔记之传统由此奠定，宋代笔记史学之盛于此发端，私史之价值可见。\n• 会要实录续修：德宗时苏冕撰会要四十卷，宣宗时崔铉等续修，宋初王溥增补成《唐会要》一百卷，又辑《五代会要》，分门辑一代典章以类相从，实录、日历按朝纂录，虽经战乱散佚而史职未辍，后世考唐制多赖之，典制之学因以传承，制度史之文献基础由此奠定。", "22": "• 制度（两税法）：两税法以资产为宗、分夏秋两征，废租庸调与诸色杂徭——赋税由人丁为本转为资产为本，中国古代税制之根本转折由此完成，宋元明清皆沿其框架而量出制入之原则相承，一条鞭法摊丁入亩皆其流裔，财政制度之变革影响千年，中古税制之典范于此确立。\n• 科技（雕版印刷）：雕版印刷兴于民间而渐及官府，冯道奏刻九经，历四朝二十余年而成——书籍复制之成本大降而知识传播加速，儒经有定本而文教普及，后世刻本之利赖此发端，为宋代活字印刷与刻书业之繁荣奠定技术之基，中国印刷文明之地位由此确立，功在文治。\n• 史学（旧唐书与政书）：后晋官修《旧唐书》二百卷，天福六年诏修、开运二年成书，赵莹始倡其议，刘昫监修而张昭远等纂成——唐代文献赖以存传，政书会要之学承杜佑《通典》而续，王溥《唐会要》《五代会要》为制度史之渊薮，史学在乱世中不绝如线，典制文献之基础由此奠定。\n• 文学（古文与晚唐诗）：韩柳古文运动倡文以明道，散体取代骈体——文风之改革影响宋明文章之体格，李商隐、杜牧诗工丽深婉而号小李杜，皮日休、陆龟蒙讽喻之作亦工，词兴于晚唐，后蜀赵崇祚编《花间集》行于西蜀，文学体格由此嬗变，唐诗宋词承启之枢纽在于此期。"}}, {"id": "pliao", "name": "辽", "isNew": true, "position": "草原帝国与南北面官", "span": "907—1125年", "sub": "契丹 · 南北面官 · 四时捺钵", "feature": "辽是契丹族建立的草原帝国，与北宋长期并立。耶律阿保机于916年称帝建国，取得燕云十六州后成为横跨草原与农耕区的二元帝国。辽以“南北面官”分治——北面以国制治契丹，南面以汉制待汉人；皇帝四时捺钵、以“行朝”为政治中心；斡鲁朵与头下军州构成独特的贵族领地经济。澶渊之盟后宋辽维持百余年和平，沿边榷场互市繁盛。", "events": "• 从契丹到辽朝：契丹与鲜卑同源，北朝至隋分为八部；唐前期以大贺氏为联盟长、称可汗，唐中期遥辇氏代之；迭剌部耶律氏世代担任军事首长夷离堇\n• 建国：907年耶律阿保机取代可汗，916年正式称帝（辽太祖），建元神册，国号契丹，营建上京临潢，创制文字、制定法律\n• 扩张：先后征服奚族、室韦、渤海国；辽太宗耶律德光助后晋灭后唐，取得燕云十六州；947年灭后晋，始建国号为辽\n• 澶渊之盟：1004年宋辽订盟，宋每岁输银十万两、绢二十万匹，两国约为兄弟之国，此后百余年基本维持和平\n• 灭亡：1125年金灭辽；耶律大石西走，建立西辽", "cells": {"3": "• 南北面官制：北面官以国制治契丹等草原民族，南面官以汉制待汉人，最高机构均为枢密院（北枢密院、南枢密院）\n• 高官多由世选产生，燕云汉族大姓亦有特殊政治地位；另设科举选官，但地位并不重要，至辽末方有变化", "4": "• 部族与州县并行：契丹、奚等草原民族按地区分部、设节度使管理；汉人与渤海人居住地则设州县\n• 五京：上京临潢府等五京严格说并非正式首都，更近似于镇抚地方的首府", "5": "• 世选与科举并行：高官多由世选，科举地位不高，辽末渐重", "7": "• 因俗而治：北面行契丹旧法，南面用汉法，形成二元法制", "8": "• 斡鲁朵与头下：皇帝、摄政皇后及部分皇子建斡鲁朵（共十二个），下有直属军队、民户、奴隶与州县，为个人私产；头下（头下军州）为贵族领地，其属民称“二税户”\n• 二税户：头下属民依附领主，向领主交租的同时仍需向官府纳税", "10": "• 斡鲁朵军与部族军：斡鲁朵拥有直属军队，构成独立的经济军事单位，为辽朝武装力量的重要来源", "11": "• 贵族色彩浓厚：皇族、后族与世选高官把持政权，头下属民与奴隶处于依附地位", "12": "• 崇佛与儒学并行：佛教盛行，汉地推行儒学，但未形成系统的思想统制", "13": "• 头下军州与斡鲁朵领地：贵族领地与皇帝私产并存，是辽代土地占有的突出特色", "14": "• 榷场互市：澶渊之盟后沿边开设榷场，与北宋互市贸易，岁币与贸易并行", "15": "• 双重风格的手工业：受汉地与草原双重影响，鸡冠壶、辽三彩为代表", "16": "• 钱帛兼行：自铸年号钱，但流通中宋钱与布帛并用", "17": "• 四时捺钵：皇帝保持游牧传统、四季迁徙行营，捺钵成为国家政治中心，又称“行朝”\n• 因俗而治：以南北面官分统草原与汉地", "18": "• 二元帝国：契丹、奚、渤海、汉等多族共存，以南北面官分而治之", "19": "• 高梁河之战与雍熙北征：宋太宗两次伐辽大败（岐沟关之败），此后宋人“不敢北向”\n• 澶渊之盟：1004年订盟，宋辽维持百余年和平，沿边开设榷场", "20": "• 草原丝路与东西交通：辽联结草原与中原，沟通西域、高丽及中亚", "21": "• 《辽史》为元人所修；契丹大小字碑刻与辽代国史，是研究辽史的重要资料", "22": "• 契丹大小字\n• 辽三彩、鸡冠壶等陶瓷与金银器\n• 佛塔建筑（应县木塔）"}, "note": "辽（916—1125）建国早于北宋，与北宋长期并立；澶渊之盟后维持百余年和平，故此页排在两宋之前。"}, {"id": "p7", "name": "两宋", "position": "文官政治与经济革命", "span": "960—1279年", "sub": "（北宋：960—1127年 / 南宋：1127—1279年）", "feature": "两宋承五代之乱而起，宋太祖杯酒释兵权，立文官政治、守内虚外之国策，强干弱枝以绝藩镇之祸。科举养士、台谏张权，士大夫以天下为己任，政治文化之成熟冠绝帝制时代；经济重心南移完成，商业城市勃兴，活字火药之术并出，科技文艺并臻高峰。然积贫积弱之积弊深植，新法党争不已，终以和战失据、军力不振而亡于金元外患。两宋之盛在文教，之弱在兵戎，其制其运皆为后世所鉴。", "events": "• 陈桥兵变与北宋建立：960年赵匡胤于陈桥驿被拥立黄袍加身，代周建宋，定都东京开封。鉴于唐末五代武人擅权之祸，立重文抑武之国策，收兵权而用文臣，文官政治之格局由此确立，为两宋三百年制度之基石。\n• 杯酒释兵权与统一：太祖宴石守信等宿将，讽以富贵，诸将称疾请解兵柄；其后先南后北，次第削平荆湖、后蜀、南汉、南唐，太宗时亲征灭北汉，结束五代十国之分裂。兵将分离之弊亦由此而生，积弱之端肇于此。\n• 澶渊之盟与宋辽对峙：辽军南下深入，宰相寇准力请真宗亲征澶州，士气大振；和约定为兄弟之国，宋岁输银绢三十万。此后宋辽百余年不识兵戈，边境榷场贸易兴盛，以岁币换和平影响深远，为宋辽对峙之定局。\n• 庆历新政：仁宗任范仲淹为参知政事，上答手诏条陈十事，明黜陟、抑侥幸、精贡举、择官长、均公田，以整顿吏治为先。裁汰冗滥而触权贵之利，谤议蜂起，不及两年而罢，然开王安石变法之先声，宋代改革方向由此而定。\n• 王安石变法：神宗任王安石推行青苗、募役、方田均税、农田水利、保甲、市易诸法，以富国强兵为号召。因执行偏差与新旧党争而屡兴屡废，神宗身后新法尽废，北宋政局因之分裂为两党，党争之祸影响至深。\n• 靖康之变与南宋建立：金军两度南下攻破开封，掳徽钦二帝北去，北宋亡；康王赵构即位于应天府，后定都临安，史称南宋。中原沦陷而偏安江左，宋金对峙格局形成，民族矛盾空前尖锐，偏安之局由此而始。\n• 南宋抗金与宋亡：岳飞、韩世忠等屡败金军，高宗与秦桧主和，以莫须有之罪杀岳飞，绍兴和议划淮为界；其后联蒙灭金，元军陷襄樊、临安，崖山兵败，陆秀夫负帝昺蹈海，南宋亡，抗金精神激励后世。", "cells": {"3": "• 二府三司制：中书门下为最高行政机构，长官称同平章事，副以参知政事；枢密院掌军政，与中书对掌文武，合称二府；盐铁、度支、户部三司总理财赋，号为计省。相权一分为三，皇权高度强化，为中央官制之重大变革，影响及于明清。\n• 官、职、差遣分离：官以寓禄秩而不任事，职以待文学之选，差遣为实际职务，名实分离；朝廷得以随意升降调遣而驭下，加强皇帝控制，然官员冗滥、机构重叠，冗官之弊由此而成，为庆历新政与熙丰变法所力图整顿。\n• 台谏合一与宰相反制：御史台与谏院职能合流，台谏官由皇帝亲擢，宰执不得荐举，许风闻奏事，弹劾百官并及宰相；监察权独立于相权之外，制衡之密超越前代，然台谏卷入党争，沦为攻讦之具，为北宋后期政争之伏笔。", "4": "• 强干弱枝之策：太祖惩五代方镇之祸，收精兵于禁军，制钱谷于转运使而财归中央，削节度使之权而以文臣知州事。兵权财权政权尽集于朝廷，藩镇割据之弊自此不作，然州县空虚而边防乏力，积贫积弱之患由此而萌。\n• 路州县三级制：废节度使辖区，以路为高层政区，下设州、县两级，府、军、监与州同级；诸路并置监司分掌财赋、刑狱、兵民，互不统属而直达朝廷。地方权力分散相制，藩镇之祸彻底革除，行政效率因政出多门而受累。\n• 帅漕宪仓四司：诸路置安抚使司掌兵民、转运使司掌财赋、提点刑狱司掌司法、提举常平司掌常平仓与农田水利，合称帅漕宪仓。四监司互不统属，分权相维而地方无由专擅，中央集权因之加密，政出多门之弊亦随之而显。\n• 通判与知州：州以文臣为知州，又设通判为贰，号监州，公文非通判连署不得行下。以副贰监正官，地方权力层层制衡，中央政令直达州县，藩镇之祸遂绝，然事权分割、掣肘过多，州县施政效率大损，制度代价由此而显。\n• 乡里与保甲：县下编乡里以管治安赋役，王安石行保甲法，十户为保、五十户为大保、十大保为都保，农隙教阅，寓兵于农。基层控制与军事动员相结，省养兵之费，然教阅扰农、保正勒索，民间骚然，遂成新法争议之焦点。", "5": "• 科举制度完备：三年一贡举，解试、省试、殿试三级递进，殿试皇帝亲策，进士及第即释褐授官，取士名额远迈唐代。寒门俊秀由科第进身，状元及第荣于拥节，文官政治之基础由此奠定，社会流动空前活跃。\n• 糊名誊录与锁院：省试行糊名、誊录，考官不得知举子姓名笔迹，又行锁院、别头试以避亲嫌，殿试亦然。防弊之密冠绝前代，取士不问家世，考试公平达于古代高峰，士人凭才学进退，宋代社会开放之风由此形成。\n• 恩荫之滥与冗官：高官岁时恩荫子孙亲族，一人入仕可荫及数十人，又许进纳买官，仕途壅塞。恩荫与科举扩招并进，官僚队伍膨胀，俸禄赏赐浩繁，冗官冗费并起，为积贫之根源，至北宋中叶积重难返，改革呼声因之而起。", "6": "• 台谏制度强化：御史台掌纠察官邪，谏院掌规谏讽谕，两职渐趋合一；台谏官由皇帝亲擢，许风闻弹劾而不任其咎，监察独立于政府之外。言路开放为宋代政治之特色，然党争中台谏沦为倾轧之工具，为政局动荡之伏笔。\n• 提点刑狱司：路置提点刑狱公事，掌一路司法，岁巡所部，录问囚徒，平反冤狱；死刑须经提刑司详覆，州设司理参军专鞫狱事，审、判分离而相制。司法程序严密而慎刑恤狱，为宋代法制文明之体现，冤狱较前代为少。\n• 路级监司监察：转运、提刑、提举常平诸司号为监司，岁行所部，察举官吏贤否、按劾赃滥，互察互制而皆直隶朝廷。监察网络密布州县，地方威福自专之弊稍戢，多层次监察体系由此确立，中央集权于斯强化。\n• 宋刑统与编敕：太祖时刊印颁行宋刑统，为传统社会第一部刻版法典；其后敕文累积，编敕以时修订，敕律并行而敕优律劣。成文法体系因时损益、适应性强，开后世律例并行之先例，中华法系于此更见成熟。", "7": "• 宋刑统：963年窦仪等删定颁行，凡十二篇、五百零二条，律文之后附以相关敕令格式，刊版印行，为古代第一部刊印颁行的法典。立法承唐律而有所损益，影响及于元明清立法，法典编纂自此进入刻版颁行之新阶段。\n• 敕律并行与断例：编敕随时而修，以敕补律、以敕代律，神宗以后敕为最要；又有断例、指挥，法律形式趋于多元。因时制宜、应变便捷，然法出多门，吏得因缘为奸，司法轻重任情，法治之弊由此而生，为后世所深鉴。\n• 刺配之刑：集杖脊、刺面、配役三刑于一身，死罪减等者多改刺配远恶军州。其法承五代而来而宋代用之弥繁，意在代死宥生、实边补军，然黥面之辱终身不涤，军卒逃亡相踵，刑制趋于苛酷，宋代重典驭下之弊于斯可见。\n• 凌迟入刑：凌迟者脔割其肉而毙之，起于五代，仁宗时始用于荆湖以惩妖言之狱，神宗以后渐为常法，凡大逆十恶重罪多用之。刑之惨酷悖于恤刑之义，以峻法威吓之术至斯而烈，明清沿而不革，专制刑罚之酷由此可见。", "8": "• 主客户制：以有无常产分主户、客户，客户编入户籍而以租佃为生；仁宗时下诏客户去留由己，地主不得抑勒。佃农人身依附显著松弛，租佃关系契约化，社会结构由身份而趋契约，为古代人身解放之重要环节，意义深远。\n• 五等丁产簿：户籍按田产钱物分五等，以定差役之轻重，又行丁帐、保甲簿等册籍；王安石行方田均税法，清丈土地而均平赋役。户籍与资产税制相结，征派较前合理，然豪强隐产诡寄，丈量终难彻底，清田之政成效有限。\n• 保甲与乡约：保甲编民为保，教阅武艺而防盗贼，兼行保马、保伍之法；吕氏兄弟创吕氏乡约，德业相劝、过失相规、礼俗相交、患难相恤，开民间自治之先例。官控与自治并行，宗族乡党组织由此而兴，基层格局为之一新。", "9": "• 两税与杂变之赋：夏秋两征而承唐两税之名，支移、折变、和买、和籴诸附加名目繁多，正税之外杂税丛生。民户负担沉重，蜀地尤为困敝，为积贫与民变之根源，王安石理财欲整饬而成效不彰，民困终宋未能纾解。\n• 募役法：改差役为民户纳免役钱、官府雇人充役，旧时差役由上等户轮充而倾家荡产者众。免役法使力役转为货币代役，人身束缚减轻，官府得钱雇役而政务不废，然贫户出钱负担加重，元祐更化尽废新法，役法反复而扰民。\n• 方田均税与经界法：方田均税法清丈田亩、按土地肥瘠定税，遭豪强抵制而罢；南宋李椿年行经界法，核实田亩、绘图造册，或行或辍。两度清田皆难竟其功，隐田诡寄终宋不治，田赋不均为财政之痼疾，隐患深植。", "10": "• 募兵制与养兵：禁军、厢军、乡兵、蕃兵诸军并立，灾年募饥民为兵以防民变，兵农分离而职业化。养兵之费岁入太半，冗兵百万而战力不称，军费成为财政最大开支，积弱之局与养兵之策互为因果，为变法者所深忧。\n• 更戍法与将从中御：禁军番戍移屯，兵无常帅、帅无常师，将不识兵、兵不识将；临阵阵图由皇帝审定颁授，将从中御而不许便宜行事。防弊至密，将领拥兵之祸遂绝，然兵不习将、将不专兵，战力大损，为积弱之军事根源。\n• 南宋屯驻大兵：绍兴间以岳飞、韩世忠、张俊、刘光世诸军为屯驻大军，驻防沿江要地，家军色彩浓厚。御金之效远胜北宋之军，然高宗深忌武将，收三大将兵权，岳飞竟以冤狱死，中兴之业因之内挫，兵柄遂归枢密。", "11": "• 士大夫与皇帝共治：科举扩招造就士大夫阶层，俸禄优厚、进退以礼，范仲淹倡先天下之忧而忧，与士大夫共治天下成为朝野共识。士人政治主体意识高涨，文官政治臻于成熟，为宋代文化昌盛之社会基础，影响及于元明清。\n• 租佃制下的农民：客户占民户大半，租佃契约普遍，地租行分成、定额两制，佃户身份较唐代部曲为高。生产积极性提高而兼并剧烈，赋敛与地租并重，丰年不免冻馁，钟相杨幺起义起于等贵贱均贫富之呼号，民变由此时有。\n• 坊市崩解与市民阶层：坊墙夜禁俱废，商铺临街、夜市通宵，瓦舍勾栏遍布汴京临安，说书、杂剧、傀儡诸艺繁兴。商人工匠与闲人杂处，市民阶层壮大，行会团行以业相聚，俗文学应运而兴，社会结构呈现近世气象。", "12": "• 理学兴起与集大成：周敦颐、张载、二程建太极、气与天理诸说，南宋朱熹集其大成，理气心性之辨精密，主格物致知、存理灭欲。儒学由章句训诂进于哲学思辨，南宋后期立于官学，此后七百年官方哲学之地位由此确立，泽被东亚。\n• 心学与事功之学：陆九渊倡心即理、发明本心，与朱熹鹅湖之会论学不合；陈亮、叶适倡事功，言功利而讥空谈性命，主张经世致用。学术分派并峙，心学开明代阳明学之先声，事功之学承浙东务实传统，儒学内部之争于斯可见。\n• 三教合流与信仰世俗化：理学援佛道思辨以证儒家人伦，排其出世而纳其精微；禅宗不立文字而士大夫好之，内丹之说行于民间，佛道渐融于伦理日用。三教交融而以儒为主干，士人精神世界趋于圆融，民间信仰杂糅并存。", "13": "• 田制不立与不抑兼并：宋不立田制、不抑兼并，土地听凭买卖，国家不行均田之法。土地私有制主导，千顷之家与贫无立锥并存；土地市场化遂为租佃经济与商品经济繁荣之前提，田价岁增而兼并愈炽，为社会动荡埋下隐患。\n• 租佃制发达：地主出田而佃农出力，定额租渐居主导，佃契载明租额与退佃之约；佃农迁徙去留渐得自由，永佃之俗亦渐萌芽。租佃关系成为农村最主要生产关系，人身依附松弛，生产效率提升，南方精耕细作赖此而深化。\n• 圩田梯田与围垦：江南圩田堤塘纵横、闸窦备具而旱涝有备，闽粤梯田缘山而上，湖湘垸田填湖而成。耕地大辟而亩产倍增，占城稻推广于江淮，江南遂为天下粮仓，支撑人口过亿与经济重心南移之完成，财赋尽出于东南。", "14": "• 坊市制瓦解与城市变革：坊墙拆而市巷通，店铺临街，夜市至三更、早市五更复开，汴京、临安人口逾百万。商业突破时空之限，草市茁为镇市，城市由政治堡垒转为经济都会，城市变革完成于北宋，市民生活空前丰富。\n• 交子与会子：四川铁钱重滞而交子兴，初由商人联保发行，后收归官办，设益州交子务，以铁钱为本位；南宋行会子于东南，分界流通。信用货币应商品经济而生，为世界最早纸币，便利贸易而官府滥发致贬值，金融制度之创举。\n• 市舶司与海外贸易：置市舶司于广州、泉州、明州、杭州诸港，抽解、博买制度化，海商出洋给公凭；泉舶通南洋、印度、大食，泉州后为世界巨港。市舶收入以充国用，海外贸易之盛为前代所未有，海上丝路由此而极盛。", "15": "• 五大名窑与景德镇：汝、官、哥、钧、定五窑并称，汝窑天青、官窑粉青为世所珍；景德镇瓷土精良，影青瓷行销天下，后世遂以镇名其国。制瓷技艺登峰造极，外销瓷远及波斯与东非，中国之名与瓷器相结，工艺美学泽被世界。\n• 矿冶与纺织：开封以煤为薪，漕运岁输煤铁，胆水浸铜岁产逾百万斤；丝织重心移于江浙，蜀锦、缂丝称精，闽广棉纺渐兴。手工业规模与商品化程度超越前代，民营作坊壮大，机户与雇工渐现，江南市镇因业而兴。\n• 活字印刷与造船航海：毕昇以胶泥刻字、火烧令坚，一版印刷、再版排字，开活字之先河；海船设水密隔舱，体巨而抗风涛，泉州所造蕃舶尤为著名。印刷促知识普及，造船航海为海外贸易之骨干，亦为后世郑和远航之技术前提。", "16": "• 铜钱铁钱与钱荒：岁铸铜钱至元丰间达五百万贯，为唐代数倍，四川、河东用铁钱，铁钱重而值轻，大额贸易殊为不便。商品流通扩张而铜料不继，钱荒频仍，钱禁屡申而钱币外流不绝，通货不足为纸币产生之经济背景。\n• 交子与会子：1023年置益州交子务，官交子以铁钱为本位、分界发行，为世界最早之政府纸币；南宋行会子、湖会，以钱会中半理商税。信用货币制度由此确立，代金属而便流通，然军费孔亟则增印无度，贬值随至，为纸币管理之镜鉴。\n• 白银绢帛与金银铺：白银渐用于大额赏赐、军饷与豪商支付，绢帛由主币退为折变之资；汴京金银铺兼营兑换，交引铺市盐钞茶引，早期金融市场初现。贵金属货币地位上升，货币体系多元并行，为明代白银货币化之过渡。", "17": "• 宋辽金夏对峙下的边防：北御辽金、西备西夏，置河北、河东、陕西诸路安抚司，修城寨、置榷场以应边需。岁币与军费并耗国力，防御体系完备而战略终归被动，守内虚外之国策定此格局，边防之耗为宋代财政与军制之根源。\n• 羁縻州县与土官：西南溪峒、广南西路置羁縻州县，以土酋为刺史、都督，世袭其职而贡赋不入版籍；神宗以后渐开边拓土，置城寨而编齐民。因俗而治承唐制，为元明清土司制度之直接来源，中央经营西南由此渐次深入。\n• 南方边地开发与置县：荆湖南北开梅山置新化、安化二县，广西、海南增置郡县，黎、壮诸族渐入编户；移民屯垦与学校并兴。边地由化外而入版籍，南方疆域之整合远超前代，西南内地化由此奠定基础，民族融合随之深化。", "18": "• 辽与北宋：辽得燕云十六州而扼中原之吭，宋辽战和交替；澶渊盟后百余年通好，成“第二次南北朝”之局（辽之制度详见〖辽〗页）\n• 西夏与宋：西夏据河套、河西，宋三面受敌，宋夏屡战屡和；庆历和议以岁赐银绢茶换和平，夏称臣而于国内自帝（详见〖西夏〗页）\n• 金与宋：金灭辽、灭北宋，南宋划淮而守，形成南北对峙；北方民族由此深度融入华夏，为元代大一统之过渡（详见〖金〗页）", "19": "（说明：下列诸役多与〖辽〗〖西夏〗〖金〗专页互见，本栏侧重宋方视角）\n• 宋辽战争与澶渊之盟：太宗两度北伐，高梁河、歧沟关皆败绩，自此转攻为守；辽圣宗南下，真宗亲征，盟于澶州，岁币三十万。宋辽约为兄弟，百余年和平由此开启，守内虚外之策亦因之而定，影响两宋国运至深。\n• 宋金战争与岳飞抗金：金破开封掳二帝，高宗南渡，韩世忠黄天荡阻兀术；岳飞连结河朔，郾城大捷破铁浮屠，直抵朱仙镇，高宗以金牌召还，竟以冤狱杀之，绍兴和议划淮为界。抗金精神为民族精神之象征，偏安格局由此确立。\n• 采石之战：金主完颜亮倾国南侵，宋将王权溃退，中书舍人虞允文犒师采石，临时督军，截击金军渡江，焚其舟楫；金军败退而完颜亮为部下所弑，金国和议复起。文臣临危却敌，南宋转危为安，宋金均势由此维系，国祚再延。\n• 宋元战争与襄樊之战：联蒙灭金而收复中原无望，蒙军自蜀、荆、淮三道南攻，钓鱼城下蒙哥殒命；忽必烈围襄樊六年而克之，浮汉入江，临安出降。持久攻防为古代战争之典型，襄樊既失而长江之险不足恃，宋之灭亡由此已定。\n• 崖山之战：元将张弘范率水军追击，宋军舟师结寨海上，兵疲粮尽；1279年海战全军覆没，陆秀夫负帝昺赴海而死，张世杰遇飓风溺亡，南宋亡。华夏政权首次整体倾覆于北方民族，殉国之烈世所罕见，遗民心态影响元初思想至深。", "20": "• 海上丝路与市舶：广州、泉州、明州诸港置市舶司，市舶条法颁行，抽解舶货、招徕蕃商，蕃坊置蕃长自治；海商与僧侣浮海至日本、高丽、南洋、印度、大食，市舶岁入以助军国。海外贸易规模远迈汉唐，海洋时代由此开启先声。\n• 中日交流：幕府执权之际，宋钱与宋船通行日本，入宋僧荣西、道元传禅宗与茶种，宋学亦东渐；两国无正式国交而民间往来极盛，贸易以铜钱、丝绸、香药为大宗。禅茶一味浸润日本文化，东亚汉字文化圈之联结由此深化。\n• 高丽与东南亚诸国：高丽遣使入贡，明州为通丽之港，宋籍雕版与医书传入；交趾、占城、三佛齐、阇婆诸国通商朝贡，占城稻由此引入江淮。市舶贸易织成东亚南海商网，华侨始侨居南洋诸港，中华文化辐射之广为前代所未有。", "21": "• 资治通鉴：司马光主撰，刘攽、刘恕、范祖禹分修，编年记战国至五代一千三百六十二年史事，取鉴于往事、有资于治道；考异之法开史料审辨之先例，纲目谨严。为编年体通史之巅峰，帝王经世之教科书，史学地位与史记并称。\n• 通志与纪事本末：郑樵通志二十略，会通诸史而独重标目，倡会通之义；袁枢改通鉴为纪事本末，以事为纲、具首尾，创纪事本末体；马端临文献通考分门考典章，田赋、钱币诸考详备。三大史著体裁各开一路，史学方法由此多元。\n• 金石学与方志：欧阳修集古录跋尾，赵明诚金石录考订钟鼎碑版，以石刻证史传之误，金石之学自兹而立；宋元方志如临安志、四明志体例大备，图经蜕为方志。史料范围由文献扩于实物，方志为后世地方史志之源，影响深远。", "22": "• 科技：活字印刷——仁宗庆历间布衣毕昇以胶泥制活字，一版印毕再版排字，效率大进；后传泥、木、金属诸法，典籍由手抄进于批量刷印，知识传播之速倍增。为世界印刷技术之先声，教育与文化普及赖以推动，影响及于欧亚。\n• 科技：指南针用于航海——舟师识地理，夜观星、昼观日，阴晦观指南针，浮针辨位之术已用于远洋；海舶由此敢行深水，往来大食、三佛齐不绝。为世界航海技术之关键，亦为后世地理大发现之技术前提，海上丝路因之而盛。\n• 科技：火药武器成熟——火箭、火球、霹雳炮用于战阵，军事著述载火药方而成书；突火枪以巨竹为筒、发子窠，为管形火器之始。火药与火器经阿拉伯西传，改变战争形态，为冷兵器时代之转折，影响世界军事史至深。\n• 科技：梦溪笔谈——沈括晚年居润州梦溪园，记生平所历天文、历算、地质、医药诸学，论磁偏角、隙积术，石油之名亦始于此；考证精核，实验之意存焉。誉为中国科学史之坐标，古代科技集大成之作，泽被后世。\n• 货币：交子——四川用铁钱而贸易苦重，益州豪商联保发行交子，后收归官办，以铁钱为本位分界发行；为世界最早之纸币，货币形态由金属进于信用，金融史之里程碑。官府滥发则贬值随之，纸币管理之经验教训由此而启。\n• 思想：理学体系化——朱熹承二程而集其成，注四书、辨理气、论心性，格物穷理之说精密；白鹿洞书院揭示立讲学之规，四书由此升格。为元明清科举与官学之本，官方哲学地位自此确立，影响东亚七百年。\n• 文学：宋词与古文——柳永、苏轼、周邦彦、辛弃疾、李清照诸家辈出，词至宋而为一代之文学，豪放婉约并峙；唐宋八大家宋居六家，古文运动成于欧苏。雅俗并进，词话诗话随起，文学之变影响元曲与后世小说，格局一新。\n• 艺术：山水画与瓷器——李成、范宽、郭熙写山川之势，徽宗立画院、设画学，文人画渐起，南渡后马远夏圭开一角之境；五大名窑釉色天成，汝官哥钧定各擅其美。书画与瓷器相济，审美趋于简约含蓄，东方艺术精神于斯灿然。\n• 教育：书院兴盛——白鹿洞、岳麓、应天、嵩阳四大书院并起，朱熹修复白鹿洞书院，订揭示以立规约，讲会问难之风大盛；书院遂为理学传习与士人养成之地，学术下移而教化广被，制度东传朝鲜日本，流风及于近代学制。"}, "note": "本页以宋为本位。辽、西夏、金已各自单独成页，两宋页中的相关内容为提要；要看它们的制度与内部演变，请到各专页。"}, {"id": "pxixia", "name": "西夏", "isNew": true, "position": "党项立国与蕃汉并治", "span": "1038—1227年", "sub": "党项 · 元昊 · 宋夏战争", "feature": "西夏是党项羌建立的政权，都兴庆府，与宋、辽、金长期并立。元昊于1038年称帝、国号大夏，创制西夏文、下秃发令以恢复本族旧俗；其官制多仿宋而另有“蕃号”，崇佛重儒，中后期开设科举。宋夏之间战和相寻，庆历和议后宋以“岁赐”换取和平、重开榷场。1227年被蒙古所灭。", "events": "• 党项源流：党项出自羌族，部落甚众、不相统属，被称为“杂虏”；唐前期内徙甘、陕，唐以羁縻府州统辖\n• 唐末：拓跋氏首领拓跋思恭助平黄巢有功，授夏州节度使、封夏国公、赐姓李，成为唐末藩镇之一，宋初仍保持藩镇地位\n• 宋初：节度使李继捧献地入朝，族弟李继迁反对内附、称臣于辽，受辽封为夏国王；北宋被迫妥协，封其为节度使、赐名赵保吉\n• 李继迁略地河西为吐蕃人所杀，子德明乞和于宋，封西平王、后进封夏王\n• 元昊建国：1038年即帝位、国号大夏；放弃唐宋赐姓、改用本族嵬名氏，下秃发令、恢复旧俗，创制本族文字\n• 庆历和议：宋夏和议，宋册封元昊为“夏国主”，元昊对宋称臣；宋每年“岁赐”西夏绢15万匹、银7万两、茶3万斤，重开沿边榷场\n• 灭亡：1227年蒙古灭西夏", "cells": {"3": "• 设官多与宋同：仿宋置官，另有“蕃号”官称，形成蕃汉并行的官制", "5": "• 中后期开设科举，与崇儒重学相配合", "11": "• 蕃汉并治下的多族社会：党项贵族居主导，汉、吐蕃、回鹘等族交错而居", "12": "• 崇佛、重视儒学：佛教盛行；仁宗尊孔子为“文宣帝”；斡道冲曾以西夏文著《论语小义》《周易卜筮断》等书", "13": "• 半农半牧：河套、河西宜农，山地草原宜牧，农牧并重", "14": "• 榷场贸易与宋夏互市：庆历和议后重开沿边榷场，茶马、盐粮贸易兴盛", "17": "• 据河套与河西走廊，控丝绸之路要冲，都兴庆府（今银川）", "18": "• 党项、汉、吐蕃、回鹘、契丹诸族共处；夏与辽、金之间彼此利用、相互牵制", "19": "• 宋夏战争：元昊称帝后与宋交战七年，宋军于三川口、好水川、定川寨接连失利\n• 永乐城之役：宋神宗乘西夏内乱进攻无功而返，新筑永乐城被西夏攻陷\n• 河湟之役：宋哲宗、徽宗时期在河湟反复争夺，互有胜负", "21": "• 西夏文文献：如《天盛改旧新定律令》等，是研究西夏制度与法律的重要资料", "22": "• 创制西夏文字（称蕃书、蕃文）\n• 西夏文佛经与佛教艺术\n• 陶瓷与冶铁"}, "note": "西夏（1038—1227）与宋、辽、金长期鼎足而立，最终亡于蒙古。"}, {"id": "pjin", "name": "金", "isNew": true, "position": "女真崛起与汉化改革", "span": "1115—1234年", "sub": "女真 · 猛安谋克 · 大定之治", "feature": "金是女真族建立的王朝。1115年完颜阿骨打称帝，都会宁府（上京），1125年灭辽、1127年灭北宋，与南宋长期对峙。金初行勃极烈辅政体制，地方行猛安谋克；熙宗“天眷新制”改行唐宋官制、建三省六部，海陵王“正隆官制”只留尚书省。世宗“大定之治”、章宗“明昌之治”为鼎盛期，既推行汉化又保存女真旧俗；后期因外患与猛安谋克衰落而亡。", "events": "• 女真源流：女真为靺鞨后裔，10—11世纪活动于黑龙江、松花江流域，有熟女真、生女真之分\n• 立国：辽朝中期完颜部建立部落联盟，12世纪初完颜阿骨打为联盟长并败辽；1115年阿骨打称帝、国号金（金太祖），定都会宁府、称上京\n• 灭辽灭宋：1125年灭辽，1127年灭北宋（靖康之难）\n• 制度演进：熙宗“天眷新制”废勃极烈会议、打压宗室，改行唐宋官制、中央建三省六部；海陵王“正隆官制”废中书、门下，仅保留尚书省\n• 海陵王：迁都中都（今北京）、毁灭上京；南侵南宋，败于采石之战\n• 世宗与章宗：世宗“大定之治”，号“小尧舜”，既倡导汉化又保存女真文化；章宗“明昌之治”，完成汉化制度建设\n• 衰亡：卫绍王时野狐岭之战、胡沙虎之乱；宣宗贞祐南迁；哀宗时三关河争夺战、三峰山之战、蔡州之战，1234年金亡", "cells": {"3": "• 勃极烈辅政体制：金初中央设勃极烈（都勃极烈、谙班勃极烈、国论勃极烈等），由宗室共掌国事\n• 天眷新制：熙宗废勃极烈会议、打压宗室，改行唐宋官制，中央建立三省六部制\n• 正隆官制：海陵王废中书、门下，仅保留尚书省，其余官制进一步规范化", "4": "• 猛安谋克管理体制：金初地方以军政合一的猛安谋克编制女真部众，兼理地方事务", "7": "• 兼采女真旧俗与唐宋律令，随汉化而逐步系统化", "10": "• 猛安谋克：兵农合一，平时生产、战时出征，是金朝军事与社会的基本组织\n• 后期衰落：猛安谋克户因土地兼并、军纪松弛而战斗力下降", "12": "• 汉化与存俗并重：世宗既倡导汉化，又刻意保存女真语言风俗（女真本位）", "17": "• 界壕与北部边防：章宗时北部鞑靼骚扰，修界壕（金长城）以固边", "18": "• 女真、汉、契丹、渤海多族共存：以猛安谋克安置女真，以州县治理汉地", "19": "• 采石之战：1161年海陵王南侵，南宋虞允文拒之于采石，金军败退\n• 隆兴和议与嘉定和议：宋军两次北伐失败后与金订立的和议\n• 蔡州之战：1234年宋蒙联军攻蔡州，金哀宗自杀，金亡；南宋“端平入洛”失败", "21": "• 《金史》为元人所修；金代设实录、国史，汉化程度较高", "22": "• 女真文字（女真大字、小字）\n• 金代建筑与陶瓷\n• 文学家元好问"}, "note": "金（1115—1234）灭辽与北宋，与南宋南北对峙，最终亡于宋蒙联军。"}, {"id": "p8", "name": "元", "position": "大一统与多元帝国的治理", "span": "1271—1368年", "sub": "（蒙古国：1206—1271年 / 元：1271—1368年）", "feature": "元起朔漠，成吉思汗统一蒙古诸部，忽必烈建元行汉法而存草原旧制，灭南宋混一南北，创行省、定四等，版图旷古未有。站赤通欧亚、海舶达重洋，开放之姿冠绝当时；黄道婆传棉纺，朱学立为官学，制度文化多所因革。然以少数民族入主中原而行二元治理，族群等级森严、钞法紊乱、役重民困，矛盾积而难解。其疆域民族格局奠定后世之基，而国祚短促，足见治理之得失系乎民心。", "events": "• 蒙古统一与扩张：1206年铁木真会盟诸部于斡难河源，称成吉思汗，建千户制、颁札撒，草原帝国勃兴；其后灭西辽、西夏，攻金而取中原之半，西征花剌子模。游牧帝国之建立为元代大一统奠定基础，亦深刻改写欧亚大陆之政治版图。\n• 忽必烈建元与灭宋：忽必烈行汉法、用儒臣，即位后取易经大哉乾元之义，至元八年改国号大元，定都大都；至元十三年陷临安，三年后崖山灭宋残部。唐末以来数百年分裂终归一统，多民族国家之疆域由此奠定。\n• 行省制度确立：中枢置中书省总政务，地方设十个行中书省，统辖路府州县，为地方最高官府。行省制为元代制度之最大创制，省级建置由此而始，奠定此后七百年行政区划之基础，影响至今犹存，制度生命力冠绝诸制。\n• 四等人制与民族政策：分蒙古、色目、汉人、南人四等，任官、法律、科举诸待遇皆有等差，南人最居其下。民族压迫与阶级剥削相叠，社会矛盾激化，为元末动乱埋下祸根，族群等级之制亦为速亡之重要原因，影响至为深远。\n• 南坡之变：英宗用拜住行新政，行助役法、考课守令、追论奸党，触怒蒙古旧贵；至治三年自上都南还，御史大夫铁失等夜袭行幄，弑英宗与拜住于南坡。新政中辍，此后弑君夺位之端一开，中枢政局长期动荡，国势由是不振。\n• 元中期皇位纷争：自成宗之后至元末，二十余年间皇位更迭频繁，忽里勒台推举与武力夺位相杂；诸系汗位相争，权臣燕铁木儿、伯颜相继专擅，政治紊乱而纲纪废弛。统治集团内耗加速王朝衰败，红巾祸起遂不可制。\n• 红巾军起义与元亡：韩山童、刘福通以弥勒下生相号召，河工之怨与饥荒相激，红巾并起，徐寿辉、张士诚、朱元璋继之；明军北伐，顺帝北走应昌，元亡而为北元。农民战争终结异族统治，明朝建立，元之兴衰由此而定。", "cells": {"3": "• 一省制与中书省：废门下、尚书两省，惟中书省总领百官，长官中书令常由皇太子领衔，左、右丞相实掌政务，平章政事参决机务。三省归一而相权反弹，行政较宋代简捷高效，然权臣如阿合马、伯颜相继专擅，为明代废相之伏笔。\n• 枢密院御史台并立：枢密院掌全国兵甲机密，御史台掌纠察百官，与中书省并立，又置行枢密院、行御史台于地方。行政、军事、监察三分其柄，机构简而职任专，为明清官制之过渡形态，然蒙古勋贵兼领数职，制衡每归于虚文。\n• 宣政院与专职机构：宣政院掌释教僧徒与吐蕃军政，院使由帝师荐举，政教合一体制由此而成；通政院总驿站，将作院掌工匠营造，回回司天台掌西域历数。宗教与边疆事务尽纳中枢，多元帝国之治理特色由此彰显。", "4": "• 行省制度：置岭北、辽阳、河南江北、陕西、四川、甘肃、云南、江浙、江西、湖广十行省，行省长官总军政财赋于一路；辖区广而权任重，中央以诏令节制之。省级建置自此而始，为现代中国省制之直接源头，地方行政格局由此奠定。\n• 路府州县与达鲁花赤：行省下辖路府州县，各级置达鲁花赤为长官，例由蒙古人充任，色目次之，汉人任总管以下。掌印官监临汉官，监临之制贯彻州县，民族统治之特色可见，然员冗政繁而行政迟滞，亦开后世监临官制之先声。\n• 犬牙交错与分权控驭：行省划界破山川之形便，陕西跨陇而河南江北跨淮，无完险可恃；行省虽总军政财权，而调兵黜陟皆受中枢节制，重大军政须禀命而行。控驭与效率兼顾，中央集权因之强化，为元明清地方体制之框架。", "5": "• 科举停废与恢复：元初不行科举近八十年，士人无进身之阶，吏员出职遂为正途；1313年下诏复行科举，以四书试士，朱熹章句集注为主。科举中断之久为历代所罕见，选官制度粗疏，士人沉抑于下，为元代文治不振之根源。\n• 四等两榜与名额悬殊：蒙古、色目为右榜，汉人、南人为左榜，试目、场次宽严有别，左榜难而右榜易；进士出身者终元不过千人。民族区隔贯穿选官，才俊不得其用，吏治因之驳杂，社会不满因之积聚而发酵。\n• 吏员出职与怯薛入仕：路府州县之吏按资历考满出职为官，与荫叙、怯薛并为入仕三途；重吏轻儒，士人鲜有居高位者，胥吏操持州县实务。选官制度化程度低而吏治苛细，为元代政治粗疏之表征，亦为明清吏治问题之先例。", "6": "• 御史台与行御史台：中央御史台置殿中司与察院，又设江南、陕西两行御史台，下辖二十二道肃政廉访司，岁分道按临。监察网络遍及行省与边疆，肃政廉访司纠劾贪残、录问刑狱，体系之完备为明清按察司与巡按御史之先例。\n• 约会制司法：军民、僧俗、蒙汉案件分隶诸机构，军户归奥鲁，僧尼归宣政院，斗讼涉两造则约会听讼。分籍审理承草原与中原两制并存之局，便民有限而程序繁复，司法不统一为多元帝国之病，法制整合之难由此而显。\n• 大元通制与元典章：英宗颁大元通制，集诏制、条格、断例二千余条，元典章汇地方文书为吏治手册；律文地位下降，断例条格为法之主体。判例汇编适应多元社会而体系不足，为明清律例合编之过渡，中华法系之变例由此形成。", "7": "• 大元通制与至正条格：英宗至治间颁大元通制，顺帝至正间颁至正条格，皆以诏制、条格、断例为体，格例之外律文寥寥。立法随事制宜而体系化程度远逊唐宋，判例色彩浓厚，为中华法系发展之变例，影响及于明清律例。\n• 民族不平等之法律：蒙古人殴死汉人止征烧埋银，汉人殴蒙古人则处死并籍没家产；汉人南人盗贼刺字，蒙古人免刺，同罪异罚著为定例。法律公开维护族群特权，司法之不平为诸代所未有，民族矛盾因之激化，为元亡之根源。", "8": "• 诸色户计：民、军、站、匠、灶、儒、医、阴阳诸色户计各隶其籍，世代相承、不得改易，军站匠户役重而优免有别。户籍以役定籍、以籍控人，人身控制较宋大为强化，社会流动趋于停滞，职业世袭之制为明代所承袭，影响深远。\n• 社制劝农：北方农村以五十家编为一社，择年高通晓农事者为社长，课耕劝农、纠举惰农，兼理社学、义仓与治安。社长例为豪强把持，勒索扰民时有，劝农之政实效有限，然村社之制为基层治理之一变，元代首创。\n• 里甲乡都与南北异制：江南承宋乡都制，都保图籍相承而控制较疏，北方社制与奥鲁并存，基层组织因地而异；赋役寄于里胥之手而逃亡相踵。基层渗透强弱不均，元末起事多起于控制松弛之江南，里甲失序之祸由此可征。", "9": "• 税粮与科差：北行丁税地税、兼征丝料包银，南承宋两税旧制而科差较轻，南北异制为元代赋税之特色。税粮入仓、科差供官，名目分立而征敛繁重，西北诸王岁赐与军需并急，民力凋敝，为元代财政困局之根源。\n• 江南经理与田赋：延祐间行经理法，令自实田亩以均赋税，虚报相蒙、民不堪扰，旋即罢废；江南富家包侵田赋，官田佃租转重，秋粮海运以实大都。田赋整顿终元不成，江南赋重而隐漏并存，为元代财政之痼疾，隐患至深。\n• 杂税与和买之重：和买官价常不及市直，甚则白著，和雇车船、杂泛差役并举，站户典田以供驿马，匠户入局而无俸。苛征与无偿劳役相叠，河工之役更兴大怨，民困至极，为红巾之变之经济根源，财政剥削之酷为历代所罕见。", "10": "• 蒙古军与探马赤军：蒙古军以千户编组，上马则备战斗、下马则屯聚牧养；探马赤军由诸部混编，充前锋而镇戍中原要害。军户世袭，鞍马衣粮自备，负担沉重而逃亡日增，兵源之制渐坏，军政废弛由此而始。\n• 汉军与新附军：汉军收编金末豪强与签发汉户而成，戍守中原；新附军为南宋降卒，别籍而居，地位最下。诸军待遇悬殊而统以蒙古将帅，民族等级贯穿军制，军队整体效能受限，腹里与边疆镇戍之布局由此而定，影响有元一代。\n• 怯薛宿卫与镇戍：怯薛为成吉思汗所建亲卫，四杰世领其职，宿卫万人而与国同休，出为达官、入为腹心；枢密院总军政，大兵屯驻和林诸要冲。宿卫镇戍相维，军权固于中央，然后期怯薛冗滥干政，军备废弛，元军战力由盛而衰。", "11": "• 四等人制：蒙古、色目、汉人、南人依次列等，任官、科举、法律、禁令诸端皆有差等，南人最居其下。族群等级与贫富分化相叠，社会裂痕深植，为元代最严重之社会问题，元末族群仇杀相寻，速亡之因由此可溯。\n• 驱口与佃户：战争掳掠与籍没为驱口，视同财产可买卖，隶属主家，逃者刺面；江南佃户租重而身隶田主之势渐成。奴隶制因素回潮，人身依附逆转唐宋解放之势，社会形态局部倒退，驱口之众为历代所罕见，社会矛盾由此加深。\n• 江南地主与民变：江南地主保有田产而佃户受其盘剥，官田租额尤重，粮长里胥因缘为奸；民族与阶级压迫相叠，南人愤懑最深，元末群雄并起于江淮。江南为财赋所出而民变之源，社会矛盾积累至极，王朝倾覆由此而致。", "12": "• 理学官学化：赵复北上传程朱之学于燕京，姚枢、许衡、吴澄相继推行于朝野；1313年定科举以朱熹四书章句集注为本，程朱之学遂为官学。理学由南士之学升为全国功令，思想统一而渐趋僵化，明清理学正统之局由此奠定。\n• 帝师与宗教多元：尊吐蕃萨迦派，八思巴为帝师领宣政院事，藏传佛教行于宫禁；全真、正一两派道教并盛，也里可温、伊斯兰教与答失蛮并载于籍。诸教并存而以释为尊，宗教宽容为元代特色，多元信仰之局由此形成。\n• 俗文学与思想下移：杂剧兴盛，关汉卿、王实甫作窦娥冤、西厢记，曲词直白而写世情；南戏渐起于温州。士人流落书会而借曲寄慨，思想表达由性理转向世俗人情，市民意识渐萌，为明清小说戏曲之先声，文化格局由此而变。", "13": "• 官田与赐田：官田来自籍没、断没与荒闲之地，分拨诸王驸马寺观为赐田，动辄千顷；贵族、寺院广占膏腴，自耕农日蹙，租佃于官豪之家。土地高度集中，赋税转嫁于小民，民户逃亡而版籍虚耗，元代土地关系之扭曲由此而成。\n• 江南兼并与佃农：江南大地主动辄收租万石，佃户十居五六而租额重至五成；元廷庇护地主收租，佃户不得随意起移。民族压迫之下阶级剥削尤酷，江南民困为诸道之最，为元末起义多发于南方之社会根源，矛盾积累而爆发。\n• 屯田与垦荒：军屯、民屯遍于各行省，岭北、云南、畏兀儿之地皆置屯，以兵且耕且战；荒地渐辟而边储稍实。屯政初见效而后废弛，屯户困于科敛而逃亡，军食复仰给于民，垦殖之利不终，屯田之弊由此可见，民困未苏。\n• 牧场占田：诸王贵戚于中原广置牧场，占民田为牧地，纵马畜践食禾稼，山东、河北、京畿尤甚；禁民耕垦，农户失其恒产而流亡。游牧旧俗强加于农耕之区，生产破坏而赋役无出，民族矛盾与生计之怨相激，元末之乱由此埋根。", "14": "• 大一统市场与都会：站赤遍布而驿路通全国，运河与海运并运漕粮，大都聚天下之货，杭州、平江富甲东南；钞法通行而长途贩运兴盛。统一市场初现，商品经济在南北混一之条件下繁荣，商业之盛为元代之特色。\n• 海外贸易与市舶：泉州、庆元、广州诸港设市舶司，官本船之法以官资出海分利，泉州蕃舶云集为世界巨港；与百余国通商，香料、珠宝、布帛输入而瓷丝输出。海外贸易规模超越两宋，为郑和下西洋之先声，中外物质交流由此而盛。\n• 斡脱商与官商勾结：斡脱为突厥语同伴之义，色目斡脱商持官本经营高利贷，羊羔息年倍其本而官为追债；特权商人垄断盐铁之利。官商一体而盘剥及于编户，商业资本畸形发展，为元代商业弊政，社会矛盾因之加速激化。", "15": "• 匠户制度与官营手工业：籍工匠为匠户，子孙世袭，隶工部、将作院诸局，局院督课而贡品有常；官营作坊宏大，织锦、造船、冶铸技艺精湛。匠户束缚至严而境遇困苦，逃亡相踵，技术传承与劳役剥削并存，为明代匠籍制度之先例。\n• 黄道婆与棉纺革新：黄道婆自崖州归松江，传错纱配色、综线挈花之法，改良捍弹纺织之具，乌泥泾布名闻天下；松江遂为棉纺中心，衣被渐易以棉。棉纺兴起改变衣着之材，机户渐兴，江南产业格局为之一变，影响后世民生。\n• 青花瓷与织金锦：景德镇设浮梁瓷局，枢府釉、青花瓷成熟，钴料绘花而远销波斯；纳石失织金锦供宫帐之用，西域织工参与其事。制瓷织造融合中西技艺，外销商品远及欧亚，为海上贸易之大宗，元代工艺之盛由此可见。", "16": "• 纸币为本位：中统钞、至元钞先后行用，以银为本、分界发行，禁金银铜钱于交易；纸币为主要流通货币，为世界史上之首创。钞法初行而币值稳定，商旅便之，大一统财政因钞而整合，为古代货币制度之重大创新，影响及于后世。\n• 钞法败坏与恶性通胀：军费浩繁则增印无度，至正新钞出而旧钞贱，物价腾踊十倍，民间弃钞用物；钞法既坏而财政随之崩溃。为古代最早之恶性通胀，信用之失加速政权瓦解，财政恃发钞之祸于此为烈，元亡之兆由此而现。\n• 铜银并行与白银化：钞坏而民间行用历代旧钱与白银，银两称量交易渐多，江南富室窖银成风；铸钱稀少而钱制不一。贵金属复归流通，为明代白银货币化之过渡，货币多元而紊乱，反映元代财政失控之局，教训为后世所鉴。", "17": "• 行省统辖边疆：辽阳、岭北、甘肃、云南诸省兼辖边疆，宣慰司、都元帅府参设其间，漠北、辽东、西南与内地一体治理；流官、土官并用而军政直达。边疆由羁縻而入版籍，统治之深入为前代所无，现代中国疆域之基础由此奠定。\n• 宣政院辖吐蕃：吐蕃置乌思藏纳里速古鲁孙三路宣慰司，宣政院统之，僧俗并用、军民兼摄，清查户口、置驿设站；帝师领院而政教相维。西藏自此正式纳入中央行政管辖，为中国领土不可分割之一部分，治理制度化由此确立。\n• 澎湖巡检司：置巡检司于澎湖，隶福建晋江县，管辖澎湖与台湾民政，征盐税而编渔户；汉人移垦台澎自此渐众。中央政权首次于台澎设官治理，海疆经营之开端，台湾纳入中国版图之始，意义重大，后世海防由此发端。", "18": "• 四等人制与族群分野：蒙古、色目、汉人、南人四等分立，任官从军、科举法律皆有等差，禁汉人聚众田猎与夜行；族群身份定贵贱，等级由法度而固化。民族等级加深社会裂痕，为元代最严重之社会问题，元末族群冲突由此而激化。\n• 民族融合与回族形成：中亚、波斯、大食人东来，与汉、蒙古、畏兀儿诸族杂居通婚，以汉语为通用而信伊斯兰教，回族渐成雏形；蒙古人入中原者渐习农耕汉俗。多元民族混一而融合，新民族共同体形成，多元一体之格局由此推进。\n• 色目人与中西交流：回回人擅理财、天文、医药，扎马鲁丁撰万年历、造西域仪象，回回司天台立于上都；亦黑迭儿丁董建大都宫城。西域科技融入中原，中华文明吸收外来养分，元代为中外科技交流之黄金期，交融之迹由此可见。", "19": "（说明：灭宋诸役与〖两宋〗页互见，本栏侧重元方视角）\n• 蒙古西征：1219年成吉思汗以商队被害为名西征花剌子模，屠讹答剌、陷撒马尔罕；长子术赤抚定钦察，哲别、速不台逾高加索而破斡罗思。西征前后凡三次，改变欧亚政治格局，东西交通由此大开，影响世界历史进程至深。\n• 灭宋战争：蒙哥命三道伐宋，自领攻蜀而殒于钓鱼城下；忽必烈围襄樊六年而克，浮汉入江，临安出降，崖山覆宋师，南北复归一统。统一战争历四十余年而竟其功，大一统格局由此重塑，行省诸制遂推行于新附之境。\n• 元末农民战争：韩山童、刘福通倡弥勒下生，黄河工地上石人一出而红巾俱起；徐寿辉、张士诚、朱元璋相继称雄，明军北取大都。民族与阶级矛盾总爆发，终结元朝统治，华夏政权于震荡中重光，明代格局由此开启。", "20": "• 海上丝路与马可波罗：威尼斯商人马可波罗随父叔来华，仕世祖而行各省；口述旅程由鲁思梯谦笔录为行记，记大都、杭州、泉州之盛。欧洲由此而知东方之富庶，行记为地理大发现时代之必读书，东西交流因之而开启新篇。\n• 驿站与欧亚陆路：站赤遍设，陆站水站相衔，次舍供帐有常制，使臣持玺书通行无滞；欧洲教士孟高维诺来华传教，列班扫马自大都西行谒教皇。欧亚陆路畅通为古代之最，东西使节商旅往还，交通之盛远迈汉唐，欧亚由此贯通。\n• 文化与科技东西交流：印刷术、火药、指南针经陆海两路西传，阿拉伯天文历算东渐，回回炮、回回医药并用军中；西亚数学天文东来而立回回司天台。四大发明之外传深刻影响欧洲近代化，文明互鉴由此加速，为全球史之序幕。", "21": "• 辽金宋三史：脱脱奏修三史，断以各与正统、各系其年，辽金宋三史体例划一而速成；南北正统之争千年不息，至此一锤定音。多民族同书正统之史观确立，官方修史规模宏大，为研究辽宋金之基本文献，史学意义深远。\n• 蒙古秘史：以畏兀儿体蒙古文记成吉思汗先世与统一诸役，兼记窝阔台朝事，蒙汉合璧而译写传世；文体质朴，叙事如口传史诗，为草原民族第一部史书。研究蒙古兴起与早期制度之最珍贵史料，民族史学传统由此开启。\n• 元典章与经世大典：元典章集诏令条格、案例文书，分类编次而便于吏查，为元代法制与行政之实录；经世大典承会要之体，记一朝典制。政书之编保存制度原貌，为研治元史之渊薮，典制史学因之而续，影响及于明清会典。\n• 文献通考与一统志：马端临文献通考二十四门，田赋、钱币诸考详核，承通典通志而集典制史之大成；扎马鲁丁倡修元一统志，记全国地理物产而附图。大一统王朝之文化整合见于载籍，地理总志之修为明清一统志之先例。", "22": "• 制度：行省制——创设省级行政区划，行省总揽路府州县，划界犬牙相制以利控驭；中央以诏令节其权柄，广土众民得以一统而治。省制之雏形实肇于此，奠定此后七百年地方行政基本框架，由此泽被后世，影响至今。\n• 边疆：宣政院辖藏与澎湖巡检司——西藏正式纳入中央行政管辖，台澎首次设官治理；清查户口、置驿征赋，边疆治理由羁縻进于直接统辖。统一多民族国家之疆域基础由此奠定，版图意识为之一新，为明清经营边疆之先例。\n• 交通：驿站与大运河——设站赤约一千五百处，陆站水站相衔，欧亚使节商旅通行无滞；开会通河、通惠河而漕运直达大都，海运岁运漕粮数百万石。南北物流人流荟萃，大一统之物质基础因之巩固，中外交通之盛为古代之最。\n• 科技：郭守敬与授时历——郭守敬制简仪、高表诸器，四海测验二十七所；1281年颁授时历，岁实与今公历相同而早于西历三百年，中国古代历法之高峰。实测推步之精冠绝当时，天文水利兼擅，科学实学之风由此而盛，泽及农政。\n• 农业：王祯农书——总括南北农事，兼论耕耨、灌溉、蚕桑与荒政，农器图谱绘具图文三百余幅；翻车、耧车诸具赖图谱以传。四大农书之一，重农劝课之意寓焉，农学体系之完备为古代之冠，泽被后世，农政传统由此而彰。\n• 纺织：黄道婆与棉纺——自崖州传错纱配色之法，改良捍弹纺织之具，乌泥泾被名闻远近；松江遂为棉纺都会，棉布渐易天下之衣。去籽弹花既便而织造日精，南布北运而产业转移，民生衣被因之改善，江南市镇经济由此而兴。\n• 文学：元曲与杂剧——关汉卿窦娥冤、王实甫西厢记、马致远汉宫秋诸作并出，曲白相生而搬演于勾栏；南戏起于温州而渐盛。杂剧与散曲合称元曲，与唐诗宋词并峙为一代之文学，叙事艺术臻于成熟，为明清小说戏曲之先声。\n• 交流：马可波罗行记与四大发明西传——行记盛称中国之富庶，欧洲争相传抄而绘东方舆图；印刷、火药、指南针经陆海西传。东西文明因元之贯通互感，欧洲近代化进程深受其影响，世界历史之联动自此加速，全球史序幕渐启。"}, "note": "本页为蒙古—元一系。灭宋过程与〖两宋〗页互见；辽、西夏、金另见各专页。"}, {"id": "p9", "name": "明", "position": "君主专制的强化与内向转型", "span": "1368—1644年", "sub": "", "feature": "明朝是中国帝制后期的大一统王朝。太祖朱元璋驱元建明，废丞相、权分六部，君主专制空前强化；成祖设内阁、迁都北京，郑和远航以彰显国威。中期以后土地兼并加剧，一条鞭法整顿赋役，商品经济与市镇勃兴，白银遂为主币。晚期党争与矿税之弊并发，流民四起，崇祯朝内忧外患交迫，终为满清所代，旧鼎因而迁革。", "events": "• 洪武建明与废相：1368年朱元璋于应天称帝，国号大明。洪武十三年借胡惟庸案罢中书省、废丞相，六部升秩直隶于君，设殿阁大学士备顾问。秦汉以来丞相制就此终结，君主亲揽庶政，专制皇权空前强化，中枢集权格局由此奠定。\n• 靖难之役：建文元年燕王朱棣以清君侧为名起兵北平，鏖战四年攻入南京，建文帝不知所终，朱棣夺位。叔夺侄位首破嫡长继承之常轨，开宗藩夺嫡之恶例，成祖嗣后削夺藩王兵柄而徙封诸王，皇权由此更趋集中。\n• 郑和下西洋：永乐三年郑和率宝船巨舶首航，二十余年间七下西洋，远抵波斯湾、红海与非洲东岸，宣示威德、市易诸番，朝贡贸易臻于极盛。然厚往薄来糜费甚巨，罢航之后官方远洋事业随之中绝，海权遂弛，下西洋终成绝响。\n• 仁宣之治：仁宗宣宗在位十载，倚三杨蹇夏辅政，宽刑省狱、平反建文旧狱、蠲免逋赋，停罢下西洋、弃交趾，转而守在四夷，内阁票拟之制于此常规化，吏治称平，海内殷富，史号仁宣。然承平之下战略收缩，开平卫内徙而北边防线内撤，瓦剌坐大于漠西，盛象之下已伏边患之机。\n• 土木堡之变：正统十四年英宗听王振怂恿亲征瓦剌，五十万大军粮匮旋返，也先追蹑，全军覆没于土木堡，英宗为也先所俘，勋贵重臣死难殆尽。于谦拥立景泰帝，整军经武而却敌于北京城下，京营精锐丧尽，武备废弛之弊尽暴，边防自此由攻转守。景泰八年英宗夺门复辟，于谦冤死，明由盛转衰之局于此确立。\n• 张居正改革：万历初张居正柄政十年，立考成法课吏职事，章奏立限稽核，清丈田亩而括出隐漏二百余万顷，万历九年通计一条鞭法行于天下，赋役合并、计亩征银。太仓之粟可支十年，国库积银六百万两，帝政效能一时大振。然居正身殁即遭清算，考成清丈多所废格，人存政举、人亡政息，改革随人而止，怠政遂开先例。", "cells": {"3": "• 内阁制度确立：废相后太祖设殿阁大学士仅备顾问，成祖简任解缙、胡广等入直文渊阁，参预机务，是为内阁之始。其后阁臣渐掌票拟之权，无宰相之名而实赞襄政务，成为事实上的中枢辅政机构，建制为清代承袭。\n• 六部权重：废丞相后吏户礼兵刑工六部升正二品，尚书直接对皇帝负责，事权分散而各部自理，九卿会议朝政之制渐成。相权既废则部权相对加重，皇帝得以分而驭之，君主对行政诸司控制由此强化，为有明一代官制之大端。\n• 司礼监批红：宣宗以降令司礼监秉笔太监代天子批答章奏，批红与内阁票拟相为表里。王振、刘瑾、魏忠贤相继专擅，批红之柄遂成阉宦干政之阶，阁臣俯仰而朝纲日坏，中枢制衡之局由此畸变，宦官之祸于明代为烈。", "4": "• 卫所与地方：洪武年间广设都司卫所于腹里边陲，都司掌军政而隶五军都督府，布政使司理民政，军管区与民政区交错并立，边地复有实土卫所。地方行政遂呈军民二元，里甲与卫所相维，明代疆理之制由此定型。\n• 三司分权：洪武九年改行中书省为承宣布政使司，与提刑按察使司、都指挥使司合称三司，分掌民政、司法与军政，互不统属而各听命于中央。行省之权一析为三，事权分散，中央控驭由此深化，为地方建制之转折。", "5": "• 科举八股定制：洪武年间重开科举，以四书五经命题、代圣贤立言，成化以后八股文体定型，破题承题之法渐成程式，层层甄别。寒俊由此进身，然命题拘于朱注、文体重骈偶，士子思想渐为程文所缚，科举牢笼人才之弊由此显现。\n• 国子监与监生：洪武年间建国子监于南京，收官民子弟入监肄业，岁贡、恩贡诸途并行，监生可径授官，国初擢用甚重。国学与科举相辅，其后生员日众而出路渐窄，监生直接授官之荣渐替，太学地位由此下降，选官重心遂归科举。\n• 荐举与吏员：太祖屡下求贤之诏，荐举贤良方正、孝廉之士授官，又许吏员考满升迁入流，用人兼行科举、荐举、吏员三途。仕路稍广，荐举凭人主好恶、无定额常制，其后渐归科举一路，三途并用之局由此收束，正途独重之格局确立。", "6": "• 都察院建置：1382年改御史台为都察院，设左右都御史，下辖十三道监察御史，纠劾百司、辩明冤枉、提督各道，巡按州县，风宪之任极重。台谏相维以绳贪暴，明代监察网络之密由此奠定，然风闻言事亦开攻讦之习，影响及于士林风气。\n• 六科给事中：洪武年间设六科给事中，分吏户礼兵刑工六科，掌规谏、稽察六部百司，章奏经其抄驳，有失得封还执奏。给事中与都察院御史并称科道，监察与行政相牵制，君主借以驭下，明代科道之制由此确立，为清代所沿袭。\n• 厂卫之制：洪武年间设锦衣卫掌缉捕诏狱，永乐十八年立东厂，成化间增西厂，皆以宦官提督，伺察百官军民。厂卫自设监狱，径行拷掠而不由法司，缇骑四出而缙绅侧目，法纪为其所坏，特务政治由此而盛，专制之酷于斯为甚。", "7": "• 大诰三编：洪武间太祖先后颁行大诰、大诰续编与大诰三编，辑官民过犯案例，令户户习读，许民持诰缚贪吏赴京。刑用重典以威奸顽，然法外用刑、株连过滥，其书旋废而峻令犹存，重典治吏之旨由此彰显，并开以例辅律之先河。\n• 大明律颁行：洪武三十年颁行大明律，凡七篇四百六十条，以名例冠首，按吏户礼兵刑工分目，科条简当、轻重有伦。礼律结合而严刑弼教，集唐律学之大成，中华法系至此一新，清律多沿其架构，律学统绪由此奠定。\n• 问刑条例：弘治间辑定问刑条例附律通行，嘉靖、万历两朝续加增修，律例并行、因时损益，司法得藉例以通变。然例愈繁则胥吏得上下其手，科刑轻重渐失其准，以例破律之弊由此而生，条例膨胀成为明代司法之一大隐患。\n• 廷杖之施：自太祖以来，明廷于午门杖责忤旨大臣，正德间谏南巡者百余人同受杖，嘉靖大礼议、万历争国本，杖下死者相继。此制以辱士大夫而张君威，言路因之摧折，士节与司法体统并遭破坏，专制淫威由此可见，足为殷鉴。", "8": "• 黄册与里甲：洪武十四年命天下编造赋役黄册，以一百一十户为里，下分十甲，轮充正役，户分民、军、匠诸籍，著籍不得妄徙。赋役凭册征发，国家由此直接掌握编户，户口田土灿然可考，里甲与黄册相辅，基层经制由此确立。\n• 鱼鳞图册：洪武二十年命监生分行州县，清丈田亩、绘图编册，以田为主，详载亩角四至业主，与黄册相为表里。田赋征收有所凭据，隐匿田亩之弊稍戢，然豪强串通书吏仍多飞洒诡寄，经界之实未尽，田籍之制由此而立，功过并存。", "9": "• 军屯与民运：明初广开军屯、民屯以实边足饷，边地军士三分守城、七分屯种，屯田子粒就地供军，民运粮草输边。国初边储赖以自给，其后屯政渐弛、班军赴役费繁，军食转仰给国库民运，九边粮饷终成重负，边费之困由此伏焉。\n• 赋役黄册：洪武年间定赋役之法，以黄册载户等，夏税秋粮依则征收，民田官田科则悬殊，田赋轻重不一。里甲正役外又有杂泛之征，州县巧立名目，小民不堪，赋役不均之弊渐显，明初赋役框架由此奠定，亦埋下日后改革之伏笔。\n• 均徭之编：明中期于里甲正役外创设均徭，以丁粮多寡编派，分银差与力差，祗候、皂隶、库子诸常役皆属之，十年一轮。其后均徭亦许纳银代役，与里甲、杂泛并为三大役目，编审滋弊，豪强规避、贫户独累，一条鞭法之兴由此而生。\n• 一条鞭法推行：万历九年张居正令全国推行一条鞭法，田赋、徭役与杂税合并编派，计亩征银，官收官解，役银摊入田亩。赋役由实物与力役转向货币缴纳，人丁为本转为资产为本，财政货币化进程由此深化。\n• 三饷之加派：万历末辽东用兵，加派辽饷，崇祯间增剿饷练饷，三饷岁增赋银近两千万两，重于正供。州县横征而小民鬻妻卖子以应，阶级矛盾因之激化，流民蜂起而李自成、张献忠并作，明祚之亡实种因于此，王朝危机由此深化。", "10": "• 卫所制度：洪武年间定天下卫所，军士别立军籍、世代为兵，屯守兼备、寓兵于农，军饷取给屯田，国不烦养兵之费。明初军力赖此强盛，然承平既久，逃亡日众、屯田废弛，卫所空额而战力骤衰，兵制积弊由此暴露，改弦更张势在必然。\n• 营兵之兴：土木之变后边患日亟，募兵渐起代世军，戚继光练浙兵、创鸳鸯阵，隆庆间总理蓟州练兵，立车步营，募兵常驻、专务操练。兵制由世兵制转向募兵制，战力虽增而养兵之费骤增，压于国库，兵制转型由此开启。", "11": "• 士绅地主膨胀：明中叶以后科举宦族与豪右竞相兼并田产，生员优免徭役之特权日扩，一县之田半归绅富，赋役转嫁于细民。里甲崩坏而民变屡起，绅民对立加剧，社会矛盾由此积蓄，晚明社会失控之局实肇端于此。\n• 矿监税使肆虐：万历中后期遣宦官四出榷税，矿监税使遍设州县，肆意科敛商民，激变地方，苏州织佣之变、武昌民变相继而起。商工之民愤而抗官，皇权掠夺与市民反抗正面相撞，晚明社会矛盾由此暴露无遗，统治危机日深。\n• 奴变与佃抗：明末江南奴仆群起索契焚券，佃农抗租罢耕，主仆名分与租佃重负并遭冲击。身份依附之网渐裂，阶级对抗随饥馑兵燹而激化，苏松常一带尤烈，士绅基业因之动摇，明末社会秩序由此瓦解，鼎革之势遂成。", "12": "• 阳明心学兴起：正德、嘉靖间王守仁倡致良知、知行合一，直指本心，一洗程朱拘守传注之弊，门下分浙中、泰州诸派，泰州派更及市井。思想界由恪守朱学转向自得自信，理学内部革新由此开启，晚明个性解放思潮实发端于此。\n• 李贽之异端：万历间李贽倡童心说，谓穿衣吃饭即是人伦物理，斥道学家之伪而肯定人欲之实，评点史传，以是非无定质翻千古之案。其说动摇儒家正统之尊，书遭禁毁，身陷囹圄自刎，异端思想因之而炽，批判思潮由此并起。\n• 实学经世之风：明末顾炎武、黄宗羲、王夫之痛亡国之祸，倡经世致用，黜空谈心性而重实证，究心典制、地理、音韵、田赋，批判君主专制与科举空疏。实学一脉开启清代朴学之先，学风由虚返实之转折由此实现，影响及于清初学术。\n• 禁书与文狱：洪武间兴表笺之祸，以谐音疑谤戮臣僚，文网渐密而士人噤口，又禁毁小说野史。思想钳制之端由此而启，士大夫治学渐趋谨小慎微，然较之清代文狱之酷犹为疏阔，一代文网之严疏足见专制之深浅，堪为对照。\n• 西学东渐初潮：万历间利玛窦等耶稣会士入华，与徐光启、李之藻合译几何、测量诸书，输入历算、舆地之学及仪器。天主教之行虽与礼俗相格，然西器西法初入中土，中西学术交流由此发轫，晚明士人研习西学之风气由此开启。", "13": "• 军屯民屯并举：明初令军士屯田自赡，移民垦荒募民屯田并举，屯田之入常逾额赋，国无养兵转饷之费而边有积谷。中叶以降豪强占垦、军户逃亡，屯政大坏边饷告匮，屯田制度由盛而衰，寓兵于农之制由此瓦解，边费遂为国患。\n• 皇庄王庄盛行：明中叶后皇室勋戚竞置庄田，皇庄遍于畿辅，王府庄田跨州连郡，投献侵占民业，庄头横索小民失业。土地集中因之加剧，赋税脱漏而税基萎缩，兼并之患显于畿辅，庄田之弊由此激化社会矛盾。", "14": "• 白银货币化：明中叶以后海外白银经马尼拉与澳门贸易大举流入，一条鞭法计亩征银更促其通行，白银取代宝钞铜钱而成为主要货币，市场交换与赋税征纳皆以银计。财政与经济之货币化由此深固，江南市镇因之勃兴，货币格局之转变，此诚一代币制之转折。\n• 商帮崛起：成化后晋商、徽商挟盐引、茶马之利雄踞南北，徽商以两淮盐业起家，晋商缘开中法中盐而兴，闽粤海商贸迁海上，商帮结伙远贩、建会馆联乡谊，资本积聚巨万，商人地位稍升。地域商帮之格局由此奠定，货币资本与市场网络相结，晚明商业之盛为前代所未有。", "15": "• 棉纺丝织鼎盛：明中叶松江棉布衣被天下，苏杭丝织机户出资、机工出力，雇值计工，手工工场萌蘖江南市镇。棉织与丝织分工细密、商品化日深，资本主义萌芽之说由是而起，江南手工业之繁荣奠定晚明经济格局。\n• 景德镇瓷器：景德镇设御器厂督造贡瓷，青花、五彩诸器精绝一时，民窑竞起而官民竞市，瓷业分工至细，画坯、烧窑各专其业，商舶载之外销。制瓷技艺冠绝当时，外销之利厚而匠役之苦深，景德镇由此成为天下瓷都。\n• 矿冶与造船：明代铁冶遍布粤闽晋陕，遵化铁厂规模宏巨，民营冶铸渐盛而铁器行销四方；造船则宝船巨舰惊人，福船广船为海防与远航所资。工艺积累深厚，然海禁渐严、技禁日密，新机未敞，手工业之扩展由此受限。", "16": "• 大明宝钞与钱钞：洪武八年颁大明宝钞，与铜钱兼行而以钞为主，禁金银交易。然宝钞不设钞本、滥发无度，钞值暴跌而民间拒用，中叶后宝钞几废，铜钱私铸充斥，币制紊乱，纸钞制度之失败由此定案，为后世币政之戒。\n• 白银渐为主币：宣德以降田赋折银渐广，隆庆开关后白银输入激增，民间大宗交易用银，银钱相权而银居其上。货币结构由钞钱并行转向银两与制钱并用，财政银本位倾向由此确立，嘉靖、万历间赋役征银遂成定制。", "17": "• 青藏多封众建：成祖封大宝、大乘、大慈三法王及阐化等五王，以宗教领袖分领其众，多封众建，许朝贡互市而用羁縻。中央不设流官而借教驭俗，青藏与内地往来不绝，明代治藏方略由此定型，为清代驻藏体制之先声。\n• 奴儿干都司：1409年成祖置奴儿干都司于黑龙江下游，统辖女真兀良哈诸部，岁遣官巡视，建永宁寺碑，下设卫所三百余。东北极边正式纳入版图管辖，朝贡镇戍并行，疆域经略由内地推及极边，多民族统御格局由此拓展。\n• 俺答封贡：隆庆间张居正、王崇古主抚，俺答孙把汉那吉降明，遂封俺答为顺义王，开大同诸马市，蒙汉息兵互市。北边烽燧渐稀，民得安业，民族共处之局渐成，然封贡仅及漠南一部，边备渐弛而隐患仍伏，和议之效由此彰显。", "18": "• 西南土司：明于云贵川广遍置土司，土官世袭、自理其民，隶布政司纳贡赋，朝廷许其世袭而责以职贡，流土并治以夷制夷。然争袭仇杀时作，叛服无常，万历间平播州之乱设流官，改土归流之议由此而萌，西南经营渐入深化之途。\n• 蒙汉关系转折：隆庆和议既成，明蒙由交战转为封贡互市，沿边开市，民得安业边费大省。民族交往由兵戈转向贸迁，然漠北诸部仍时叛时附，辽东女真崛起更代蒙古为北疆大患，族群格局由此潜移，北患终未根除。", "19": "• 靖难之战：建文元年燕王朱棣起兵，号称靖难，鏖战四年攻入南京夺位，内战耗竭民力而北边守备稍疏。宗室夺位虽成，藩王兵柄因之被削，藩屏之制遂变，兵争之烈开明代宗室内乱之端，皇位继承之紊乱由此见其大端。\n• 土木堡之变：正统十四年英宗在王振怂恿下亲征瓦剌，土木堡一役大军溃败，英宗被俘，随驾勋贵死伤殆尽。京师震动而于谦拥立景帝、督军守城，君俘而国不亡，武备废弛与宦官擅权之弊毕露，明之国势由盛转衰。\n• 东南抗倭：嘉靖间倭患大炽，王直、徐海通番勾倭，寇掠浙直闽粤沿海。明廷以胡宗宪总督浙直，用俞大猷、戚继光练义乌兵、创鸳鸯阵，台州、平海诸役连破之，嘉靖末倭患渐平。海防因之整饬，然海禁未改而乱源未尽。\n• 万历援朝：万历二十年丰臣秀吉侵朝鲜，朝鲜告急，明军两次入援，鏖战平壤、碧蹄馆，历时七年终驱倭出境。东亚宗藩秩序赖以维系，然师老财匮而辽左空虚，建州女真遂得乘间坐大，东征之役，明金消长于此埋下伏笔。\n• 明末农民战争：天启、崇祯间陕北大饥，王二首义，李自成、张献忠相继而起，均田免粮之号召深得流民之心。崇祯十七年李自成破北京，思宗自缢煤山，明祚遂绝，阶级怒火倾覆王朝，乱极而清师入关，鼎革之局由此而定。", "20": "• 郑和下西洋：永乐三年郑和奉旨首航，率将士两万七千余人，历东南亚、印度洋远抵波斯湾与非洲东岸，前后七下西洋。宣威颁赐、市易诸番，朝贡网横贯印度洋，然厚往薄来糜费不赀，罢航而海权遂弛，远航壮举之兴废。\n• 海禁之设：太祖厉行海禁，片板不许下海，成祖虽遣远航，民间互市之禁愈严，嘉靖间朱纨剿双屿而走私愈炽。市舶罢则倭患益深，隆庆元年开月港准民出海，海禁稍弛，禁海开海之反复映照明代对外政策之内缩。\n• 倭寇与海防：嘉靖朝倭患炽于东南，海商与日本浪人合流，王直据双屿、烈港为巢，走私与劫掠并行。明廷剿抚兼施，戚继光、俞大猷先后荡平之，中日民间走私与官方禁海相激，东海秩序因之重组，海防建设由此促进。\n• 西儒东来：万历间利玛窦入京献自鸣钟、万国舆图，交结朝士，汤若望等继至，译历算、铸火器，中西器物与学术相渐。传教与科学偕行，闭关未启而西学已渗入宫廷与士林，交流之脉潜通，晚明中外文化互动由此开启。", "21": "• 永乐大典编纂：永乐间命解缙、姚广孝等纂修永乐大典，辑图书七八千种，凡二万余卷，依洪武正韵统字、因字系事。类书之浩博冠绝古今，孤本秘籍赖以汇集，然正本庋藏深宫，后经兵火散佚，文献之巨憾由此而定。\n• 方志舆地：景泰以降朝廷修寰宇通志、大明一统志，郡县竞修方志，体例渐备，杨慎、王士性究心地理风物，游记方志并盛。地方史志体系由此大备，舆地之学与掌故相济，考据之风已胚胎于地志之学，一代文献赖以保存。\n• 明实录与国榷：历朝皆修实录，记列帝起居政事；私家撰史亦盛，谈迁以遗民之志撰国榷，百有余卷，编年纪明事，以补官史之阙。当代史与私撰并盛，史才辈出而考证渐精，实录之体至明大备，史学传统由此延续。", "22": "• 航海：郑和宝船——郑和七下西洋，宝船巨舶规模空前，牵星过洋之术精熟，针路与海图并施，官方航海达于极盛。其规模与航程为当时世界之最，航海技艺由此彰显，然图籍焚废、秘不示人，远洋之业随罢而中绝，盛衰之迹具载于斯。\n• 医药：本草纲目——李时珍毕生历二十七载撰成本草纲目，收药一千八百余种、附方万余首，正名辨误、纲目井然。集本草学之大成而开实证药物学之先，东传日本朝鲜、西译拉丁而风行世界，世界药学史之地位由此确立。\n• 农学：农政全书——徐光启撰农政全书六十卷，汇水利、农器、树艺、荒政诸门，译泰西水法以补传统农学，经世致用、中西会通。农业百科之体大备，垦田治水之策具在，传统农学格局由此而新，实学精神见之于农政。\n• 工艺：天工开物——宋应星撰天工开物，详载农耕、纺织、冶铸、舟车、造纸诸业技术，图文并茂、数据凿实。工艺百科之书冠于其时，手工业技艺赖此得传后世，实学之精神于器物之用中体现，技术文献之价值由此彰显。"}}, {"id": "p10", "name": "清（至1840）", "position": "专制顶峰与盛世的隐忧", "span": "1644—1840年", "sub": "", "feature": "清朝是中国最后一个帝制王朝。满洲入关后确立满汉二元之局，圣祖玄烨平三藩、复台湾、定边疆，开康雍乾盛世；世宗胤禛设军机处、行摊丁入亩，专制集权达于顶峰。中期编四库、兴文狱，思想禁锢而考据独盛；晚期闭关锁国，仅许广州一口通商，人口膨胀而隐忧暗伏，至鸦片之役西力东渐，千年之局遂变。", "events": "• 后金之建立：万历间努尔哈赤以父祖遗甲起兵，统一女真诸部，于赫图阿拉即汗位，国号大金，创八旗之制。萨尔浒一战大破明军四路之师，辽东震动，皇太极嗣位后改国号大清、称帝建元，入主中原之机由此酝酿。\n• 清军入关与定鼎：崇祯十七年（1644）李自成破京师、明亡，吴三桂引清兵入关，多尔衮率军败闯，迁都北京，旋南下翦灭南明与流寇余部。摄政王主政，满汉二元之局渐定，王朝更替以异族入主完成，专制集权之根基由此奠定。\n• 三藩之乱：康熙十二年玄烨力主撤藩，吴三桂举兵于云南，耿精忠、尚之信响应，战火遍及半个中国，历时八年始告平定。中央集权挫裂藩镇割据之险，朝廷借平叛而尽收兵柄财赋于督抚提镇，大一统之局由此巩固。\n• 收复台湾：康熙二十二年施琅率水师克澎湖，郑克塽纳土归降，明郑政权终结，翌年设台湾府隶福建省，海疆纳入直辖。东南波静而海防之责移于水师，版图完整得以维系，统一大业由此完成。\n• 康雍乾盛世：自康熙亲政至乾隆中叶，历三朝百余年承平，平准噶尔、定回部、改土归流，驻藏大臣与伊犁将军相继设官，疆域拓至极盛。摊丁入亩与永不加赋并行，滋生人丁逾三亿，奏折与军机处相为表里，帝政集权臻于顶峰，号为康雍乾盛世。然人满地狭、粮价腾踊，流民四起，白莲教之乱继之，盛下之衰已伏。\n• 鸦片战争爆发：道光二十年英舰北上侵扰粤闽浙，战事遽起，琦善妥协，虎门失守，清军节节败退，南京条约之衅由是而开。闭关之局被西炮轰破，千年未有之变局自此降临，清室衰象与列强东侵交汇，天朝体制动摇。", "cells": {"3": "• 议政王大臣会议：清初沿满洲旧制设议政王大臣会议，八旗诸王贝勒共议大政，君权受贵族牵制，中枢决策带满洲贵族色彩。其后权渐移于南书房、军机处，乾隆间废止，贵族议政之制终结，皇权集中趋势由此显现。\n• 理藩院与六部：清沿明制设吏户礼兵刑工六部，满汉复职而掌印归满员，另置理藩院掌蒙古、西藏、回部，与六部并立。中枢因族因事而设，多民族政务分司管理，理藩院之建制为历代所无，民族统御体制由此确立。\n• 南书房与内阁：康熙十六年玄烨选词臣入直南书房，撰拟谕旨，分内阁票拟之权。内阁沿明制而权轻，满汉大学士同列而章疏多循故事，中枢决策渐移内廷，君臣示意不出宫禁，阁权之削由此而显，内廷权重之局开启。\n• 军机处确立：雍正七年（1729）胤禛以用兵西北设军机处于隆宗门内，军机大臣跪受笔录、承旨书谕，简密迅捷而权归皇帝。内阁议政退居闲曹，议政王大臣会议渐废，专制皇权由此达于顶峰，清代中枢体制之格局确立。", "4": "• 八旗驻防：入关后八旗兵分驻京师与各省冲要，设驻防将军、都统统辖，筑满城与汉城相隔，旗民分治而直隶禁廷。军事控御与族分治理并举，驻防之网由京师达于边省，八旗世业渐荒而饷糈日重，控御体制由此定型。\n• 督抚定型：清初沿明督抚之制定为经制，康熙间分天下为十八行省，总督辖一至三省治军，巡抚守土理民，布按两司为其属吏。中央遣官久任守土而地方事权归一，省制格局由此奠定，为近世地方行政之基础。\n• 保甲与基层：雍正以降严饬州县力行保甲，十户为牌、十牌为甲、十甲为保，稽户查奸、连坐相维，门牌循环册岁报于官。里甲渐废而保甲独行，编户与治安合一，国家权力直达闾阎，基层控制由此加密。", "5": "• 科举满汉分榜：入关即开科举，乡会试满汉分榜分额取中，旗人另设翻译科以满文应试，后改满汉合榜。翰林清要之职多归汉人，满员多以荫叙笔帖式进身，族别寓于常科，满汉并用而等差存，选官格局由此确立。\n• 博学鸿词科：康熙十七年诏开博学鸿词科，征召海内名儒遗逸，试于保和殿，中式者授翰林官入纂明史。汉族士林菁英由抗节而渐附新朝，制科以示右文，文化绥靖之策由此推行，文网之外兼收怀柔之效。\n• 捐纳与荫生：康熙间以军兴开捐纳之例，出资可得实官与监生资格，后捐例屡开而难止，恩荫、难荫并叙。仕途因之芜杂，正途之外利禄之阶广开，吏治渐受其累而国库暂得补苴，捐纳成制之弊由此显现。", "6": "• 科道合一：雍正元年诏六科给事中并入都察院，给事中与御史同称科道，台谏之职合而为一。纠劾、言事皆隶宪台，监察网密而权重，然言官渐成君主耳目之司，风闻弹劾、党同伐异之习仍存，监察体制由此变局。\n• 巡按与提督：清初沿明制遣巡按御史巡方刷卷，以察吏安民，顺治末停遣，纠察之任渐归督抚，另设提督学政校士厘弊。台官岁巡之制稍弛而疆吏权任加重，官邪赖考课纠劾以稍戢，监察格局由此转变。\n• 密折之制：康熙间创密折奏事，雍正朝推广制度化，特许道府以上臣工径达御前，朱批亲授、缴回进呈。耳目之布遍于中外，下情上通而群僚互相侦伺，监察由公开台谏转向隐秘机要，专制洞察之术由此臻于极致。", "7": "• 大清律例颁定：顺治间颁大清律集解附例，沿明律稍加参定，乾隆五年修成大清律例，律文恒守、条例因时增修。律例合编、因案生例，集历代律学之大成，中华法系条理至此极密，司法裁判一准乎例，律典体制由此奠定。\n• 满汉异律：清律于刑罚、良贱、族制诸端别立满汉条款，旗人犯笞杖各照数鞭责，徒流军遣得折枷号，宗室觉罗减等科断。族别与等级并见于刑典，八旗特权公开化，法律之不平等由此固定，为清代法制之显著特征。\n• 秋审与则例：秋审朝审之制岁岁举行，各省死刑监候人犯汇册送部，九卿会审而勾决，矜慎刑狱；各部院则例厘定职掌，行政有法可依。死刑复核程序之密为历代所罕见，然例愈繁而胥吏缘以为奸，律例之密反成弊薮。", "8": "• 编户与保甲：清初编审人丁五年一举，造册征赋，后并里甲入保甲，十户相连、稽查流移，客民寄籍皆入册。民著于籍而畏连坐，国家控户之网加密，户口与治安合一之制由此确立。\n• 滋生人丁：康熙五十一年（1712）诏定滋生人丁永不加赋，以现有丁册为准，新增丁口免其加征，丁银之额自此冻结。隐匿之弊稍减而户口统计渐实，丁银并入了地赋之议由此萌生，为摊丁入亩之先声。\n• 保甲推行：雍正朝严饬州县力行保甲，牌甲相维、门牌详具丁口，客民流寓皆编入册，盗贼邪教赖以稽查。地方治安与赋役征发同出于此，控制之细密逾于前代，闾阎动静皆在官府把握之中，基层控制之局由此形成。", "9": "• 漕运与屯卫：清沿明制行漕运，南粮北输岁四百万石，运军隶卫所而屯田赡运，设漕运总督与河道总督经理之。然河道淤浅、运卒困敝，漕政积弊日深，河运之费牵动中枢，东南财赋赖此以赡京师，漕运体制由此维系。\n• 火耗归公：雍正二年（1724）山西始行耗羡归公，以州县私征之火耗提解归公，酌给官员养廉银，余充地方公费。陋规化为正项，贪墨稍戢而库藏充盈，赋外加征由此纳入章制，财政整饬之效立见。\n• 摊丁入亩推行：康熙末议摊丁于地，雍正元年诏令丁银摊入田赋一体征收，无地贫民免输而田多者增课。人丁之赋并入地亩，千年丁役之制就此终结，人口滋长而赋额不加，赋役由人丁为本彻底转向地亩为本，赋制由此大定。", "10": "• 八旗与绿营：清以八旗为经制亲军、绿营为经制兵，旗营分驻省会要隘，绿营列汛于州县，将弁兵丁各隶营伍，兵权直属中央。将不知兵、兵不私将，八旗开国而绿营守土，二元兵制由此奠定，然承平既久则营伍窳败。\n• 绿营经制：绿营额兵六十余万，分标协营汛，隶总督巡抚提督总兵，平时汛守缉盗，战时抽调成军，兵将相离。内地治安与征戍皆赖之，然兵籍冒滥、操演虚文，战力远逊八旗开国之初，军备之弛由此显现。\n• 团练与乡兵：嘉庆间川楚白莲教起事，官军不足恃，乡勇团练始盛，地方自募自练、事毕遣散，苗疆教乱中屡用之。借民力以佐兵不足，然团练坐大、勇营私属之患亦萌，晚清湘淮军之先例由此开启。", "11": "• 旗民分治：清别旗籍与民籍，旗人隶八旗都统，坐食钱粮，不得自营生计，民人供赋役，编于州县，旗民不交产、不通婚。身份壁垒以法固化，满汉之隔由制度而成，社会张力隐伏于族别不平等之中，旗民分治之局由此形成。\n• 白莲教起义：嘉庆元年川楚陕白莲教起事，以官逼民反相号召，流民裹挟、攻寨破城，蔓延五省，清廷竭府库之藏、历九年方定。教门之煽源于人口过剩与流民失业，盛世表象下的统治危机由此暴露。\n• 秘密结社与天理教：嘉庆十八年天理教徒于河南、直隶起事，林清率众突入紫禁城，震动宫禁；南方天地会辗转于闽粤，会党渐遍江湖。底层反抗之网渐密，官逼民反而会党横行，社会矛盾之蓄积至盛世末造而溃。", "12": "• 经世实学遗响：明清之际顾炎武、黄宗羲、王夫之遭鼎革之痛，倡经世致用，考典制、辨治乱、斥君主专制，学术由空谈心性返诸实事。朴学实证之脉由是而开，清初思想界之转向实肇于此，遗民学术成为一代学风之源。\n• 乾嘉考据之学：乾隆以降考据蔚为风尚，惠栋治易尊汉儒，戴震由音韵训诂以明义理，段玉裁、王念孙父子精于文字音韵之学，实事求是、无征不信。朴学臻于极盛而义理稍疏，学术精密而思想敛束，汉宋之争由此而炽。\n• 禁书与文狱：康雍乾三朝文字之狱迭兴，庄氏明史狱、戴名世南山集狱、吕留良案株连惨烈，乾隆借修四库寓禁于征，删改焚毁并施。士林噤声而思想钳制达于极致，学者转向训诂考据以避祸，文网之密为历代之最。\n• 西学东渐再起：康熙间历算之学行于钦天监，南怀仁造炮修历，嘉道间传教士潜入通商口岸，历算火器地图之学续传；朝士研西学者渐有经世之意，今文经学亦萌变革之议，西潮潜涌而旧学渐动，思想转机由此孕育。", "13": "• 圈地与更名田：入关初八旗圈占畿辅民田，旗地官庄遍设，汉农失业，康熙八年永停圈占，以明代藩庄归耕种之民，谓之更名田。圈占之祸稍戢而旗地依旧，地权分配重归兼并之途，小农生计艰难，土地格局由此奠定。\n• 垦荒与蠲免：康熙间奖励垦荒、宽限起科，屡下蠲免钱粮之诏，普免钱粮数千万两，民得辟莱以苏。田亩渐辟而赋额稍纾，然豪右占隐、飞洒诡寄如故，地籍不清则赋病细民，劝垦之效有限，盛世财政宽仁由此可见。\n• 土地兼并加剧：乾隆以降人口滋长而耕地有限，田归富户而佃耕遍野，押租预租之制并兴，一田数主而地权集中愈甚。租佃矛盾深固，佃户抗租之变时闻，衰世之象现于阡陌之间，人地矛盾由此激化。", "14": "• 商帮与票号：清初晋商执盐茶之利、徽商雄于典当盐业，会馆遍布通都大邑；道光初山西商人创日昇昌票号，以汇兑通天下，号令金融。商帮资本积聚而组织一新，汇兑网络由此形成，商业资本之组织为之一变。\n• 广州一口通商：乾隆二十二年诏西洋商船只许收泊广州，闽浙诸口悉闭，十三行专司对外贸易并承保纳税，行商垄断进出货税。中西贸易限于一隅，海关之利归公行，锁国体制以律令成，闭关政策之弊由此显现。\n• 国内市场繁荣：盛世生齿日繁，市镇星罗棋布，棉布、茶、丝远贩四域，长江与运河为货殖之动脉，区域市场互联成网。商品经济之深固逾于前代，然外贸受制于一口而内贸独盛，市场格局由此形成。", "15": "• 江南丝织机户：康熙以降苏杭织造繁盛，江宁机户聚族而业，机户出资、机工受值，帐房发料，染踹分业，工场规模逾明。雇值计工而分工细密，资本主义萌芽之说于丝织业见之，然匠籍苛索仍重，丝织之盛由此维系。\n• 景德镇与棉纺：景德镇御窑民窑并烧，青花五彩外销畅旺，窑户雇工而分工细密；松江棉布衣被寰宇，布号收布而远贩南北。手工技艺精湛而商品化日深，然行帮把持、捐税层出，匠户之困未苏，工艺之盛难掩民劳。\n• 矿冶铜政：清初矿禁渐弛，滇铜黔铅岁供铸钱之用，官督商办而炉座有额，京局铸钱仰给于滇铜之运。然封禁私采、民矿见扼，冶铁之业不逮前明，资源管控与民用之需相左，手工业之扩展受阻，铜政之制由此确立。", "16": "• 银钱并行定制：清承明制，银两为主币、制钱为辅币，制钱依年号更铸，大数用银小数用钱，银钱比价官定而时生波动。银两称量而行、成色繁杂，货币体系二元并行，币制沿明之旧而整饬未竟，银钱并行之格局由此奠定。\n• 外国银元流通：康熙开关之后吕宋番饼、西班牙本洋流入东南沿海，商民乐其计枚称便而乐于行用，洋钱渐夺纹银之席。外来银货通行于市，货币之国际化由此初显，然纹银外流、漏卮之患亦由是而起，币政受制于人。\n• 钱法与私铸：雍正间整理钱法、增炉鼓铸，禁私销而重钱法，然铜贵钱贱、毁钱铸器之利不绝，官钱羼铅而质劣。私铸充斥则钱轻物贵，银贵钱贱之困愈深，小民持钱易银倍受盘剥，币制紊乱牵动物价，财政民生交受其累。", "17": "• 台湾与东南海疆：康熙二十二年收台湾，翌年设府隶福建，置巡台御史稽察，东南海疆纳入直辖。郑氏之局终结，海防之责移于水师，渡台之禁时严时弛，疆域完整得以维系，经略海洋之意识犹薄，海疆格局由此奠定。\n• 驻藏大臣与金瓶：雍正五年设驻藏大臣督藏政，乾隆五十七年颁金瓶掣签之制，达赖班禅等呼毕勒罕由大臣监掣认定，政务僧俗并禀。政教之权归一，青藏由羁縻转为实控，主权行使由此而明，治藏体制从此确立。\n• 新疆伊犁将军：乾隆间两平准噶尔、戡定大小和卓，二十七年（1762）设伊犁将军统辖天山南北，军府制理边、屯戍并施。西域重入版图而建置一新，多民族疆域之奠定至此完成，西陲边患骤纾，边疆格局由此奠定。", "18": "• 满蒙联盟巩固：清初与漠南蒙古联姻、编旗设盟，康熙间败噶尔丹于乌兰布通、昭莫多，漠北喀尔喀内附，多伦会盟，盟旗定居。满蒙一体之局成，北边屏藩由此而固，联姻会盟，秋狝木兰并行，族群格局以满蒙联盟为枢。\n• 青藏与回部：驻藏大臣辖藏政，金瓶掣签定嗣统，伊犁将军制回疆，伯克为佐，中央以军府与宗教并治。藏族、维吾尔族各安其俗而同隶版图，多民族统合之制渐密，然族际差等与隔阂仍存，边疆经略格局由此奠定。\n• 西南改土归流：雍正间云贵总督鄂尔泰奏改土归流，剿抚并用，罢世袭土官，设流官，清查田土、编户籍、建城池，西南诸族渐隶郡县。羁縻之局一变为经制，中央权威深入溪峒，民族治理由间接而直接，边地开发由此促进。\n• 土尔扈特东归：土尔扈特部明末西迁伏尔加河流域，久受沙俄役属，乾隆三十六年渥巴锡率部众十七万东返，冲破追袭，抵伊犁者不及半数。清廷赈济安置、封汗分牧，万里东归彰显凝聚力，多民族国家统合由是而固。", "19": "• 平三藩之乱：康熙十二年吴三桂叛于云南，耿精忠、尚之信响应，战火蔓及半个中国，玄烨运筹八年，二十年昆明克复，三藩悉平。割据之患根除而海宇归一，中央集权借战事而巩固，统一之业由是而完。\n• 雅克萨之战：康熙间沙俄盘踞雅克萨、尼布楚，康熙二十四年清军水陆并进围雅克萨，俄军乞降，再征城破，遂与议界。二十八年定尼布楚条约，外兴安岭以南属中国，东北边疆借一战而安，中俄边界首次以条约划定。\n• 平准噶尔之役：康熙间亲征，噶尔丹败亡，乾隆二十年清军两路平达瓦齐，阿睦尔撒纳复叛而旋平，二十四年戡定大小和卓，天山南北底定。军锋远暨葱岭，大一统疆域极盛，然连年用兵而民力稍竭，极盛之下隐忧已伏。\n• 大小金川之役：乾隆十二年金川土司莎罗奔据碉抗官，久攻不下，三十六年大小金川复叛，阿桂督师，四十一年始平，先后糜帑七千万两。改土设屯、置懋功厅而羁縻一变，川西边陲巩固而国力耗竭，盛世之衰于此可见。\n• 白莲教与苗乱：乾隆末湘黔苗疆起于前，嘉庆元年川楚白莲教起于后，蔓延五省，官军旷日无功，乡勇团练因之而兴，历九年事平。兵燹连年、帑藏虚耗，武备之弛尽露，教门流民之反抗暴露盛世危机，衰世之征现于戎机。", "20": "• 中俄尼布楚定约：康熙二十八年（1689）清俄使臣会于尼布楚，划定中俄东段边界，以格尔必齐河与外兴安岭为界，岭南属中国。中国首次与西方平等缔约，北徼安谧数十载，对外关系由朝贡转向条约由此开启。\n• 传教士与钦天监：顺治康熙间汤若望、南怀仁相继掌钦天监，修历造炮，西法行于官守，康熙帝命传教士返欧延聘。然礼仪之争起，康熙晚年禁教，雍正朝厉行驱逐，西学之传限于技艺，交流之脉乍通乍塞，中西之隔渐深。\n• 马戛尔尼使华：乾隆五十八年英使马戛尔尼借贺寿来华，请开宁波舟山等口、减税并驻使，俱遭拒斥，觐见礼仪亦成争端。天朝自大之态与西力东渐之势正面相撞，闭关之局难挡工业革命之潮，变局之兆由此埋下。", "21": "• 大清一统志与方志：康熙、乾隆两朝敕修大清一统志，嘉庆重修尤为精审，郡县竞纂方志，章学诚倡立三书义例。顾祖禹撰读史方舆纪要，考沿革、论险要，尤称精博，地理之学大盛，考据之风濡染史地，一代文献赖以存续。\n• 明史与四库全书：乾隆四年（1739）明史告成，历九十余年、经万斯同、张廷玉等之手，体例谨严，集官修前代史之大成；乾隆三十八年开四库全书馆，纪昀总其成。官修史书之盛由此奠定，明史之善为学界推许。\n• 通鉴与御纂史书：乾隆敕修御批历代通鉴辑览，编年纪事而以正统为纲，御批纲鉴诸书并行于塾学，官修史书兼寓褒贬垂戒。史学为政治服务之旨显，然义例拘于宸断，信史之裁未尽其公，官修史学之格局由此形成。\n• 顾炎武与日知录：明清之际顾炎武积平生考索，成日知录三十二卷，以札记体辨经史、考舆地职官财赋，倡经世致用。是书矫明末空疏之弊，开清代朴学之先河，天下兴亡匹夫有责之论由是风行，实学精神由此确立。", "22": "• 测绘：皇舆全览图——康熙间命传教士白晋、雷孝思等分赴各省实测经纬度，历十年而成皇舆全览图，附分省舆图。实测成图之法开中国近代地图学之先，测绘精度超前代，传统舆地因西法而焕新，测绘成就由此彰显。\n• 类书：古今图书集成——陈梦雷初纂、蒋廷锡重编，凡一万卷，分六汇编、三十二典，纲举目张而部类井然，雍正间铜活字印行。百科汇钞之制冠于其世，典籍检索赖之以便，承永乐大典之绪而体例更严整，类书之尊由此确立。\n• 丛书：四库全书——乾隆敕修四库全书，收书三千四百种、近八万卷，分经史子集四部，钞成七部贮文渊等七阁。搜罗之富旷古未有，典籍赖以汇存，然寓禁于征、删毁并施，文网之酷与文治之盛一体两面，文献地位由此确立。\n• 园林：圆明园——康熙赐园而后雍正、乾隆累世增葺，四十景次第落成，西洋楼仿欧式而中西合构，移天缩地于方壶。皇家园林之极致由是而成，营缮之巧集工艺大观，然珍奇萃聚而民力耗于游观，盛极之象已伏衰机。\n• 文学：红楼梦——曹雪芹以毕生心血撰石头记，写贾史王薛四大家族之盛衰，人情世态刻画入微，诗词曲赋兼美，脂评本与程高本先后流传。古典小说之巅由是而立，写实精神于文苑彰显，小说地位因之而尊。"}}], "cross": {"3": "【脉络梳理】\n→夏商西周（约前2070）：夏设六卿，商有尹与多尹，西周太师太保辅政，卿事寮掌政务\n→春秋战国（前770）：各国设相与将，秦行二十等爵，官僚制取代世卿，国君直接任免\n→秦汉（前221）：秦立三公九卿，汉承秦制，武帝设内朝尚书分丞相之权\n→三国两晋南北朝（220）：魏创中书省掌诏令，南北朝中书门下并立，尚书省分曹治事\n→隋与唐前期（581）：隋创三省六部，唐定型为中书出令、门下审议、尚书执行\n→唐中后期与五代（755）：翰林学士掌内制、枢密使掌军政，三省职权渐被侵夺\n→两宋（960）：中书门下与枢密院对掌文武，三司理财，参知政事分宰相权\n→元（1271）：中书省总政务、枢密院掌兵、御史台监察，宣政院辖吐蕃事务\n→明（1368）：太祖废丞相权分六部，成祖设内阁备顾问，司礼监批红渐掌实权\n→清（1644）：沿内阁六部，雍正设军机处承旨办事，议政王大臣会议渐成虚设\n\n【演变趋势与逻辑】\n中央官制沿着君主近臣取代外朝大臣的方向演变，皇权一步步摆脱相权的牵制。秦汉三公九卿由丞相总揽政务，汉武帝用内朝尚书分其权。魏晋南北朝中书出令、门下审议、尚书执行，隋唐三省六部把它定型为法定程序。唐中期以后皇帝另用翰林学士与枢密使绕开三省，宋以中书门下、枢密院、三司三分宰相之权。元以中书省总政务，明太祖索性废丞相，六部直属皇帝，内阁与司礼监成为辅政与批红的两手。清设军机处承旨拟旨，专制皇权至此再无可以与之抗衡的宰相。", "4": "【脉络梳理】\n→夏商西周（约前2070）：夏商以方国联盟为外服，西周大封同姓异姓诸侯，以藩屏王室\n→春秋战国（前770）：诸侯灭国设县，商鞅集小乡邑为县，郡县两级制初具轮廓\n→秦汉（前221）：秦废封建行郡县，汉初郡国并行，景帝平七国、武帝推恩削藩\n→三国两晋南北朝（220）：州郡县三级渐成，侨州郡县安置流民，行政区划重叠混乱\n→隋与唐前期（581）：隋废郡存州县二级，唐设十道为监察区，后演为方镇坐大\n→唐中后期与五代（755）：节度使兼数州军政财权，藩镇世袭自署官吏，形同独立\n→两宋（960）：设路为高层政区，帅漕宪仓四司分权，通判牵制知州、州县直属朝廷\n→元（1271）：创行省制为最高地方区划，下辖路府州县，权大而受朝廷节制\n→明（1368）：废行省设三司分掌民政司法军政，后遣巡抚总督总制一省钱粮兵备\n→清（1644）：设十八省与督抚制，边疆置将军办事大臣，理藩院统辖蒙藏回部\n\n【演变趋势与逻辑】\n中央与地方的关系，是分封的离心力与郡县的向心力反复拉锯的历史。西周大封诸侯以藩屏王室，结果诸侯坐大而王室衰微。春秋战国各国设县置郡，秦统一后彻底以郡县取代分封，汉初一度郡国并行，经景帝平叛与武帝推恩才重归中央。魏晋南北朝州郡县三级膨胀、侨置州县混乱，隋废郡存州以精简层级。唐设道为监察区，却演成节度使兼掌数州军政财的藩镇。宋以路分权、州县直属朝廷，元创行省而不使地方专权过甚，明清以督抚与三司互相牵制，中央集权在行政区划上最终稳定下来。", "5": "【脉络梳理】\n→夏商西周（约前2070）：官职世袭、世卿世禄，血缘定贵贱，乡里举荐仅备低级吏员\n→春秋战国（前770）：军功授爵与养士并起，商鞅定二十等爵，布衣可致卿相之位\n→秦汉（前221）：秦行军功与文法吏，汉立察举孝廉、征辟名士，太学考试补郎官\n→三国两晋南北朝（220）：魏行九品中正，中正评品定官，上品无寒门、下品无势族\n→隋与唐前期（581）：隋废九品中正创科举，唐设进士明经诸科，考试择官成定制\n→唐中后期与五代（755）：科举虽存而请托公行，荐举与门荫并行，寒士登进仍艰难\n→两宋（960）：糊名誉录、锁院别头防舞弊，取士不问家世，进士及第即授美官\n→元（1271）：科举时兴时废、录取甚少，宿卫与吏员出职为主要入仕途径\n→明（1368）：科举独盛，八股文限四书五经义，学校与科目合一，监生亦得授官\n→清（1644）：沿明制行科举，满人另有翻译科与荫袭，捐纳开而正途渐为所侵\n\n【演变趋势与逻辑】\n选官从重血缘到重德望，再到重考试成绩，是门阀政治衰落与君主专制强化的直接后果。夏商西周世卿世禄，官位由家族继承。战国军功爵与养士让布衣可以致身卿相，汉代察举征辟以乡里评议取人，日久被地方豪右把持。九品中正制把评品权交给中正，形成上品无寒门的门阀格局。隋废中正、创科举，唐以进士明经取士，宋用糊名誉录防舞弊，寒门仕进之路才真正打开。元科举不振而重吏员，明清以八股取士把考试内容与程朱理学绑定，选才与思想控制合而为一。", "6": "【脉络梳理】\n→夏商西周（约前2070）：商设多尹监外服，西周有监国之制，监察尚未独立成系统\n→春秋战国（前770）：各国设御史记事兼监察，郡县置监，国君遣人刺察地方吏治\n→秦汉（前221）：秦设御史大夫掌监察，汉遣刺史以六条问事，司隶校尉纠察京师\n→三国两晋南北朝（220）：御史台脱离少府独立，中丞掌纠劾，然门阀庇护士族难纠\n→隋与唐前期（581）：隋设谒者台司隶台，唐御史台分台院殿院察院，分巡地方十道\n→唐中后期与五代（755）：监察使多由藩镇兼任，台官弹劾常遭宦官与宰相压制\n→两宋（960）：设谏院与御史合为台谏，许风闻奏事，台谏宰相相牵以固皇权\n→元（1271）：御史台与行御史台并设，肃政廉访司巡按，纠察蒙汉官员不法事\n→明（1368）：改御史台为都察院，设十三道监察御史，巡按御史代天子巡狩地方\n→清（1644）：都察院与六科给事中并立，雍正科道合一，密折使监察入皇帝私门\n\n【演变趋势与逻辑】\n监察从附属于行政走向独立的专职机构，又逐渐沦为皇权牵制百官的工具。秦汉御史大夫与刺史以六条问事，监察对象主要是地方长吏。魏晋御史台独立，但对门阀士族难以纠劾。隋唐御史台分三院、分道巡察，制度最为规整。唐后期台官受制于宦官与宰相，宋以台谏合一、许风闻奏事，用言官牵制宰相以固皇权。元设行御史台与肃政廉访司，明改都察院、遣巡按御史代天子巡狩，清以科道合一与密折把监察直接置于皇帝个人掌握之下。监察越严密，说明君臣之间的猜忌越深。", "7": "【脉络梳理】\n→夏商西周（约前2070）：夏有禹刑、商有汤刑，西周作九刑与吕刑，明德慎罚、礼刑分施\n→春秋战国（前770）：郑铸刑书、晋铸刑鼎成文法公开，李悝著法经，商鞅改法为律\n→秦汉（前221）：秦律细密严苛、轻罪重罚，汉约法三章后萧何作九章律，春秋决狱\n→三国两晋南北朝（220）：魏定新律以八议入律，晋泰始律宽简，北魏律开隋唐律之先\n→隋与唐前期（581）：隋开皇律定五刑十恶，唐律疏议律疏合一，礼法合治成东亚法范\n→唐中后期与五代（755）：格敕汇编补律之不足，五代用刑严酷，律典体系趋于紊乱\n→两宋（960）：沿唐律行宋刑统，编敕日盛以敕代律，杖脊刺配等刑罚渐趋加重\n→元（1271）：元典章汇辑判例条格，法律依民族分等适用不同，蒙古法与汉法并行\n→明（1368）：大明律与明大诰并施，重典治吏、法外用刑，律例并行而后期以例破律\n→清（1644）：大清律例集历代律学之大成，例文不断增修，满汉异法而重纲常名教\n\n【演变趋势与逻辑】\n法律从习惯与礼制中分离出来，成文法公开化，最终形成礼法合一的中华法系。西周明德慎罚、礼不下庶人刑不上大夫，刑与礼分施于不同等级。春秋战国把刑书刑鼎铸于鼎上，成文法公开打破贵族对法律的垄断，法经与秦律确立以刑为主的体系。汉儒以春秋决狱引礼入法，魏晋南北朝八议入律、律学趋于宽简，为隋唐集大成作准备。唐律疏议律疏合一，成为东亚各国共同的法范。宋以敕补律，元依民族分等适用不同法律，明清重典治吏、律例并行，纲常名教始终是立法与司法的最终依据。", "8": "【脉络梳理】\n→夏商西周（约前2070）：商有登人制度籍民数，西周行国野分治，乡遂组织编民以伍\n→春秋战国（前770）：各国书社编户，商鞅行什伍连坐、废逆旅，户籍为赋役征发依据\n→秦汉（前221）：秦行户籍相伍，汉编户齐民定户等，乡三老啬夫游徼分掌教化赋役盗贼\n→三国两晋南北朝（220）：战乱户籍散乱，土断检籍整顿版籍，宗主督护与三长制相继而行\n→隋与唐前期（581）：隋大索貌阅核定户口，唐三年一造籍、计帐定户等，乡里村坊相统\n→唐中后期与五代（755）：户籍不修而两税据资产定税，藩镇自掌管内户口不上户部\n→两宋（960）：五等丁产簿与保甲法并施，主客户分籍，坊场河渡等杂税随籍摊派\n→元（1271）：诸色户计按职业定籍，军户匠户世代不易其业，社制劝农并维地方秩序\n→明（1368）：黄册攒造十年一轮，鱼鳞图册核田亩，里甲制一百十户为一里供役\n→清（1644）：编审人丁与保甲并行，雍正摊丁入亩后废人丁编审，保甲专司治安稽查\n\n【演变趋势与逻辑】\n户籍与基层治理的核心，是朝廷如何把分散的小农编组起来以便征税征役。商周以族与乡遂组织编民，商鞅行什伍连坐、废逆旅，把户籍变成赋役与治安的凭据。秦汉编户齐民，乡三老、啬夫、游徼分掌教化与赋役。魏晋战乱使户籍散乱，土断与三长制都是重新攥住人口的努力。隋唐大索貌阅、三年一造，户籍制度最称严密。两税法人丁不再是唯一依据，户籍对赋役的意义下降。宋以保甲与五等丁产簿维稳，元以诸色户计把职业固定下来，明清黄册鱼鳞与里甲把人丁田亩一并登记，摊丁入亩后户籍才主要转为治安之用。", "9": "【脉络梳理】\n→夏商西周（约前2070）：夏行贡法、商助法、西周彻法，藉田以力役为主，赋取什一\n→春秋战国（前770）：鲁宣公初税亩履亩而税，各国按田征赋，秦汉租赋体系由此发端\n→秦汉（前221）：秦收泰半之赋、戍役繁重，汉初十五税一至三十税一，算赋口赋更卒正卒\n→三国两晋南北朝（220）：曹魏行户调制，西晋占田课田与户调式，北魏均田下租调制\n→隋与唐前期（581）：隋行租庸调减轻入年龄，唐每丁租二石、调绢二丈、岁役二十日\n→唐中后期与五代（755）：均田崩而租庸调难行，杨炎行两税法按资产征税、分夏秋两征\n→两宋（960）：两税外加身丁钱米与杂变，王安石行方田均税募役青苗，支移折变困民\n→元（1271）：税粮与科差并行，江南沿用宋两税，丝料包银按户征取，役法繁苛\n→明（1368）：夏税秋粮征米麦，一条鞭法并赋役为一条、计亩征银，匠班银代役\n→清（1644）：康熙盛世滋丁永不加赋，雍正摊丁入亩并丁银于地，地丁合一征银\n\n【演变趋势与逻辑】\n赋役的演变，是征税标准从人丁转向土地、征收形式从实物力役转向货币的过程。夏商西周以藉田力役为主，春秋初税亩开履亩而税之端。秦汉田租口赋与更卒正卒并行，汉初轻田租而人丁税重。魏晋南北朝户调制按户征收，北魏均田下租调与丁绑定。隋唐租庸调以丁为本，均田瓦解后无法维持，两税法改按资产征税、分夏秋两征，为后世开新例。宋附加杂变与支移折变，元税粮科差并行，明一条鞭法并赋役为一条、计亩征银，清摊丁入亩最终把人头税并入土地。人丁负担减轻、土地负担加重，是这一过程的实质。", "10": "【脉络梳理】\n→夏商西周（约前2070）：夏商临时征发族众，西周六军属王室、诸侯备三军，国人服兵役\n→春秋战国（前770）：兵农合一渐转常备军，各国行郡县征兵，魏武卒、秦锐士为精兵\n→秦汉（前221）：秦行普遍征兵、傅籍服役，汉正卒戍边更卒，武帝后募兵与刑徒兵并用\n→三国两晋南北朝（220）：三国世兵制军户世袭，西晋都督诸军，北朝行府兵制鲜卑汉人分治\n→隋与唐前期（581）：隋沿用府兵、军人受田，唐折冲府六百余，兵农合一自备粮械番上宿卫\n→唐中后期与五代（755）：府兵坏而行募兵，神策军归宦官，藩镇牙兵骄横逐帅如儿戏\n→两宋（960）：募禁军厢军、更戍法兵将分离，将兵法定将专兵，保甲与乡兵补充\n→元（1271）：蒙古军探马赤军、汉军新附军分等，军户世袭、奥鲁管军属，宿卫怯薛最亲\n→明（1368）：卫所制军户世袭屯田自给，五军都督府统军、兵部调遣，后期营兵募兵兴起\n→清（1644）：八旗兵与绿营兵并立，旗兵驻防京师要地，后绿营腐化而勇营乡勇代兴\n\n【演变趋势与逻辑】\n兵制从兵农合一的征兵，转向职业化的募兵，军权则越来越集中到皇帝手中。商周以族众与国人为兵，战国郡县征兵与常备精兵并起。秦汉普遍征兵、傅籍服役，武帝以后募兵与刑徒兵渐多。三国世兵制使军户世袭，北朝府兵制把鲜卑与汉人纳入同一系统。隋唐府兵受田、番上宿卫，兵农合一而国家养兵成本低。均田崩坏后府兵无法维持，募兵与藩镇牙兵兴起，兵归将有，成为唐末五代祸乱之源。宋以募兵与更戍法分离兵将，元以军户世袭，明以卫所屯田自给，清以八旗绿营并立，养兵之费始终是国家财政最沉重的负担。", "11": "【脉络梳理】\n→夏商西周（约前2070）：贵族平民奴隶三层分明，国人野人分治，国人有议政与当兵之权\n→春秋战国（前770）：宗法崩而士人崛起，地主与自耕农成主体，奴隶制渐为租佃所替\n→秦汉（前221）：编户齐民、名田制下豪强兼并，奴婢与刑徒众多，末年流民起义爆发\n→三国两晋南北朝（220）：门阀士族占田荫客，部曲佃客依附，寒门难进、士庶之别天隔\n→隋与唐前期（581）：科举破门阀，均田制下自耕农众多，奴婢部曲仍存，关陇集团当政\n→唐中后期与五代（755）：均田坏而庄园兴，客户佃农增多，庞勋黄巢起义冲击门阀残余\n→两宋（960）：士大夫与庶族地主为主，主客户分籍、租佃契约化，佃农人身依附趋松\n→元（1271）：四等人制下蒙古色目居上，驱口数量庞大，江南地主仍保其产业与地位\n→明（1368）：里甲编民、士绅阶层成形，缙绅免役优免，流民问题与矿监税使激民变\n→清（1644）：满汉旗民分治、主佃关系紧张，人口激增致人均耕地缩减，会党结社日盛\n\n【演变趋势与逻辑】\n社会结构从等级森严的贵族社会，走向流动性更大的地主与佃农社会。夏商西周贵族、平民、奴隶三层分明，国野分治。春秋战国宗法崩解，士人崛起、地主与自耕农成为主体。秦汉编户齐民，豪强兼并造成流民问题。魏晋南北朝士族占田荫客，士庶之别严如天隔。隋唐科举与均田削弱门阀，唐末战乱更使残余士族扫地以尽。宋以后租佃契约化，佃农人身依附减轻，士大夫与庶族地主成为主导。元以四等人制加一层民族等级，明的里甲与缙绅优免、清的人口压力与地权集中，都使主佃矛盾成为晚期帝制社会的主要问题。", "12": "【脉络梳理】\n→夏商西周（约前2070）：殷人尊神事鬼、占卜决事，西周敬天保民、制礼作乐，德治观念萌发\n→春秋战国（前770）：孔子倡仁礼、孟荀各阐其说，老庄法墨并起，百家争鸣成思想高峰\n→秦汉（前221）：秦尚法家以吏为师，汉初黄老无为，武帝独尊儒术，董仲舒天人感应新儒学\n→三国两晋南北朝（220）：经学衰而玄学兴，名教与自然之争，佛教广布、道教成形，三教并立\n→隋与唐前期（581）：三教并行、儒学复振，太宗定五经正义，玄奘取经、佛教宗派林立\n→唐中后期与五代（755）：韩愈倡道统排佛，李翱复性说启宋学，禅宗盛行而经学式微\n→两宋（960）：二程朱熹集理学之大成，陆九渊主心学，王安石新学与陈亮叶适事功之学并起\n→元（1271）：程朱理学北传并定科举程式，藏传佛教受尊崇，也里可温与伊斯兰教并行传播\n→明（1368）：阳明心学崛起、倡致良知与知行合一，李贽反正统，明末实学与西学东渐初现\n→清（1644）：理学仍为官学而考据学大兴，顾黄王倡经世致用，文字狱钳制思想而朴学避世\n\n【演变趋势与逻辑】\n思想的演变，是官方意识形态从神权、法家到儒学，再吸收佛道而重构为新儒学的过程。殷人尊神，西周以德配天、制礼作乐，为儒家提供了源头。春秋战国百家争鸣，儒墨道法各陈救世之方。秦汉先后用法家与黄老，武帝以后独尊儒术，董仲舒以天人感应把儒学改造成帝国意识形态。魏晋玄学与佛教兴起，儒学独尊地位动摇。隋唐三教并行，韩愈排佛而启宋学。宋儒吸收佛道思辨建立理学，把纲常上升到天理，元明定为科举程式。明清心学与实学先后冲击理学，考据学鼎盛而思想活力渐衰，西学东渐则埋下近代转型的种子。", "13": "【脉络梳理】\n→夏商西周（约前2070）：井田制下土地国有，庶人耕公田与私田，田里不鬻、不得买卖\n→春秋战国（前770）：铁器牛耕开出私田，鲁初税亩承认私田，商鞅废井田、民得买卖\n→秦汉（前221）：秦令黔首自实田，汉行名田制以限田，董仲舒限民名田、王莽王田制皆败\n→三国两晋南北朝（220）：曹魏屯田、西晋占田，北魏太和九年行均田，桑田露田各有定制\n→隋与唐前期（581）：隋沿均田、丁男受田百亩，唐口分永业分授，还授有定制而买卖渐开\n→唐中后期与五代（755）：均田制瓦解、庄园庄田盛行，两税承认土地兼并，不抑兼并成定局\n→两宋（960）：不立田制、不抑兼并，官田民田并存，租佃契约普遍、土地流转加快\n→元（1271）：官田牧场广大，蒙古贵族圈占民田为牧地，江南沿用两税与租佃旧制\n→明（1368）：鱼鳞图册核田、官民田分等，皇庄藩王庄田广占，一条鞭法按亩征银\n→清（1644）：圈地令后禁圈，更名田归垦户，摊丁入亩后地权流动加速，永佃权盛行\n\n【演变趋势与逻辑】\n土地制度从国家分配到私人所有，兼并始终是贯穿其中的主线。西周井田制下田里不鬻，土地不能买卖。春秋战国铁器牛耕造出大量私田，初税亩与废井田承认了土地私有。秦汉名田制试图限田而无效，豪强兼并愈演愈烈。北魏至唐行均田制，国家授田与还授，自耕农一时繁盛，终究抵不过人口增长与贵族占田。两税法以后国家不再抑制兼并，宋不立田制，土地流转加快、租佃契约普及。元圈占民田为牧地，明清官庄藩田庞大而民田交易活跃，摊丁入亩后地权进一步集中，土地问题始终是王朝盛衰的关键。", "14": "【脉络梳理】\n→夏商西周（约前2070）：商代已有专业商人、贝为货币，西周工商食官，交易由官营主导\n→春秋战国（前770）：私营商业兴起，范蠡子贡致富，各国铸刀布圜钱，临淄邯郸都会繁盛\n→秦汉（前221）：秦统一度量衡、车同轨，汉开关梁弛山泽之禁，长安洛阳九市与丝路通\n→三国两晋南北朝（220）：北方战乱商路阻断，南方荆州扬州兴起，钱币杂用、谷帛为市\n→隋与唐前期（581）：隋开运河通商贸，唐长安东西两市、坊市制严整，飞钱便商贾远行\n→唐中后期与五代（755）：坊市制松动、夜市草市渐兴，扬州益州号扬一益二，商税渐成税源\n→两宋（960）：坊市界限打破、早市夜市相连，交子会子行用，商税与榷货成财政大宗\n→元（1271）：驿站遍设、海运漕粮通南北，大都杭州繁华，斡脱商人经营、海外贸易繁盛\n→明（1368）：运河沿岸城镇兴起，徽商晋商并起，一条鞭计亩征银促白银流通，海禁限外贸\n→清（1644）：全国性市场形成，票号典当业发达，十三行独口通商，外贸长期出超白银内流\n\n【演变趋势与逻辑】\n商业由官府控制走向民间繁荣，市场对国家财政的意义越来越大。西周工商食官，交易由官营主导。春秋战国私营商业兴起，富商大贾与都会并起。秦汉统一度量衡与驰道，开关梁弛山泽之禁，丝绸之路接通欧亚。魏晋南北朝北方商路受阻而南方兴起。隋唐运河贯通、坊市严整，唐后期夜市草市突破坊市限制。宋彻底打破坊市界限，交子会子通行，商税成为财政大宗。元以驿路与海运疏通全国，海外贸易极盛。明清运河商帮与全国市场形成，白银成为主要货币，但海禁与一口通商限制了海外贸易的规模。", "15": "【脉络梳理】\n→夏商西周（约前2070）：二里头青铜礼器初兴，商司母戊鼎重八百余公斤，西周金文纪功赏赐\n→春秋战国（前770）：铁器牛耕推广，青铜失蜡法精进，齐国丝织、楚国漆器各擅其长\n→秦汉（前221）：秦兵马俑陶塑、汉盐铁官营，素纱襌衣仅四十九克，炒钢与百炼钢成法\n→三国两晋南北朝（220）：马钧改进织绫机，綦毋怀文发明灌钢法，青瓷成熟、建康织锦闻名\n→隋与唐前期（581）：大运河促手工业流通，唐三彩与邢白越青并称，丝绸染织技艺精进\n→唐中后期与五代（755）：越窑秘色瓷、长沙窑外销，扬州铜镜、定州缂丝名动一时\n→两宋（960）：汝官哥钧定五大名窑齐名，煤铁炼钢与活字印刷，造船设水密隔舱、指南针用于航海\n→元（1271）：黄道婆改良棉纺、松江成布都，青花瓷成熟外销，织金锦纳石失受贵族珍爱\n→明（1368）：景德镇成瓷都、青花五彩斗彩并出，苏杭丝织与遵化冶铁，《天工开物》总结百工\n→清（1644）：景德镇御窑盛极，江宁苏杭织造、南京云锦，矿禁松弛而民营矿冶与工场兴起\n\n【演变趋势与逻辑】\n手工业由官府垄断渐向民间开放，技术与规模在宋明清达到传统社会的高峰。夏商西周青铜铸造由王室控制，礼器重器代表等级。春秋战国铁器推广、私营手工业兴起。秦汉盐铁官营，官营作坊规模宏大，炒钢百炼钢与素纱襌衣代表技术高度。魏晋南北朝灌钢法与青瓷成熟，隋唐丝绸、三彩、金银器精丽。宋五大名窑、煤铁炼钢、活字印刷、造船水密隔舱，成就最为集中。元棉纺与青花瓷改变日用与外销格局。明清景德镇、苏杭织造与民营矿冶并盛，但官营匠籍与重农抑商的政策，始终限制其向机器生产转化。", "16": "【脉络梳理】\n→夏商西周（约前2070）：贝为最早货币、以朋计，商晚期铜贝出现，西周铜锊亦作称量货币\n→春秋战国（前770）：布刀圜钱蚁鼻并行，秦行半两圆钱，各国自铸而形制币值纷杂不一\n→秦汉（前221）：秦半两统一全国币制，汉初许民私铸，武帝行五铢钱、铸币权归上林三官\n→三国两晋南北朝（220）：钱币减重、私铸劣钱流行，曹魏一度废钱用谷帛，北魏铸太和五铢\n→隋与唐前期（581）：隋铸五铢严私铸之禁，唐行开元通宝、钱文改称通宝，绢帛兼作支付\n→唐中后期与五代（755）：钱荒频现、铜禁甚严，飞钱便兑换，五代铁钱铅钱杂行、币制紊乱\n→两宋（960）：铜铁钱并行、铸额空前，北宋交子为世界最早纸币，南宋会子滥发而物价腾涌\n→元（1271）：中统至元钞为主币、禁用铜钱金银，钞法初行有准备金，后期滥发而钞价暴跌\n→明（1368）：大明宝钞行而渐废，铜钱与白银并用，计亩征银与隆庆开关致白银大量内流\n→清（1644）：银钱并行、白银为本位，官局鼓铸铜钱，外国银元流入，白银外流致银贵钱贱\n\n【演变趋势与逻辑】\n货币从实物与称量货币，走到铜钱本位，最终确立白银主导的地位。商周以贝与铜锊为币，春秋战国布刀圜钱并行、形制纷杂。秦半两与汉五铢统一币制，铸币权归于中央。魏晋南北朝钱币减重、谷帛为市，币制一度倒退。唐开元通宝改称通宝，成为后世铜钱范本，钱荒与飞钱相伴而生。宋铜铁钱并行而铸额空前，交子是世界最早的纸币，会子滥发则引发物价腾涌。元以纸币为主币而铜钱几废，钞价终因滥发而崩。明宝钞迅速废弛，白银因赋役折银与海外流入成为主币。清银钱并用，白银外流造成的银贵钱贱，成为晚清财政危机的根源。", "17": "【脉络梳理】\n→夏商西周（约前2070）：商征土方鬼方，西周封燕晋于边以御戎狄，南土经营至江汉淮夷\n→春秋战国（前770）：秦霸西戎、燕却东胡，赵武灵王置云中雁门，各国筑长城以界农牧\n→秦汉（前221）：秦筑万里长城、置南海三郡，汉设西域都护与护羌校尉，屯田戍边相维\n→三国两晋南北朝（220）：曹魏定乌桓、蜀汉平南中，北魏设六镇防柔然，边镇渐成割据势力\n→隋与唐前期（581）：隋修长城、通西域，唐置安西北庭等都护府，羁縻府州以夷制夷\n→唐中后期与五代（755）：边镇节度使坐大，河西陇右尽没吐蕃，边疆多由藩镇与外族分据\n→两宋（960）：宋辽夏金对峙，宋设沿边安抚使与寨堡，羁縻州治西南，岁币买边安\n→元（1271）：设岭北辽阳甘肃等行省辖边，宣政院辖吐蕃，土司制治西南，驿路通达四境\n→明（1368）：九边重镇设总兵、大修长城，奴儿干都司辖东北，西南土司与卫所参用\n→清（1644）：设伊犁将军、驻藏大臣，改土归流废土司，盟旗制治蒙古，勘定中俄东段边界\n\n【演变趋势与逻辑】\n边疆治理从军事防御为主，走向军事、行政、民政并举的直接管辖。商周以征伐与封国守边，战国筑长城以界农牧。秦汉修长城、置郡县、设西域都护，屯田戍边成为定制。隋唐置都护府与羁縻府州，以夷制夷而号令远及中亚。唐后期边疆尽入藩镇与外族之手。宋疆域收缩，以寨堡与岁币守边。元设岭北、辽阳等行省与宣政院，把边疆纳入统一行政体系，土司制治理西南。明设九边与奴儿干都司，大修长城以守。清设伊犁将军、驻藏大臣，改土归流与盟旗制并用，中国疆域的基本格局由此底定。", "18": "【脉络梳理】\n→夏商西周（约前2070）：华夏与夷狄杂处，商伐羌方，西周与猃狁战事不断，融合以战争通婚\n→春秋战国（前770）：华夷之辨以文化分，秦楚吴越渐入华夏，赵武灵王胡服骑射融通胡汉\n→秦汉（前221）：秦北击匈奴南征百越，汉初和亲后武帝三击匈奴，南匈奴内附、羌乱频仍\n→三国两晋南北朝（220）：匈奴鲜卑羯氐羌内迁建政，永嘉之乱衣冠南渡，孝文帝改姓易服\n→隋与唐前期（581）：隋离间突厥、抚慰吐谷浑，唐灭东突厥与高昌，天可汗受诸族共奉\n→唐中后期与五代（755）：吐蕃回鹘南诏并起侵边，沙陀契丹渐强，五代多赖契丹沙陀兵力\n→两宋（960）：宋辽澶渊约为兄弟，宋夏庆历和议，金灭辽与北宋，南宋偏安而蒙元终灭之\n→元（1271）：蒙古色目汉人南人分为四等，西域色目人助治，回族渐成，各族迁徙杂居加速\n→明（1368）：北元长期对峙、修边墙以御蒙古，西南土司与苗瑶起事，满洲渐兴于建州\n→清（1644）：满蒙联姻结盟、编蒙古八旗，平定准噶尔与大小和卓，改土归流促边疆内地化\n\n【演变趋势与逻辑】\n民族关系以战争与和亲交替进行，最终走向多民族统一国家的形成。商周华夏与夷狄杂处，春秋战国以文化分华夷，秦楚吴越渐入华夏。秦汉与匈奴长期对抗，和亲与征伐交替，南匈奴内附。魏晋南北朝内迁各族建政，孝文帝改汉制，胡汉血统与文化深度融合，为隋唐盛世提供了新的血液。隋唐以天可汗统御诸族，突厥、回鹘、吐蕃、南诏并起。宋辽夏金长期对峙，元统一后分四等而各族杂居加速。明清先与蒙古对峙，后以联姻、盟旗、改土归流把边疆各族纳入同一政治共同体，中华民族多元一体的格局逐步成形。", "19": "【脉络梳理】\n→夏商西周（约前2070）：鸣条之战商汤灭夏，牧野之战武王克商，昭王南征不复、国人暴动\n→春秋战国（前770）：城濮邲鞍鄢陵争霸，桂陵马陵围魏救赵，长平之战坑赵卒四十万\n→秦汉（前221）：秦灭六国、蒙恬却匈奴七百余里，巨鹿之战项羽破秦军，漠北之战匈奴远遁\n→三国两晋南北朝（220）：官渡赤壁夷陵三大战役定三分，淝水之战以少胜多，北魏统一北方\n→隋与唐前期（581）：隋灭陈、三征高句丽，唐击东突厥与薛延陀，白江口败倭与百济联军\n→唐中后期与五代（755）：安史之乱八年始平，睢阳之守、平定淮西，黄巢入长安、朱温篡唐\n→两宋（960）：高粱河与澶州之战、好水川败于西夏，郾城颍昌捷而班师，崖山之战宋亡\n→元（1271）：蒙古西征南侵，襄樊之战六年乃克，崖山灭宋，元末红巾军起而朱元璋北伐\n→明（1368）：鄱阳湖之战败陈友谅，北伐克大都，土木之变英宗被俘，萨尔浒之败启辽事之坏\n→清（1644）：山海关一片石败李自成，平定三藩之乱，雅克萨之战后订尼布楚条约界中俄\n\n【演变趋势与逻辑】\n战争的规模与形态不断扩大，其后果则一次次改写王朝的命运。商周以车战与族兵为主，鸣条、牧野两战即决定王朝更替。春秋战国争霸与兼并战争频繁，长平之战坑卒四十万，战争目的已从争霸转为灭国。秦汉北击匈奴、南征百越，骑兵成为主力，漠北之战使匈奴远遁。魏晋南北朝淝水之战保全南方，隋唐以府兵开边，白江口败倭与百济联军。安史之乱是唐由盛转衰的转折，藩镇与五代使武力成为夺权的主要手段。宋军弱而将权分散，元以骑兵横扫欧亚，明清火器渐兴，萨尔浒与雅克萨之战已带有近代战争的色彩。", "20": "【脉络梳理】\n→夏商西周（约前2070）：商与远方方国通使，西周与肃慎淮夷往来，域外交流尚限于近邻\n→春秋战国（前770）：北方草原之路已通中亚，楚与南越交市，印度波斯物品零星入中原\n→秦汉（前221）：张骞凿空通西域，丝绸之路贯欧亚，甘英使大秦未至，佛教经中亚传入中国\n→三国两晋南北朝（220）：海路通林邑扶南，法显陆去海还，佛教译经大盛、中日通使经朝鲜\n→隋与唐前期（581）：隋遣使倭国与赤土，唐通拂菻大食，玄奘西行、鉴真东渡，遣唐使成规模\n→唐中后期与五代（755）：陆路受阻而海路兴起，广州设市舶使，黑石号沉船见证海上贸易繁盛\n→两宋（960）：市舶司设广州泉州明州，海上丝路极盛，瓷器与指南针外销，舶税入巨万\n→元（1271）：驿路通欧亚、马可波罗东来，泉州为世界大港，汪大渊航海、伊斯兰教东传\n→明（1368）：郑和七下西洋至红海东非，朝贡贸易盛而海禁并行，倭患频仍、葡人租居澳门\n→清（1644）：康熙开海设四关、后限广州一口，中俄恰克图互市，马戛尔尼来华而闭关如故\n\n【演变趋势与逻辑】\n对外交流由陆路为主转向海路为主，中国的开放程度也随之起伏。商周的对外联系仅限近邻方国，战国北方草原之路已通中亚。汉张骞凿空，丝绸之路贯通欧亚，佛教循此东来。魏晋南北朝海路初通，法显陆去海还。隋唐陆海并盛，玄奘西行、鉴真东渡、遣唐使成规模，广州设市舶使。宋因陆路受阻而海上丝路极盛，瓷器与指南针大量外销。元驿路横跨欧亚，泉州为世界大港。明郑和七下西洋把朝贡贸易推向顶点，随即海禁转严，倭患与葡人东来。清先开四关后限广州一口，马戛尔尼使团无功而返，中国错过了主动融入世界市场的机会。", "21": "【脉络梳理】\n→夏商西周（约前2070）：甲骨文金文记事、史官掌册命，左史记言右史记事，尚书为最早文献\n→春秋战国（前770）：孔子修春秋寓褒贬，左丘明作左传，国语战国策并出，编年国别体奠基\n→秦汉（前221）：司马迁史记创纪传体通史，班固汉书断代为书，两汉经史未分而史学渐独立\n→三国两晋南北朝（220）：陈寿三国志、范晔后汉书成，私家修史之风大盛，史学门类日繁\n→隋与唐前期（581）：唐设史馆修前代八史，刘知幾史通论史法，杜佑通典创典志体，官修制度化\n→唐中后期与五代（755）：史馆修实录国史，会要体兴起，五代修旧唐书，战乱致典籍散佚严重\n→两宋（960）：司马光资治通鉴续编年之绪，郑樵通志广会通，李焘续长编，金石学与方志学勃兴\n→元（1271）：修宋辽金三史各与正统，马端临文献通考集典志大成，胡三省注通鉴\n→明（1368）：官修元史仓促成书，王世贞弇州史料、谈迁国榷，李贽藏书别立史评，方志大量刊行\n→清（1644）：官修明史历九十年乃成，章学诚文史通义倡六经皆史，钱大昕考异、赵翼札记\n\n【演变趋势与逻辑】\n史学从史官记事，发展为纪传、编年、典志诸体齐备、官修私撰并行的完整体系。商周甲骨文金文与史官记言记事，尚书写下最早的文献。春秋战国孔子修春秋、左丘明作左传，编年与国别两体初具。汉司马迁创纪传体通史，班固断代为书，史学自经学中独立。魏晋南北朝私家修史之风大盛，三国志、后汉书成于此时。唐设史馆修前代八史，刘知幾史通论史法、杜佑通典创典志体，官修制度确立。宋资治通鉴续编年之绪，通志与会要并出，金石方志勃兴。元修宋辽金三史、文献通考集典志大成。明修元史仓促而私史稗乘繁富，清官修明史历九十年，章学诚文史通义与乾嘉考据把传统史学推向总结阶段。"}}</script>

const CN = ["一","二","三","四","五","六","七","八","九","十"];
const N = P.length;

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colByI = i => COLS.find(c => String(c.i)===String(i));

function fmt(text){
  const lines=(text||"").split("\n"); let html="",inList=false;
  const close=()=>{ if(inList){html+="</ul>";inList=false;} };
  for(const raw of lines){
    const line=raw.trim(); if(!line) continue;
    if(line.startsWith("【") && line.includes("】")){
      close(); html+='<h4 class="sec">'+esc(line.slice(1,line.indexOf("】")))+'</h4>';
      const rest=line.slice(line.indexOf("】")+1).trim(); if(rest) html+='<p class="para">'+esc(rest)+'</p>';
    } else if(line.startsWith("•")||line.startsWith("·")){
      if(!inList){ html+='<ul class="bullets">'; inList=true; }
      let t=line.replace(/^[•·]\s*/,"");
      const idx=Math.min(...["：",":"].map(c=>{const i=t.indexOf(c);return i<0?1e9:i;}));
      t = idx<1e9 ? "<b>"+esc(t.slice(0,idx))+"</b>："+esc(t.slice(idx+1)) : esc(t);
      html+="<li>"+t+"</li>";
    } else if(line.startsWith("→")){ close(); html+='<div class="flow">'+esc(line.replace(/^→\s*/,""))+'</div>'; }
    else { close(); html+='<p class="para">'+esc(line)+'</p>'; }
  }
  close(); return html;
}
function suppOf(pi,key){ const a=(SUPP[P[pi].name]||{})[String(key)]; return a||[]; }
function fmtSupp(list){
  if(!list.length) return "";
  const items=list.map(s=>{
    const i=s.indexOf("：");
    const t=i>=0 ? "<b>"+esc(s.slice(0,i))+"</b>："+esc(s.slice(i+1)) : esc(s);
    return "<li>"+t+"</li>";
  }).join("");
  return '<div class="supp"><div class="supp-h">补 充</div><ul>'+items+'</ul></div>';
}

const mask=document.getElementById("mask"), mt=document.getElementById("mtitle"),
      mk=document.getElementById("mkicker"), mb=document.getElementById("mbody");
function openModal(k,t,b){ mk.textContent=k; mt.textContent=t; mb.innerHTML=b; mask.classList.add("on"); mb.scrollTop=0; }
function closeModal(){ mask.classList.remove("on"); }
document.getElementById("mx").onclick=closeModal;
