<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国古代史 · 知识树 & 分朝精读</title>
<style>
:root{
  --bg:#f6f1e7; --panel:#fffdf8; --ink:#2b2a28; --muted:#8a847a; --line:#e2d9c8; --supp:#b8860b;
  --g-pol:#5b6ee1; --g-eco:#2f9e6b; --g-mil:#d9663d; --g-fro:#b0821f; --g-tho:#9b59b6; --g-cul:#2a9d8f;
  --shadow:0 10px 30px rgba(60,50,30,.12);
  --ncols:16;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:"Noto Serif SC","Songti SC",STSong,serif}
.wrap{max-width:1460px;margin:0 auto;padding:22px 26px 90px}
.muted{color:var(--muted)}

header.top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.title h1{margin:0;font-size:29px;letter-spacing:2px}
.title .sub{color:var(--muted);font-size:13px;margin-top:4px;letter-spacing:1px}
.spacer{flex:1}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;font-size:14px;width:176px;color:var(--ink)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{cursor:pointer;border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:13.5px;color:var(--muted);transition:.15s}
.seg button.on{background:var(--ink);color:#fff}
.seg.mini button{padding:5px 14px;font-size:12.5px}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 6px;font-size:12.5px;color:var(--muted)}
.legend .k{display:flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}

.tl-wrap{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.tl{display:grid;grid-template-columns:130px repeat(var(--ncols),minmax(0,1fr));align-items:center}
.tl .lead{font-size:12px;color:var(--muted);letter-spacing:1px}
.chip{justify-self:center;cursor:pointer;text-align:center;background:var(--bg);border:2px solid var(--ink);border-radius:999px;padding:6px 8px;min-width:70px;transition:.15s}
.chip .cn{font-size:12.5px;font-weight:700;white-space:nowrap}
.chip .yr{font-size:10px;color:var(--muted);white-space:nowrap}
.chip:hover{transform:translateY(-2px);background:#fff}
.chip.new{border-style:dashed;border-color:var(--supp)}

.map{margin-top:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 10px 18px;overflow:hidden}
.row{display:grid;grid-template-columns:190px repeat(var(--ncols),minmax(0,1fr));align-items:center}
.row.head{padding:8px 0 12px;border-bottom:1px dashed var(--line);margin-bottom:6px}
.row.head .tcell{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
.row.head .tcell b{display:block;font-size:12px;color:var(--ink)}
.grp{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding:7px 12px;border-radius:10px;font-weight:700;letter-spacing:2px;font-size:14px}
.grp .bar{width:6px;height:18px;border-radius:3px}
.grp .gi{font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:.5px}
.g-pol{background:rgba(91,110,225,.10);color:var(--g-pol)} .g-pol .bar{background:var(--g-pol)}
.g-eco{background:rgba(47,158,107,.10);color:var(--g-eco)} .g-eco .bar{background:var(--g-eco)}
.g-mil{background:rgba(217,102,61,.10);color:var(--g-mil)} .g-mil .bar{background:var(--g-mil)}
.g-fro{background:rgba(176,130,31,.12);color:var(--g-fro)} .g-fro .bar{background:var(--g-fro)}
.g-tho{background:rgba(155,89,182,.10);color:var(--g-tho)} .g-tho .bar{background:var(--g-tho)}
.g-cul{background:rgba(42,157,143,.10);color:var(--g-cul)} .g-cul .bar{background:var(--g-cul)}
.trow{position:relative;padding:5px 0;border-radius:8px}
.trow .tlabel{font-size:13.5px;padding:6px 10px 6px 14px;color:var(--ink);font-weight:600;position:relative;z-index:2;border-radius:8px;line-height:1.25;cursor:pointer}
.trow .tlabel small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.trow .tlabel:hover{background:var(--bg)}
.trow::before{content:"";position:absolute;left:190px;right:6px;top:50%;height:2px;background:var(--line);opacity:.7;z-index:0}
.ncell{display:flex;justify-content:center;align-items:center;position:relative;z-index:2;height:30px}
.node{width:15px;height:15px;border-radius:50%;border:2px solid #fff;cursor:pointer;transition:.16s;box-shadow:0 0 0 1px rgba(0,0,0,.10)}
.node.pol{background:var(--g-pol)} .node.eco{background:var(--g-eco)} .node.mil{background:var(--g-mil)}
.node.fro{background:var(--g-fro)} .node.tho{background:var(--g-tho)} .node.cul{background:var(--g-cul)}
.node:hover{transform:scale(1.55);box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.node.hl{box-shadow:0 0 0 5px rgba(43,42,40,.20)}
.node.sel{transform:scale(1.6);box-shadow:0 0 0 5px rgba(43,42,40,.24)}
.trow.hit .tlabel{background:#fff3c4}

#readView{display:none}
#readView.on{display:block}
#treeView.off{display:none}
.reader{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.toc{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 12px;max-height:calc(100vh - 30px);overflow:auto}
.toc-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;letter-spacing:1px;color:var(--muted);margin:2px 4px 10px}
.toc-h .prog{font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.toc .item{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:center;padding:8px;border-radius:9px;cursor:pointer;transition:.13s}
.toc .item:hover{background:var(--bg)}
.toc .item.active{background:var(--ink);color:#fff}
.toc .item.active em{color:#cfc9bd}
.toc .item .ck{width:17px;height:17px;border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:#fff}
.toc .item.read .ck{background:#2f9e6b;border-color:#2f9e6b}
.toc .item b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.toc .item em{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-top:2px}
.toc .item .newtag{font-size:9.5px;background:var(--supp);color:#fff;border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:middle}
.toc .allbtn{margin-top:10px;text-align:center;font-size:11.5px;color:var(--muted);cursor:pointer;border-top:1px dashed var(--line);padding-top:9px}
.toc .allbtn:hover{color:var(--ink)}

.main{min-width:0}
.readbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.readbar .rbi{font-size:12px;color:var(--muted)}
.quizhint{display:none;margin:0 0 12px;padding:10px 14px;border:1px dashed var(--supp);border-radius:10px;background:#fffdf3;color:#8a6d3b;font-size:12.5px}
.main.quiz .quizhint{display:block}
.quizhint span{cursor:pointer;text-decoration:underline}
.art{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 46px 40px;max-width:940px}
.art-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px;position:relative}
.art-head .kicker{font-size:12.5px;letter-spacing:3px;color:var(--muted)}
.art-title{margin:6px 0 4px;font-size:34px;letter-spacing:3px}
.art-span{font-size:13.5px;color:var(--muted)}
.art-note{margin-top:8px;font-size:12.5px;color:#8a6d3b;background:#fffdf3;border:1px dashed #e2cfa0;border-radius:8px;padding:6px 10px;display:inline-block}
.ribbon{position:absolute;right:0;top:0;background:var(--supp);color:#fff;font-size:11px;letter-spacing:2px;border-radius:6px;padding:3px 10px}
.lead-in{background:var(--bg);border:1px solid var(--line);border-left:4px solid #d9b66a;border-radius:10px;padding:16px 18px;font-size:15px;line-height:2.05;margin-bottom:8px}
.blk{margin-top:22px}
.blk-h{font-size:16px;letter-spacing:1px;margin:0 0 10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.bigsec{margin-top:34px;border-radius:14px;padding:2px 22px 20px;border:1px solid var(--line)}
.bigsec-h{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:3px;margin:18px 0 6px}
.bigsec-h .num{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-family:var(--serif)}
.bigsec.g-pol .num{background:var(--g-pol)} .bigsec.g-eco .num{background:var(--g-eco)} .bigsec.g-mil .num{background:var(--g-mil)}
.bigsec.g-fro .num{background:var(--g-fro)} .bigsec.g-tho .num{background:var(--g-tho)} .bigsec.g-cul .num{background:var(--g-cul)}
.bigsec.g-pol{background:rgba(91,110,225,.035)} .bigsec.g-eco{background:rgba(47,158,107,.04)}
.bigsec.g-mil{background:rgba(217,102,61,.04)} .bigsec.g-fro{background:rgba(176,130,31,.05)}
.bigsec.g-tho{background:rgba(155,89,182,.04)} .bigsec.g-cul{background:rgba(42,157,143,.04)}
.topic{margin:18px 0 4px}
.topic.empty .topic-h{color:#c6c0b3;cursor:default;pointer-events:none}
.topic.empty .para{color:#cfc9bc;margin:2px 0 0;font-size:13px}
.topic-h{font-size:15px;margin:0 0 2px;letter-spacing:.5px;color:#4a443a;cursor:pointer;display:inline-block;border-bottom:1px dashed transparent}
.topic-h:hover{border-bottom-color:#c8b27a;color:#5b4a22}
.topic-h small{font-weight:400;font-size:11px;color:var(--muted);margin-left:8px}
.readnav{display:flex;align-items:center;gap:12px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.readnav .spacer{flex:1}
.pill{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 18px;font-size:13.5px}
.pill:hover{background:#fff}
.pill.done{background:#2f9e6b;color:#fff;border-color:#2f9e6b}

/* supplements */
.supp{margin:12px 0 4px;border:1px dashed var(--supp);border-radius:10px;background:#fffdf3;padding:10px 14px 12px}
.supp-h{font-size:11px;letter-spacing:2px;color:var(--supp);margin-bottom:6px}
.supp li{font-size:14px;line-height:1.85;padding:5px 0 5px 16px;position:relative;list-style:none;border-bottom:1px dotted #efe3c6}
.supp ul{padding:0;margin:0}
.supp li:last-child{border-bottom:0}
.supp li::before{content:"补";position:absolute;left:0;top:7px;font-size:9px;color:#fff;background:var(--supp);border-radius:3px;padding:0 3px;line-height:14px}
.supp b{color:#8a6d3b}

/* quiz mode */
.main.quiz .art .q-wrap{filter:blur(7px);cursor:pointer;user-select:none;position:relative;transition:filter .18s}
.main.quiz .art .q-wrap::after{content:"点击核对 · 先自己回忆";position:absolute;right:10px;top:8px;font-size:11px;color:#b9a880}
.main.quiz .art .q-wrap.revealed{filter:none;cursor:auto;user-select:auto}
.main.quiz .art .q-wrap.revealed::after{display:none}

.mask{position:fixed;inset:0;background:rgba(40,35,25,.42);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.mask.on{display:flex}
.modal{background:var(--panel);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.35);max-width:980px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:20px 24px 14px;border-bottom:1px solid var(--line);position:relative}
.mhead .kicker{font-size:12px;letter-spacing:2px;color:var(--muted)}
.mhead h2{margin:4px 0 0;font-size:23px}
.mhead .x{position:absolute;right:18px;top:16px;cursor:pointer;border:1px solid var(--line);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);background:var(--bg)}
.mhead .x:hover{color:var(--ink)}
.mbody{padding:8px 26px 30px;overflow:auto}
.sec{color:#8a6d3b;font-size:13px;letter-spacing:1px;margin:20px 0 8px;border-left:3px solid #d9b66a;padding-left:8px}
ul.bullets{list-style:none;padding:0;margin:8px 0}
ul.bullets li{position:relative;padding:8px 0 8px 18px;line-height:1.85;font-size:14.5px;border-bottom:1px dashed var(--line)}
ul.bullets li:last-child{border-bottom:0}
ul.bullets li::before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:#c8b27a}
ul.bullets b{color:#5b4a22}
.flow{font-size:13.5px;line-height:1.9;padding:5px 0 5px 22px;border-left:1px dotted var(--line);margin-left:4px}
.para{font-size:14.5px;line-height:1.95;margin:10px 0}
.jump{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.jump .j{cursor:pointer;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--bg)}
.jump .j:hover{background:#fff}
.tl-item{border-left:3px solid var(--line);padding:2px 0 2px 16px;margin:14px 0}
.tl-item .when{font-weight:700;font-size:14px}
.tl-item .when .span{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.gapcard{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:10px 0;background:var(--bg)}
.gapcard h4{margin:0 0 6px;font-size:15px}
.lv{font-size:10.5px;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;color:#fff}
.lv.h{background:#c0392b}.lv.m{background:#d68910}.lv.l{background:#7f8c8d}
.gapcard p{margin:4px 0 0;font-size:13.5px;line-height:1.8;color:#4a463f}
.note{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:14px}
.crow{display:flex;align-items:center;gap:10px;margin:9px 0}
.crow label{width:96px;font-size:13px;color:var(--muted);text-align:right;flex:none}
.crow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--bg);outline:0}
.crow input:focus{border-color:#2f9e6b;background:#fff}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cloudbox{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--bg);font-size:13px;line-height:1.8;margin:8px 0}
.editbar{display:none;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border:1px dashed #2f9e6b;border-radius:10px;background:#f2fbf6;color:#2c7a55;font-size:12.5px;flex-wrap:wrap}
.main.edit .editbar{display:flex}
.main.edit .art{outline:2px dashed #2f9e6b;outline-offset:3px}
.art-body[contenteditable="true"]{background:#fffefa}
@media (max-width:1080px){
  .reader{grid-template-columns:1fr}
  .toc{position:static;max-height:none}
  .art{padding:22px 18px 28px}
  .art-title{font-size:26px}
  .tl,.row{grid-template-columns:110px repeat(var(--ncols),minmax(0,1fr))}
  .trow::before{left:110px}
  .node{width:11px;height:11px}
  .trow .tlabel{font-size:10.5px;padding-left:5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>中国古代史</h1>
      <div class="sub">知识树 · 分朝精读 · 自测 ｜ 第一遍用「分朝精读」，回想用「知识树」，检测用「自测」</div>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <div class="seg" id="seg">
        <button data-v="tree" class="on">知识树</button>
        <button data-v="read">分朝精读</button>
      </div>
      <div class="search" id="searchBox">🔍<input id="q" placeholder="搜索考点，如 科举 / 均田 / 行省"></div>
      <button class="btn" id="resetBtn">重置</button>
      <button class="btn" id="cloudBtn">☁ 云同步</button>
      <button class="btn primary" id="gapsBtn">⚠ 补漏清单</button>
    </div>
  </header>

  <div id="treeView">
    <div class="legend">
      <span class="k"><i class="dot" style="background:var(--g-pol)"></i>政治制度</span>
      <span class="k"><i class="dot" style="background:var(--g-eco)"></i>社会经济</span>
      <span class="k"><i class="dot" style="background:var(--g-mil)"></i>军事</span>
      <span class="k"><i class="dot" style="background:var(--g-fro)"></i>边疆·民族</span>
      <span class="k"><i class="dot" style="background:var(--g-tho)"></i>社会·思想</span>
      <span class="k"><i class="dot" style="background:var(--g-cul)"></i>文化·交流</span>
      <span class="k" style="margin-left:auto">共 <b id="nCount">0</b> 个知识节点 ｜ 虚线节点为补充内容</span>
    </div>
    <div class="tl-wrap"><div class="tl" id="tl"></div></div>
    <div class="map" id="map"></div>
  </div>

  <div id="readView">
    <div class="reader">
      <aside class="toc" id="toc"></aside>
      <div class="main" id="main">
        <div class="readbar">
          <span class="rbi" id="rbPos"></span>
          <div class="seg mini" id="modeSeg">
            <button data-m="read" class="on">精读</button>
            <button data-m="quiz">自测</button>
          </div>
          <span class="spacer"></span>
          <span class="rbi" id="rbProg"></span>
          <button class="btn" id="editBtn">✎ 编辑</button>
        </div>
        <div class="editbar" id="editBar">
          <span id="editHint">编辑模式：正文可直接点击修改，改完点“保存本页”</span>
          <b id="saveState" style="color:#c0392b"></b>
          <span class="spacer"></span>
          <span class="pill" id="saveBtn">保存本页</span>
          <span class="pill" id="revertBtn">还原本页</span>
          <span class="pill" id="exportBtn">导出修改版</span>
        </div>
        <div class="quizhint" id="quizhint">🧠 自测模式：先自己回忆，再点击灰色区域核对答案 ｜
          <span id="expandAll">全部展开</span> · <span id="collapseAll">全部收起</span></div>
        <article class="art" id="art"></article>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="mhead">
      <div class="kicker" id="mkicker"></div>
      <h2 id="mtitle"></h2>
      <div class="x" id="mx">×</div>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>

<div class="mask" id="cmask">
  <div class="modal" style="max-width:600px">
    <div class="mhead">
      <div class="kicker">云端同步</div>
      <h2>GitHub 同步设置</h2>
      <div class="x" id="cx">×</div>
    </div>
    <div class="mbody">
      <div class="cloudbox">
        填一次即可，设置会存在你这台电脑的浏览器里。<b>Token 只保存在本地浏览器，绝不会写进网页</b>。
      </div>
      <div class="crow"><label>用户名</label><input id="cOwner" placeholder="你的 GitHub 用户名"></div>
      <div class="crow"><label>仓库名</label><input id="cRepo" placeholder="gudai-history-tree"></div>
      <div class="crow"><label>分支</label><input id="cBranch" placeholder="main"></div>
      <div class="crow"><label>文件名</label><input id="cPath" placeholder="edits.json"></div>
      <div class="crow"><label>Token</label><input id="cToken" type="password" placeholder="github_pat_..."></div>
      <div class="cbtns">

<script id="editstore" type="application/json">{"秦汉": "<div class=\"art-head\"><div class=\"kicker\">统一帝国的确立与巩固<\/div><h2 class=\"art-title\">秦汉<\/h2><div class=\"art-span\">前221—220年 ｜ （秦：前221—前207年 / 西汉：前202—8年 / 东汉：25—220年）<\/div><\/div><div class=\"q-wrap lead-in\"><p class=\"para\">秦汉奠定中国两千年帝制格局。秦废分封行郡县，书同文车同轨，确立中央集权帝制；汉承秦制而损益，郡国并行终归于一统，武帝外攘四夷内强集权，儒术定于一尊。经济上重农抑商与官营并行，丝路开通连通世界贸易；社会豪强渐起，编户齐民为本。此期制度框架、文化主轴与民族格局基本定型，汉族之名、儒家之统、郡县之制皆自此确立，影响直至近世。<\/p><\/div><div class=\"blk\"><h3 class=\"blk-h\">重要历史时期及事件<\/h3><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>秦灭六国与帝制确立<\/b>：前230至前221年秦相继攻灭韩赵魏楚燕齐，结束数百年割据，嬴政称始皇帝，创皇帝制度，立三公九卿，废分封行郡县，统一文字度量衡与车轨。大一统中央集权帝制由此奠定，此后王朝皆以统一为正统。<\/li><li><b>秦末民变与楚汉相争<\/b>：秦法苛急、徭戍无度，陈胜吴广于大泽乡揭竿首倡，郡县蜂起；继而刘项相争，垓下一役项羽兵败自刎，刘邦称帝建汉。布衣将相之局首次出现，血缘贵族政治就此终结，开汉代布衣卿相政权之先例。<\/li><li><b>文景之治与汉武集权<\/b>：汉初承残破之局，文景轻徭薄赋、除肉刑、与民休息，府库渐盈；武帝即位后行推恩令削藩，置盐铁官营，北击匈奴，又独尊儒术。中央集权体制至此完备，外儒内法治国模式成型，影响后世历代王朝。<\/li><li><b>新莽代汉与光武中兴<\/b>：外戚王莽篡汉建新朝，托古改制行王田私属之禁，纷乱反致天下大乱，绿林赤眉继起；刘秀重建汉室，史称光武中兴，偃武修文而与民休息。改制失败证明复古不可行，东汉豪强坐大埋下分裂之隐患。<\/li><li><b>东汉衰朽与黄巾之乱<\/b>：东汉中后期外戚宦官交替专权，党锢之祸摧折士人，卖官鬻爵败坏吏治；张角以太平道发动黄巾起义，朝廷倚重州牧镇压，割据之势遂成。中央集权名存实亡，州牧豪强拥兵自重，三国分立由此开启。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>轮台诏<\/b>：汉武帝晚年下轮台诏，深陈远征之悔，转向“禁苛暴、止擅赋、力本农”，为昭宣中兴之先声<\/li><li><b>王莽改制<\/b>：托古改制，行王田、五均六筦、改易官名币制，触犯豪强与民众，终致天下大乱<\/li><li><b>昆阳之战<\/b>：23年刘秀以少胜多，大破王莽军，成为新莽覆亡的关键一战<\/li><li><b>昭宣中兴<\/b>：昭帝、宣帝时霍光辅政，轻徭薄赋、整顿吏治，西汉国力得以恢复<\/li><li><b>巫蛊之祸<\/b>：前91年汉武帝晚年因巫蛊事起，太子刘据被诬起兵败亡，政局动荡<\/li><\/ul><\/div><\/div><\/div><section class=\"bigsec g-pol\"><h3 class=\"bigsec-h\"><span class=\"num\">一<\/span>政治制度<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"3\">中央官制 <small>政治与制度<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>三公九卿之制<\/b>：秦置丞相总领百官、太尉掌武事、御史大夫掌图籍监察，合称三公，九卿分掌宗庙财政诸务，皆直辖于皇帝。完整的中央官僚体系首次建立，为后世两千年中央官制奠定基本框架。<\/li><li><b>内朝决策之立<\/b>：武帝任用尚书、侍中等近臣组成中朝参决机要，以丞相为首的外朝渐沦为执行机构，相权被明显架空。君主借身边近臣侵削相权，开后世君主分割相权之常法，皇权与相权之张力由此贯穿整个帝制时代。&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<b>汉成帝绥和改制：<\/b>太尉改成大司马，从掌管军事转为可参与外朝行政事务，御史大夫改称大司空。改制后三公共掌丞相大权。&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/li><li><b>尚书台之崛起<\/b>：东汉光武帝以尚书台总揽章奏政务，三公（太尉，司徒，司空）徒拥虚名，实务尽归台阁，尚书令权重一时。中枢权力自三公移向皇帝近侍机构，成为魏晋尚书省与隋唐三省六部制演进之关键环节，中枢近臣化由此发端。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>六曹<\/b>：东汉尚书台分设六曹（三公曹、吏曹、二千石曹等）分掌庶务，尚书台权力渐重<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"4\">中央与地方行政制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>郡县制之确立<\/b>：秦废分封，初分天下为三十六郡，郡守县令由皇帝直接任免、不得世袭，政令自朝廷直达闾里。中央直辖地方的行政体系由此确立，取代封建世袭自治，成为此后两千年地方建制的总体框架。<\/li><li><b>郡国并行与推恩令<\/b>：汉初封异姓诸侯旋加翦除，继封同姓王以屏藩皇室，终酿七国之乱；武帝采主父偃之议行推恩令，令诸侯分封子弟为侯，王国析小而名存实亡。分封残余就此清除，诸侯唯食租税不治民。颁布左官律（王国官员为左官，地位低于中央官员，并不得进入中央任职）、附益法（禁止士人与诸侯王交游。禁止朝臣外附）、酬金夺爵，中央集权终获巩固。<\/li><li><b>州部监察与三级之变<\/b>：武帝分全国为十三州部置刺史，本为监察之区；东汉末改刺史为州牧，州遂由监察区演变为郡以上行政区，地方成州郡县三级。行政层级增多而效率下降，州牧拥兵坐大，成为汉末割据之制度根源。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"5\">选官制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>军功爵制<\/b>：秦按斩首军功授予爵位田宅，废世卿世禄之制，斩一首者赐爵一级，平民可凭战功入仕拜爵，吏道出于刀笔弓马。社会流动因军功而大开，耕战体制由此确立，秦之骤强骤亡皆与此制相关。<\/li><li><b>察举与征辟之制<\/b>：汉令郡国岁举孝廉茂才，皇帝特诏征召名士，公府州郡辟除掾属；武帝立太学，博士弟子课试补官，儒生入仕之途大开。选官以德行学识为标准，儒学与利禄相结合，文官政治之基础由此奠定。<\/li><li><b>任子与赀选之途<\/b>：二千石官任职满三年可保举子弟一人为郎，称任子；家赀达到数额者可纳赀为郎，称赀选。二者与察举并行，官僚子弟与富室由此得径直入仕，寒门进身之途相对狭窄，为东汉豪族累世为官埋下伏笔。<\/li><li><b>豪族把持察举<\/b>：东汉察举重门第声望，举主与被举者互结恩私，士人向经学大族和官员投生门生故吏，形成利益集团。累世公卿格局形成，汝南袁氏四世三公；寒俊进身无门，品评人物之风盛行。选官标准由才德转向门第，士族政治初见雏形，成为魏晋门阀政治之先声。<\/li><li><font color=\"#5b4a22\"><b>清议与党锢之祸：<\/b><\/font>察举制重名声，东汉中后期选举腐败；外戚宦官掌权，卖官鬻爵，垄断官位。 隐逸士人增多，靠拒绝征召获得声望；朝廷丧失掌控士人舆论的能力，独立士人群体形成。<\/li><li><strong>清议<\/strong>：太学生、在野士人品评人物，批评时政；代表：汝南许邵兄弟<strong>月旦评<\/strong>（每月初一品评士人），用舆论干预政局。<\/li><li>&nbsp;第一次党锢之祸（延熹九年，166 年，汉桓帝） 导火索：李膺诛杀张成之子，宦官诬告李膺联合太学生结党、诽谤朝政，定为 “党人”。过程：逮捕李膺、陈寔等二百余人；狱中党人牵连宦官子弟得以出狱；次年党人遣返家乡，禁锢终身（不许做官）。<\/li><li>&nbsp;第二次党锢之祸（建宁二年，169 年，汉灵帝）前奏：桓帝死后灵帝即位，外戚窦武、士大夫陈蕃执政，起用党人，计划铲除宦官；事机泄露，宦官曹节、王甫发动政变，窦武、陈蕃被杀。过程：宦官再次打击党人；党人的门生、故吏、父子兄弟及五服亲属，全部免官禁锢。解除：黄巾起义爆发后，东汉朝廷赦免党人。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"6\">监察制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>御史监郡之制<\/b>：秦以御史大夫为副相纠察百官，各郡遣监御史驻守监察，中央与地方双层监察网络初步铺开。独立的监察系统由此确立，为汉代司直、司隶校尉与刺史制度之源头，后世御史台制度亦导源于此。<\/li><li><b>刺史六条问事<\/b>：武帝分全国为十三州部，每部置刺史一人，依六条问事，专察郡国守相与强宗豪右，秩仅六百石而能监二千石。中央直辖地区设司隶校尉，负责督察三辅、三河、弘农郡。以卑临尊使监察有效制衡地方，成为后世监察制度之重要借鉴，以小监大之术由此确立。<\/li><li><b>刺史权重之变<\/b>：东汉刺史权限渐宽，渐及行政民政，灵帝时改称州牧，总揽一州军政大权，刘表袁绍之流各据一方。监察区转化为行政区，地方失控之势由此形成，成为汉末分裂割据的重要制度根源。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>三独坐<\/b>：东汉以御史中丞、司隶校尉、尚书令为“三独坐”，朝会专席，为监察与中枢要职<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"7\">法律制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>秦律之严苛<\/b>：秦法本于商鞅，繁密严酷，什伍连坐，轻罪重罚，徒刑名目繁多，刑徒遍布工程边戍，时人称赭衣塞路、囹圄成市。民畏法而国力强，然积怨更深，陈胜振臂一呼而天下响应，严刑峻法成为秦亡之重要原因。<\/li><li><b>约法三章与九章律<\/b>：刘邦入关与父老约法三章，尽除秦苛法以收人心；萧何摭拾秦法制定九章律，增户律兴律厩律诸篇，汉律章程由此奠定。承秦制而删其苛，宽严相济，成为后世历代律典修撰之蓝本。<\/li><li><b>春秋决狱<\/b>：董仲舒倡导以春秋经义断狱，原心定罪，动机善恶重于行为后果，儒生遂得操持刑名之权。儒家伦理渗入司法审判，引礼入法由此发端，开启礼法融合之漫长进程，成为中华法系之思想源头。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>上请与亲亲得相首匿<\/b>：汉代法律儒家化的两大原则——贵族官吏可“上请”减刑，亲属之间可隐匿罪责、不予连坐<\/li><li><b>《二年律令》与张家山汉简<\/b>：湖北江陵张家山出土的汉初法律竹简，含《二年律令》，是研究汉律的重要实物<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-eco\"><h3 class=\"bigsec-h\"><span class=\"num\">二<\/span>社会经济<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"8\">户籍与基层治理 <small>户籍与赋税<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>自实田宅与什伍连坐<\/b>：秦令民自报田宅户口，隐匿者受罚，又行什伍编制、连坐相纠，户籍遂为赋役征发与兵源调拨之根据。国家首次系统掌握全国人口与土地数字，编户制度由此确立，成为历代户籍管理之常制。<\/li><li><b>编户齐民之制<\/b>：西汉民皆著籍，籍载人口田宅年龄，官府据以征收租赋、征发徭役兵役，乡里组织负责查验督课。平民摆脱贵族私属身份而直隶于国家，成为帝国赋役兵源之基本承担者，个体小农经济支撑帝国财政。<\/li><li><b>乡亭三老之制<\/b>：秦汉县下置乡，乡设三老掌教化、啬夫掌听讼收税、游徼掌巡逻禁盗，十里一亭、十亭一乡，刘邦即起家亭长。乡官体系将国家权力延伸至村落，教化行政治安合一，成为后世乡里制度之雏形。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>案比<\/b>：汉代每年核查户口、年纪与体貌的制度，为编户齐民与赋役征发之基础<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"9\">赋役制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>秦赋役之酷<\/b>：秦田租口赋之外，成年男子须服正卒戍卒更卒诸役，修长城、戍五岭、营建骊山陵，征发无度而民不堪命。赋役重压成为秦末民变之直接导火索，为汉初轻徭薄赋政策提供反面教训，暴政虐民终致覆亡。<\/li><li><b>轻徭薄赋与算赋口赋<\/b>：汉初行十五税一，文帝降为三十税一，算赋口赋按人头征收，正卒戍卒更卒之役轮番而相对轻简。民力得以休养生息，文景之治的物质基础由此奠定，编户齐民安居乐业而垦田日广。<\/li><li><b>盐铁官营与均输平准<\/b>：武帝因对匈奴用兵财用匮乏，行盐铁官营与酒榷，设均输平准调剂运输物价，以桑弘羊主其事。（郡国设均输官，负责管理调度征发租赋财物，向京师和各地运输，调整全国规模的运输速度。平准即平稳物价，京师设置平准官管理均输官运到京师的物资财货，除皇帝贵戚所用其余由国家经营，贵则卖之，贱则买之，防止富商大贾操纵物价）国家垄断山林川泽之利，府库充盈而商贾受抑，官营专卖制度由此开创，国与民争利之争端长期延续。<\/li><li><b>算缗告缗之令<\/b>：武帝令商人自报资产纳缗钱，车船奴婢皆计税，又颁告缗令鼓励举告隐匿，违令者财产没官、告发者分其半。中产以上商贾大抵破产，国库充盈，然民间蓄积受挫，流通顿衰，国家与民争利之局由此大开。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>更赋<\/b>：汉代以钱代役的赋目，代役之钱称更赋，是汉代赋役的重要组成<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"13\">土地制度 <small>经济与生产<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>名田制之立<\/b>：秦按军功爵级授予田宅，明定尊卑爵秩等级，土地私有制获得法律承认，民间得买卖田地。授田与私有并行，小农经济与地主经济同时成长，土地兼并之门亦由此开启，为两汉田制问题种下远因。<\/li><li><b>限田之议与兼并<\/b>：西汉土地买卖频繁，富室豪强竞相兼并，富者田连阡陌而贫者无立锥之地；哀帝时师丹孔光拟限田限奴婢，以贵戚反对而搁置。国家干预屡告失败，兼并之势不可遏止，成为两汉社会危机之总根源。<\/li><li><b>王莽王田之制<\/b>：王莽托古改制，宣布天下田曰王田、奴婢曰私属，皆不得买卖，一家男丁不满八口而田逾一井者分余田予宗族邻里。改制触怒豪强、扰害小民，三年而罢，复古理想彻底破产，土地私有不可逆转之势由此印证。<\/li><li><b>代田法之推行<\/b>：武帝末赵过为搜粟都尉，推行代田法，一亩三甽，播种于甽而苗生后以垄土培根，岁代处而地力可复。关中公田与边郡屯田先行试验，所收常过缦田一斛以上，亩产提高，精耕细作技术体系由此充实。<\/li><li><b>区种法之创<\/b>：成帝时氾胜之督三辅种麦，著氾胜之书，载区田之法：划地为区、深掘加肥、等距密植，集中用水用肥，瘠田山地亦可获丰收。集约经营之术由此确立，与小农精耕传统相合，后世代田区田并称，农学经验赖此传世。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>田庄<\/b>：东汉豪强广占土地，形成自给自足的田庄经济，部曲、宾客、奴婢依附其间<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"14\">商业<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>重农抑商之政<\/b>：秦徙天下豪富十二万户于咸阳，商人另立市籍，不得衣丝乘车，徭役谪戍先发贾人，抑商作为国策确立。商人社会地位受制度贬抑，农商之别森严，商业资本被迫转向土地，重本抑末之政由此定型。<\/li><li><b>弛山泽之禁与五都<\/b>：汉初惠帝高后时弛禁，开关梁、弛山泽之禁，富商大贾周流天下；设洛阳邯郸临淄宛成都五都，为区域商业中心。商品经济随之活跃，城市商业网络形成，为丝绸之路贸易奠定国内市场基础。<\/li><li><b>盐铁官营与商贾受抑<\/b>：武帝盐铁酒榷与均输平准垄断大宗利源，商人资本受排挤，私营空间收窄；告缗后商贾中家以上破产。官营压制私营之格局形成，民间商业活力受抑，官商消长成为两千年经济政策之长期议题。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"15\">手工业<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>冶铁与炒钢之技<\/b>：西汉冶铁官营，铁犁牛耕推广至边郡，炒钢与百炼钢技术相继出现，铁农具与铁兵器全面普及，冶铁规模宏大。冶铁技术领先世界，农战之利皆赖铁器，为帝国强盛奠定物质基础。<\/li><li><b>丝织业之盛<\/b>：临淄与襄邑设服官，长安织室规模宏大，素纱禅衣轻薄如云，锦缎纹样精美，丝帛行销西域中亚。丝织为国家财源与外销大宗，纺织技艺冠绝东亚，丝绸之国之名由此传扬，外销成为外贸大宗。<\/li><li><b>蔡伦改进造纸<\/b>：东汉和帝元兴元年，尚方令蔡伦总结前人经验，以树皮麻头敝布鱼网捣浆抄纸，纸质轻薄廉价，进呈后天下通行，谓之蔡侯纸。书写材料由简帛转向纸张，知识传播成本大降，文教普及与世界文明进程皆受其惠。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"16\">货币<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>半两钱之统一<\/b>：秦废六国异形币，行圆形方孔半两钱，货币形制、重量、文字归于统一，钱重如其文。币制统一与政治统一同步完成，外圆内方形制沿用两千余年，成为中华货币之标准形制。<\/li><li><b>皮币白金之造<\/b>：武帝元狩年间以白鹿皮方尺缘饰为皮币，值四十万钱，强令王侯宗室朝觐必以皮币荐璧；又铸银锡为白金三品，皆虚值大钱。意在敛富商之财而民不乐用，盗铸蜂起，币制紊乱，由此反证五铢钱制之良善。<\/li><li><b>五铢钱之定制<\/b>：武帝元狩五年始铸五铢钱，重如其文、轻重适宜，又置水衡都尉属官上林三官专铸，郡国铸币之权收归中央。五铢钱制作精整、信用稳固，行用七百余年直至隋代，成为中国古代最成功之钱币。<\/li><\/ul><\/div><\/div><\/section><section class=\"bigsec g-mil\"><h3 class=\"bigsec-h\"><span class=\"num\">三<\/span>军事<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"10\">兵制<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>征兵更戍之制<\/b>：秦汉男子傅籍之后，须服正卒一年、戍卒屯戍边地，另有更卒每年一月役于本郡县，兵农合一、轮番更代。耕战结合使兵源广大而军费低廉，然戍边转输劳苦民力，闾左戍卒之怨由此积成大变之因。<\/li><li><b>南北军之制<\/b>：汉代京师驻军分南军北军，南军由卫尉统之宿卫宫城，北军由中尉统之拱卫京师，武帝又增期门军羽林军，选六郡良家子充任。禁卫兵力分统而互相牵制，兵柄集中于皇帝，京师环卫之制由此确立。<\/li><li><b>募兵之渐<\/b>：武帝置八校尉，募知兵之人充任，又有屯兵戍卒久驻边地，渐罢征发而募兵代兴，兵与农分离。职业化军队战力增强而供养费用日重，东汉以降募兵屯兵并行，兵制演变由此开启新的方向。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"19\">战争与军事冲突<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>秦并六国之役<\/b>：秦用王翦王贲诸将，远交近攻、各个击破，十年之间韩赵魏楚燕齐相继覆灭，海内归于统一，六国贵族政治就此闭幕。皇帝制度与郡县体制随之确立，战国割据之局终结，统一成为此后政治之正统目标。<\/li><li><b>楚汉战争<\/b>：项羽分封十八诸侯引发纷争，刘邦还定三秦，经彭城之败、荥成相持，垓下一役四面楚歌，项羽自刎乌江，刘邦即皇帝位。五年相争以汉胜楚亡告终，布衣天子由此产生，分封与郡县并存之汉初格局开启。<\/li><li><b style=\"color: rgb(138, 109, 59); font-size: 14px; background-color: rgb(255, 253, 243);\">河南之战与河西之战<\/b><span style=\"font-size: 14px; background-color: rgb(255, 253, 243);\">：卫青取河套（河南之战）、霍去病取河西走廊，为漠北决战与丝路开通奠基<\/span><\/li><li><b>汉匈漠北之战<\/b>：前119年武帝令卫青霍去病各将五万骑深入漠北，霍去病封狼居胥山，匈奴远遁而漠南无王庭。汉初以来匈奴之患基本解除，然海内虚耗、户口减半，扩张之役亦由此埋下财政危机之伏笔。<\/li><li><b>汉武帝四夷之略<\/b>：平南越、定东瓯闽越，灭卫氏朝鲜置四郡，通西南夷置郡县，开河西而通西域，兵锋所指、郡县随之。汉朝疆域远超秦代，华夏政治圈层扩展，多民族国家之规模由此奠定，声教远被于四裔。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>白登之围<\/b>：前200年汉高祖亲征匈奴，被围白登山七日，此后汉初对匈奴行和亲之策<\/li><li><b>马邑之谋<\/b>：前133年汉武帝设伏马邑诱击匈奴，事泄未成，汉匈由和亲转向战争<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-fro\"><h3 class=\"bigsec-h\"><span class=\"num\">四<\/span>边疆·民族<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"17\">边疆治理 <small>边疆、民族与战争<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>南平百越与北筑长城<\/b>：秦南抚百越，置桂林南海象郡，开凿灵渠以通粮道，又遣蒙恬北逐匈奴、连接秦赵燕旧城筑万里长城。岭南首次纳入郡县版图，农耕游牧分界线由此划定，多民族国家疆域格局奠定。<\/li><li><b>河西四郡与西域都护<\/b>：汉武帝于河西走廊置武威张掖酒泉敦煌四郡，隔绝匈奴与羌人；宣帝神爵二年设西域都护府，治乌垒城，统领西域南北两道。中央政权自此直辖西域，丝路交通由此获得制度保障。<\/li><li><b>西南夷与东南之治<\/b>：武帝平南越东瓯闽越，通夜郎滇国置犍为牂柯越巂诸郡，西南夷地区渐次纳入郡县体系，东北置玄菟乐浪等四郡。郡县制推广至四方边地，边疆各族与华夏交融加深，统一多民族国家格局由此形成。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"18\">民族关系<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>汉匈和战之变<\/b>：汉初国力凋敝，以和亲岁奉羁縻匈奴；武帝时国用丰饶，遣卫青霍去病数次大规模出击，漠北一役匈奴远遁，漠南无王庭。汉匈关系由守转攻，和战交替成为此后历代边疆政策之基本模式。<\/li><li><b>昭君出塞<\/b>：竟宁元年呼韩邪单于入朝，自请为汉婿，元帝以宫人王嫱赐之，号宁胡阏氏，此后边城晏闭、牛马布野数十年。和亲由被迫屈辱转为主动怀柔，成为处理民族关系之重要方式，为边疆安定提供和平范例。<\/li><li><b>诸族内迁与融合<\/b>：匈奴分化而南单于附汉入塞，羌人内迁关中，越人徙于江淮，各族与汉人错居杂处、互通婚俗。华夏认同随交往加深，汉族以融合而成之名渐固，多元一体格局由此奠基，统一多民族国家结构趋于成熟。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>赵佗与南越国<\/b>：秦末赵佗割据岭南建南越国，汉武帝时削平南越、置九郡，岭南正式纳入版图<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-tho\"><h3 class=\"bigsec-h\"><span class=\"num\">五<\/span>社会·思想<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"11\">社会阶层与矛盾<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>四民与奴婢之等<\/b>：秦汉社会士农工商四民分业，各有著籍，奴婢列为贱口，附属于主人而不入编户。身份等级秩序分明，奴婢问题贯穿两汉，董仲舒、王莽皆有解放奴婢之议，然贱口之制终汉不改，成为两汉持续之社会难题。<\/li><li><b>豪强兼并与民变<\/b>：富者田连阡陌、贫者无立锥之地，土地兼并成为两汉顽疾，师丹限田、王莽王田、光武度田诸策皆告失败。豪强役使贫民、荫庇户口，无路之民相继起事，绿林赤眉与黄巾皆由此酝酿，周期性社会危机由此定型。<\/li><li><b>布衣卿相与豪族之兴<\/b>：汉初布衣将相执掌朝政，此后军功地主让位于经学世家，累世经学、累世公卿之家勃兴。社会上层由流动趋于固化，士人凭经学结成门第，豪族地主与皇权共治之势渐显，成为魏晋门阀政治之胚胎。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"12\">思想<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>焚书坑儒与以吏为师<\/b>：秦始皇纳李斯之议焚毁民间诗书百家语，唯医药卜筮种树之书得存，又坑杀方士儒生于咸阳，令学者以吏为师。法家学说定于一尊而学术遭禁锢，思想专制激化士人离心，成为秦失人心之重要原因。<\/li><li><b>黄老之学与无为而治<\/b>：汉初君臣惩秦之败，尊奉黄老之学，清静无为、省刑薄赋、不扰农时，曹参以清静治齐相汉遂成典范。无为而治契合战后休养之需，促成文景之治，然难应集权扩张之要求，思想转折终由此完成。<\/li><li><b>罢黜百家与独尊儒术<\/b>：武帝采董仲舒对策，罢黜百家、表章六经，立五经博士与博士弟子员，以儒术取士，经学遂为利禄之途。儒学由诸子之一跃升为国家意识形态，两千年思想主轴由此确立，经学章句之繁琐亦随之而生。<\/li><li><b>谶纬盛行与佛教东传<\/b>：东汉以谶纬附会经义，光武帝以图谶断决疑事，儒学染上神学色彩；明帝永平年间遣使西域求法，佛教传入中土，洛阳首建白马寺。儒学神学化而理性稍衰，异域宗教入华，思想多元之局由此开启。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>董仲舒<\/b>：上《天人三策》，倡“大一统”“罢黜百家、独尊儒术”，著《春秋繁露》，以三纲五常规范伦理<\/li><li><b>石渠阁会议与白虎观会议<\/b>：西汉宣帝召石渠阁会议、东汉章帝召白虎观会议讲论五经异同，后者成果编为《白虎通义》，标志经学法典化、儒学与谶纬合流<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-cul\"><h3 class=\"bigsec-h\"><span class=\"num\">六<\/span>文化·交流<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"20\">对外交流<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>张骞凿空西域<\/b>：武帝时张骞两度奉使西行，联络大月氏乌孙以断匈奴右臂，历经拘扣险阻，遍历大宛康居大夏，得闻西域诸国风土。中原与中亚交通自此开通，史称凿空，丝路贸易与文明交流由此开启，物产技术双向传播。<\/li><li><b>甘英使大秦与班超经营<\/b>：明帝时班超出使西域，经营三十余年，官至西域都护；和帝永元九年甘英奉命出使大秦，抵条支临大海欲渡而还，所记风土远及西亚。汉人对西方认知达到当时极限，中西交往之线由此延续未绝。<\/li><li><b>倭奴金印之赐<\/b>：光武帝建武中元二年，倭奴国遣使奉贡朝贺，光武赐以印绶，汉委奴国王金印于日本出土可证，此后东海海上交往渐开。中日官方往来见载于史册，汉文化东传之端由此开启，东亚交流网络初步形成。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"21\">史学发展<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>史记之创体<\/b>：司马迁忍辱发愤，撰成中国第一部纪传体通史《史记》，上起黄帝下讫当代，本纪、表、书、世家、列传五体具备，究天人之际、通古今之变。<b>纪传体<\/b>由此成为正史标准体裁，史学独立意识确立，后世誉之为史家之绝唱。<\/li><li><b>汉书之断代<\/b>：班固继承父业撰《汉书》，起高祖终王莽，包举一代，十志详载典章制度，为<b>第一部纪传体断代史<\/b>。断代为史适应王朝更迭之需，后世正史皆奉为准则，官方修史之传统由此强化。<\/li><li><b>七略与今古文之争<\/b>：成帝时诏刘向校理群书，刘歆续成《七略》，总群书为六大类，为中国第一部目录学著作；又倡立古文经，与今文经学相争不下。文献整理与经学分派并进，目录校雠成为治学门径，学术分野影响深远。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>《东观汉记》<\/b>：东汉官修本朝史，为后世《后汉书》的重要依据<\/li><li><b>《吴越春秋》<\/b>：东汉赵晔撰，记吴越争霸之事<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"22\">成就<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>造纸术<\/b>：蔡伦改进造纸——元兴元年尚方令蔡伦以树皮麻头敝布鱼网捣浆抄纸，纸质轻廉，代简帛而行，人称蔡侯纸。书写载体成本骤降，文籍流布大易，文教下逮民间，造纸术后经西域传向世界，成为推动文明传播之巨制。<\/li><li><b>九章算术<\/b>：数学体系成型——成书于东汉，集方田粟米衰分少广商功均输盈不足方程勾股九章，详载分数运算、比例分配、开方与正负数运算，联立方程解法领先世界。古代数学体系由此确立，田亩赋税工程测算皆有法可循。<\/li><li><b>纪传史学<\/b>：史记汉书双璧——史记为纪传通史之祖，汉书为断代史之首，一究天人古今之变，一包举一代典章，叙事严谨、文质相称。二书垂为正史典范，廿四史体例由此定型，中国古代史学之独立地位由此确立。<\/li><li><b>工程大成<\/b>：长城驰道灵渠——万里长城连接燕赵秦旧塞控扼北边，驰道直道以咸阳为心通达郡国，灵渠沟通湘漓二水济岭南通漕。三大工程控边畅轴通漕各显其用，帝国之筋骨由此坚密，大规模劳动组织能力亦由此彰显。<\/li><li><b>汉赋乐府<\/b>：辞章之乐并兴——司马相如子虚上林铺张扬厉、极骋辞之能事，乐府机构采民间歌谣配乐而歌，孔雀东南飞等叙事长篇亦兴。辞赋存帝国气象，乐府存里巷风情，雅俗文学由此并存互渗，文学体裁之疆域大为拓展。<\/li><li><b>地动浑仪<\/b>：天文器械创制——张衡造候风地动仪，八个方位龙口含铜丸，地震则丸落铜蟾蜍之口，验之准确；又制浑天仪以水力转动模拟天象。观测仪器由此开创先例，天学实测之术精进，堪称当时世界科技之冠冕。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>《说文解字》<\/b>：东汉许慎撰，我国第一部系统字典，为部首检字法之始<\/li><li><b>《伤寒杂病论》<\/b>：东汉张仲景撰，中医辨证论治的奠基之作；华佗创麻沸散、行外科手术；<b>《神农本草经》<\/b>为最早的药物学专著<\/li><li><b>《周髀算经》与浑天说、盖天说<\/b>：先秦至汉代的天文算学成就，浑天说后成为主流宇宙论<\/li><li><b>王景治河<\/b>：东汉王景主持修治黄河，此后黄河长期安流<\/li><li><b>《太初历》<\/b>：汉武帝太初元年（前104年）颁行，以正月为岁首，是我国第一部较完整的历法<\/li><li><b>二十四节气的形成与完善<\/b>：源于黄河流域农事经验，秦汉间逐步定型<\/li><\/ul><\/div><\/div><\/div><\/section>", "三国两晋南北朝": "<div class=\"art-head\"><div class=\"kicker\">大分裂与大融合<\/div><h2 class=\"art-title\">三国两晋南北朝<\/h2><div class=\"art-span\">220—589年 ｜ （三国：220—280年 / 西晋：266—316年 / 东晋十六国：317—420年 / 南北朝：420—589年）<\/div><\/div><div class=\"q-wrap lead-in\"><p class=\"para\">三国两晋南北朝是大分裂与大融合时期。东汉崩解后魏蜀吴鼎立，西晋短暂统一旋即陷于八王之乱与永嘉之乱，晋室南渡而北方十六国迭兴，终由北魏统一北方，与南朝长期对峙。此期政权更迭频繁而战乱相循，然民族融合空前深入，北方少数民族汉化与汉族胡化双向进行；士族门阀政治盛极而衰；江南经济首次大规模开发；儒玄佛道多元思想并存，佛教广泛传播；九品中正、均田制、府兵制等制度创新为隋唐盛世奠基。分裂中孕育着新的统一因素。<\/p><\/div><div class=\"blk\"><h3 class=\"blk-h\">重要历史时期及事件<\/h3><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>三国鼎立之局<\/b>：220年曹丕代汉称帝建魏，刘备继立蜀汉，孙权后称帝于吴，魏蜀吴三分疆宇，各据一方而制度竞争并进。中原一统之局就此终结，南北对峙与区域开发并行，分裂中孕育再统一之因素，影响绵延至隋唐。<\/li><li><b>司马氏代魏<\/b>：司马懿发动高平陵之变诛曹爽而夺中枢，其子司马师司马昭相继秉政，专权弑君，司马炎终受魏禅建立晋朝。禅代以宫廷政变之形完成，曹魏权臣柄政之局移植于晋室，门阀政治由此开局。<\/li><li><b>西晋灭吴与短暂统一<\/b>：太康元年王濬率益州楼船东下，铁锁横江不攻自破，吴主孙皓出降，三分归一。晋颁占田课田与户调之式，偃武修文，太康间户口滋殖，史称太康之治。然惩魏氏孤立而大封宗室，任诸王典兵出镇，统一根基未固，武帝身没而八王之乱继起，短暂一统旋为永嘉之祸所乘，盛业如昙花一现，分裂格局自此定型。<\/li><li><b>永嘉之乱与西晋亡<\/b>：晋室诸王内讧耗竭国力，匈奴刘渊举兵建汉，其子刘聪攻陷洛阳、俘虏怀帝，晋愍帝出降于长安，西晋覆灭。中原士民大规模南渡，北方陷于五胡十六国之纷争，华夏政治重心南移之端由此开启。<\/li><li><b>淝水战后南北均势<\/b>：苻坚统一北方后大举南侵，兵败淝水，前秦土崩瓦解，北方重陷分裂；东晋乘势北进，江南转危为安。南北均势由此再延百余年，胡族政权转向内部整合，为北魏统一北方预留空间，均势之局赖此维系。<\/li><li><b>侯景之乱与梁衰<\/b>：东魏降将侯景举兵叛梁，攻陷台城，梁武帝忧愤而死于台城，建康与三吴惨遭焚掠，士族聚居之地荡然残破。江南经济文化中心受创至深，南朝实力一蹶不振，南北均势逆转，六朝繁华由此走向衰落。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li style=\"border-bottom: 0px;\"><b>国史之狱<\/b>：北魏崔浩因修国史直书鲜卑旧事并刻石示众，450年遭族诛，为北朝汉人士族的一大打击<\/li><li><b>六镇起义<\/b>：523年起北魏北边六镇戍卒因地位下降而起义，动摇北魏统治，引发河阴之变与北魏分裂<\/li><li><b>河阴之变<\/b>：528年尔朱荣于河阴屠杀北魏王公百官，北魏名存实亡，加速分裂为东魏、西魏<\/li><\/ul><\/div><\/div><\/div><section class=\"bigsec g-pol\"><h3 class=\"bigsec-h\"><span class=\"num\">一<\/span>政治制度<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"3\">中央官制 <small>政治与制度<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>中书省之设<\/b>：曹魏置中书省，以中书监、令典掌机密诏命，草诏之权自尚书移于中书，皇帝近臣居于决策之枢。中书监、令位卑权重，中枢决策机制由此重构，三省分权体制之先例由此开启。<\/li><li><b>尚书省之定型<\/b>：魏晋尚书台改称尚书省，“出纳王命，敷奏万机”，下统诸曹郎分曹理事，南朝诸省并立而尚书居执行之要。行政中枢机构层级化、部门化，六部之雏形由此肇端，隋唐三省六部制之骨架初步形成。<\/li><li><b>录尚书事与门阀柄政<\/b>：东晋士族首领以录尚书事总揽朝纲，王导以丞相当国，朝野倚重，庾亮桓温相继执政，皇权拱手而士族主政。门阀与皇权共治之格局确立，君臣之界因之模糊，门阀政治成为此期中枢政治之最大特色。<\/li><li><b>门下省之兴起<\/b>：西晋始设，南朝沿之，侍中职掌由宫内傧赞渐转为审议诏令，封驳谏诤之权渐重，与中书尚书并立而相互制衡。三省鼎立之势初步具备，决策审议执行之分工日明，中枢体制趋向分权制衡，为隋唐三省体制奠定基础。<\/li><li><b>南朝五省<\/b>：中书、尚书、门下、秘书（掌典籍图书）、集书。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"4\">中央与地方行政制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>侨州郡县之置<\/b>：永嘉之后中原流民南徙，东晋于江南侨立州郡县以安置流人，保持其原籍名号，侨人免纳调役。政区名实错乱、版籍混淆，土著侨民之别酿成赋役不均，土断之政由是屡兴，行政制度因乱而生变，影响深远。<\/li><li><b>土断之政<\/b>：东晋南朝屡行土断，省并侨置郡县，令侨流断入白籍、就地著籍纳课，兴宁二年庚戌土断由桓温主持，最为严整。流民著籍使国家税基稍复，侨土之别趋于消弭，户籍与赋役之整理由此推进。<\/li><li><b>都督与方镇之势<\/b>：魏晋于要州置都督诸州军事，都督兼掌军政、节制刺史，出镇方面、兵权在握，扬州荆州尤为重镇。方镇坐大而中央控御之力衰减，外重内轻之势由此形成，成为东晋南朝政局动荡与割据之根源。<\/li><li><b>典签与寒门崛起：<\/b>南朝皇帝以寒人典掌机要、处理政务。州镇设立典签，职微权重，州镇要事必须典签签署方能实行，每年数次向皇帝回京报告。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"5\">选官制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>九品中正制之立<\/b>：220年曹丕采陈群之议，中央官兼任本州郡大小中正官。对士人做品、状，品第人物为上中下九等，吏部据以授官，本意中央调控地方选举，起初增加中央集权。后所选渐重家世门第。选官之权终为高门垄断，门阀政治之核心制度由此确立。<\/li><li><b>察举之衰<\/b>：两晋察举孝廉秀才仍岁岁举行，然中正评语定其高下，贡举徒具仪文，州郡所举多豪门子弟。察举与九品中正并行而实权尽归中正，选举之公信渐失，寒素进身之途由此日窄，取士之公难以为继。<\/li><li><b>寒素之沉滞<\/b>：中正品第以家世为首要，所谓上品无寒门、下品无势族，寒门才俊屈沉下僚，势族子弟坐至公卿。阶层流动之门壅塞，人才选拔失其公正，社会固化之势由此加深，门阀政治之弊积重难返。<\/li><li><b>清浊官分之途<\/b>：官职分清官浊官，清官职闲廪重、地位清显，士族垄断清途，寒人只能充任浊职卑位。身份等级渗入官制之中，选官与门第合而为一，流品之分成为南朝官制之显著特征，寒裔进身愈艰。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>中正定品<\/b>：九品中正制由中正官依门第定品，遂成“上品无寒门、下品无士族”之局<\/li><li><b>百家谱与谱学<\/b>：东晋南朝以百家谱校定士族门第，谱学成为维护门阀身份之学<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"6\">监察制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>御史台之独立<\/b>：魏晋御史台脱离少府而成独立监察机构，御史中丞纠劾百官、肃正朝仪，治书侍御史分掌其职，监察不隶行政而直属君主。台谏体制之骨架由此确立，纠弹之威较前代更峻，吏治整饬赖此维系。<\/li><li><b>校事与刺奸之察<\/b>：曹魏设校事官伺察群下，以特务手段监察臣僚，卢洪赵达之流罗织成风，群僚侧目，校事之制至嘉平年间始废。特务监察伤君臣之信，风闻纠劾之弊由此显现，后世引为深戒。<\/li><li><b>中正兼司清议<\/b>：州郡中正品第人物之外，兼有访察乡论清议之责，士人名节由乡里舆论与中正品题共同裁定。选官与监察职能合一，考课核实之功能反受侵蚀，监察之效为门第所夺，制度运行由此失其公正。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"7\">法律制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>魏律与晋律<\/b>：魏明帝命陈群刘劭等制新律十八篇，删汉律之繁；晋武帝泰始年间颁泰始律，贾充杜预等主其事，凡二十篇，首立准五服以制罪。礼律融合至此深入，中华法系之基本框架由此奠定，引礼入律垂范隋唐。<\/li><li><b>张杜律注<\/b>：张斐杜预分别为晋律作注，明发律之意理、疏通条文，杜预注随律颁行，与律文同具效力。律学注释自成体系，断狱有了统一依据，律学之独立地位由此确立，注律成为历代修法之传统。<\/li><li><b>复肉刑之议<\/b>：汉末以来屡有恢复肉刑之议，主张以劓刖代死刑以惩奸止罪，曹操魏文帝两度议而未行，陈群钟繇主之而王朗等驳之。乱世司法严苛、刑讯时有，刑罚轻重之辩长期未决，宽严之取舍影响后世法制。<\/li><\/ul><\/div><\/div><\/section><section class=\"bigsec g-eco\"><h3 class=\"bigsec-h\"><span class=\"num\">二<\/span>社会经济<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"8\">户籍与基层治理 <small>户籍与赋税<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>黄籍白籍并行<\/b>：东晋侨人以白籍登记、最初免纳调役，土著以黄籍著籍、承担赋役，户籍制度黄白双轨并行。籍注淆乱而赋役不均，冒注伪状之风渐炽，版籍之整理成为南朝长期难题，土断之政由此屡行，土断让流民以所居之土为断，人在哪里哪里住籍，和原住民一样纳税服役。东晋共进行四次。效果最为显著的是恒温主持的庚戌土断，刘裕主持的义熙土断。<\/li><li><b>宗主督护之制<\/b>：十六国北魏初期北方坞堡林立，豪强聚宗族乡党自保，北魏因之以宗主督护统摄民户，赋役多入私门。国家编户为豪强荫占，基层掌控空虚，三长制改革由此蓄势，基层治理之重构势在必行。<\/li><li><b>三长制之立<\/b>：北魏太和年间李冲建言，五家立邻长、五邻立里长、五里立党长，三长检括户口、征收租调、维持治安，取代宗主督护。荫户大量出而复为编户，国家掌控基层之力由此恢复，均田制与租调制赖以落实。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>荫客制<\/b>：东晋南朝以法令允许官僚按品级占有佃客、衣食客，客皆注家籍，不负担国家课役<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"9\">赋役制度<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>曹魏户调制开始：<\/b>田租每亩四升，每户出绢二匹，棉二斤，按民户财产多寡定出户。<\/li><li><b>户调式之颁<\/b>：西晋颁户调式，丁男占田七十亩课田五十亩，丁女减半，丁男之户岁输绢三匹绵三斤，次丁户减半。以户为征收单位而田赋口赋合于户调，赋役定额化由此确立，然豪强荫户如故，实效有限。<\/li><li><b>北魏均田租调<\/b>：北魏与均田令相配套，一夫一妇纳粟二石、调帛一匹，受田者即负纳税之责，租调随田而定。赋役与土地授受相结合，民有恒产而国有常税，租庸调制之雏形由此孕育，北朝财政之基赖此而立。<\/li><li><b>徭戍之重<\/b>：分裂时期军兴频仍，筑城转漕、运输攻守皆驱编户充役，役无虚岁而征发无常，民多逃亡脱籍。重役逼民流散，在籍户口锐减，赋役基础为之动摇，成为各国财政与统治之共同困境。<\/li><li><b>盐税与关市杂征<\/b>：各国擅盐铁之利以充军资，又加关市之征，杂调屡兴，苛细横敛不一而足，商旅困顿而民力凋敝。横征虽济一时军国之用，然竭泽而渔，民怨积聚，赋役紊乱成为割据政权难以久立之因。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"13\">土地制度 <small>经济与生产<\/small><\/h4><\/div><div class=\"topic\"><div class=\"q-wrap\"><ul class=\"bullets\"><li style=\"border-bottom: 0px;\"><b>屯田与公田之营<\/b>：曹魏民屯军屯，邓艾淮南屯田蓄水为陂，北朝亦以官田荒田授民、边镇营屯，军资民食赖以补给。国有土地经营补私田之不足，恢复生产之效显著，为乱世农业复苏提供制度支撑，作用深远。<\/li><li><b>占田制与<\/b><font color=\"#5b4a22\"><b>品官荫客<\/b><\/font><b>之限<\/b>：西晋分占田（农民占的田）和课田（交课税之田）。规定丁男占田七十亩丁女三十亩，丁男课田50亩丁女20亩。品官占田荫客，官品第一占50顷每下减五顷，至第九荫占田宅佃客各有等差，意在抑制兼并。限田之义可取而执行乏力，世家逾限如故，兼并之势未能遏止，制度理想与豪强现实之落差由此可见。<\/li><li style=\"border-bottom: 0.666667px dashed rgb(226, 217, 200);\"><b>均田令之颁行<\/b>：485年北魏孝文帝颁均田令，男十五岁以上受露田四十亩桑田二十亩，妇人露田二十亩桑田二十亩，非桑之乡授麻田，奴婢授田与农民相同。老免还田，桑田为世业可传子孙。国家掌握授田还受之权，无地少地之民获得耕种之本，土地制度之新框架由此确立。北齐时奴婢受田有所限制，租调增加，意图限制王公贵族豪强。北周分婚未婚男子受田。<\/li><li><b>世家庄园经济之张<\/b>：士族豪强广占田园山泽，封锢山水之禁屡下屡犯，庄园内佃客部曲耕作、自给自足，谢灵运山居赋可证其盛。大土地所有制持续扩张，国家税源为其侵夺，与均田小农经济构成消长之势，影响南朝经济格局。<\/li><li><b>北方坞壁经济<\/b>：为抵抗战乱掠夺设立，设防的田庄。一般由豪强大族任坞主，宗党乡人、门生故吏、部曲宾客与其保持很强依附关系，一是组织生产，维持生活，二是按照一定规章组织武力。有很强独立性。北魏前期采用宗主督护制维持这一现状，孝文帝改革实行三长制，使坞壁经济退出历史舞台。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"14\">商业<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>草市之兴<\/b>：南北分裂而域内互市不绝，长江津渡、军镇近旁草市渐起，乡村集市交易盐铁布粟，南北互市之使亦岁岁相通。民间市场网络在乱局中生长，为唐宋草市镇之先导，商业活力由此延续不绝。<\/li><li><b>海上交通与互市<\/b>：孙吴遣卫温诸葛直浮海求夷洲，番禺交州为南海贸易之港，香料犀象珠玑自海外输入，扶南林邑遣使通好。海上商路渐次开通，东南港市由此兴起，对外贸易重心渐向江南转移。<\/li><li><b>关市之征<\/b>：各国于关津设卡征税、市租入官，盐铁利入与市税成为军国费用之重要来源，税率苛细而商旅困顿。关市之征虽碍流通，然南北互市、胡汉贸易未尝断绝，物资交流于战乱中维系不断。<\/li><li><b>贵族官僚之商<\/b>：士族官僚兼营殖货，邸店遍设、囤积居奇，南朝诸王及权贵竞逐商利，官僚资本充斥市场。权势与商业资本结合，豪商倚势而平民受挤，市场结构因之畸变，身份经商成为此期商业之突出现象。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"15\">手工业<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>蜀锦与江南丝织<\/b>：蜀汉设锦官专掌织锦，成都机杼相闻，蜀锦行销吴魏，为军资大宗；江南丝织自吴而兴，技艺由粗转精。丝织中心由北向南扩展，产业格局因乱世而调整，江南手工业基础由此奠定。<\/li><li><b>造纸之普及<\/b>：麻纸产量大增而价格渐廉，南北文书典籍渐用纸张，桓玄诏令以纸代简，官府文书随之改易。书写载体之变促进典籍整理与学术下移，文人抄书藏书之风渐盛，文化传播因此加速。<\/li><li><b>青瓷之成<\/b>：越窑婺窑瓯窑烧造青瓷，釉色青润、器形规整，鸡首壶莲花尊为其名品，六朝墓葬青瓷出土众多。制瓷技术趋于成熟，日用器皿渐代铜陶，江南窑业体系由此形成，外销之途亦已启程。<\/li><li><b>冶铸与造船<\/b>：灌钢法发明，生熟铁合炼而钢质均匀，水排鼓风改进冶铁效率；江南滨江造船业盛，吴舰楼船远航夷洲，法显归国乘商船自海而还。冶铁造船技术并进，农战之器与航海之资兼备，手工业整体水平由此提升。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"16\">货币<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>钱法之乱<\/b>：三国分铸异币，蜀铸直百五铢大面虚值，吴行大泉五百当千，敛财于民而物价腾踊；东晋不铸新钱，沿用孙吴旧钱。钱币割裂紊乱，钱轻物重，交易受阻，货币经济退化为实物经济之过渡由此显现。<\/li><li><b>谷帛为币<\/b>：战乱铸币衰退，民间交易以谷帛为媒，绢布粟米兼充货币，剪凿布帛、湿谷薄绢之弊丛生，魏文帝一度罢钱而用谷帛。实物货币回潮显示金属铸币供给不足，商品经济受抑，交易之困由此加深。<\/li><li><b>太和五铢之复<\/b>：北魏孝文帝太和十九年铸太和五铢，令钱行于京师及诸州，听官民同铸，北方钱法自乱而复整。货币秩序恢复促进商贸流通，洛阳市场钱货并行，北朝币制由此渐归统一，商品经济复苏由此加速。<\/li><\/ul><\/div><\/div><\/section><section class=\"bigsec g-mil\"><h3 class=\"bigsec-h\"><span class=\"num\">三<\/span>军事<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"10\">兵制<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>世兵制与士家<\/b>：三国行世兵制，兵户别立户籍、父死子继、世代为兵，魏之士家吴之兵户婚配限于同类，身份低于编户齐民。兵农分途而军户地位卑贱，逃亡叛乱时有，兵源素质渐降，职业世袭兵制之弊端由此显现。东吴领兵复客制，领兵大族世代统领率领士兵，复客是允许官僚大族所占有的佃客免除赋税。<\/li><li><b>北府兵之建<\/b>：东晋谢玄镇广陵，募徐兖流民劲勇组建北府兵，淝水一战大破前秦，刘牢之统军威震江淮。流民帅以武力跻身政治，寒门武人势力上升，兵权渐归方镇，刘裕即以北府之众开创刘宋基业。<\/li><li><b>府兵制之创<\/b>：西魏宇文泰仿鲜卑部落兵制与周官六军之意，立八柱国十二大将军二十四开府统军，府兵另籍、免除租调，农隙训练、轮番宿卫。胡汉兵制融为一体，兵农合一之制由此奠基，隋唐军制沿此发展。<\/li><li><b>部曲与私兵之盛<\/b>：乱世将帅募兵蓄养部曲，拥兵自随、兵为将有，将帅易主而兵随人走，国家征发之制形同虚设。中央军权涣散，武人跋扈之势由此滋长，兵权私属成为南朝政权更迭频繁之重要原因。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"19\">战争与军事冲突<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>官渡之战<\/b>：曹操与袁绍相持于官渡，曹操夜袭乌巢焚其粮谷，袁军溃散，袁绍忧愤而亡，曹操尽有河北之地。以少胜多之典型战例，北方统一之主导权由此归属曹操，曹魏基业由此奠定。<\/li><li><b>赤壁之战<\/b><font color=\"#5b4a22\"><b>与夷陵之战<\/b><\/font>：208年曹操南征荆州，刘备与孙权结盟，周瑜黄盖火攻焚其船舰，曹军败退北归，刘备旋取荆益，奠定三足鼎立基础。刘备益州称帝后，意图夺回荆州亲征东吴，吴将陆逊火攻之法大败蜀军，蜀军退回益州，被封锁在三峡以西地区，三足鼎立局面最终形成。<\/li><li><font color=\"#5b4a22\"><b>淮南三叛与<\/b><\/font><b>平吴之役<\/b>：司马懿掌握曹魏政权后打击曹魏宗室，三次反叛平定后加强了司马氏对曹魏政权的掌控。晋武帝遣王濬王浑诸路伐吴，王濬楼船顺流出建业，孙皓面缚出降，三国归于西晋一统。分裂近百年的政局暂告终结，太康之治随之出现，然分封诸王与州镇之兵埋下乱源。<\/li><li><b>八王之乱：<\/b>晋惠帝登基后，贾后利用楚王干掉辅政大臣和汝南王，利用士大夫铲除楚王。后因太子废立贾后与朝臣、宗王矛盾加剧。赵王伦诛杀贾后逼惠帝退位，企图染指皇位，引发地方诸王起兵讨伐。八王之乱历时16年。<\/li><li><b>淝水之战<\/b>：苻坚率大军号称百万南下，谢玄谢石以八万北府兵迎战于淝水，趁秦军半渡而击，秦军溃散、风声鹤唳。东晋以少胜多保住江左，前秦瓦解而北方再裂，南北对峙之局由此延长百余年。<\/li><\/ul><\/div><\/div><\/section><section class=\"bigsec g-fro\"><h3 class=\"bigsec-h\"><span class=\"num\">四<\/span>边疆·民族<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"17\">边疆治理 <small>边疆、民族与战争<\/small><\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li style=\"border-bottom: 0.666667px dashed rgb(226, 217, 200);\"><b>前秦之经略西域<\/b>：苻坚遣吕光西征，破龟兹而西域诸国降附，前秦声教远达葱岭，西域与中原政治联系一度恢复。经略随淝水之败而中断，然中原政权经营西域之传统由此延续，为隋唐治理西域提供先例。<\/li><li><b>北魏统一北方<\/b>：439年太武帝拓跋焘灭北凉沮渠氏，结束十六国纷争，黄河流域归于统一，与南朝形成对峙之局。北方整合为孝文帝改革奠定政治前提，南北朝格局由此形成，多民族政权建设之经验由此积累。<\/li><li><b>六镇之设<\/b>：北魏为防柔然，自西而东设沃野怀朔武川抚冥柔玄怀荒六军镇，镇兵镇民戍守北边，出镇多为鲜卑贵人。六镇拱卫平城后魏文帝迁都洛阳而镇人身份渐卑，积怨日深，六镇之乱由此酝酿，北朝政局因之剧变。<\/li><li><b>东北之经营<\/b>：公孙氏据辽东，毌丘俭征高句丽刻石纪功，前燕慕容氏兴于辽西而入主中原，高句丽渐强而与北魏南朝并遣使通好。东北边疆政权更迭与民族角逐交织，疆域经略与朝贡往来并行，边疆格局由此演变。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"18\">民族关系<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>五胡内迁<\/b>：匈奴羯氐羌鲜卑诸族自汉魏以来渐次内迁，居于并州关中等地，与汉人错居杂处，胡汉界限渐泯于日用。内迁改变北方族群结构，融合之机与冲突之险并存，永嘉之后诸族建国由此成为北方政治之常态。<\/li><li><b>十六国兴替<\/b>：刘渊建汉、石勒建后赵、苻健立前秦、慕容氏建诸燕，五胡政权迭兴迭灭，百余年间北方大小政权分合不定。诸政权或胡汉分治或力行汉化，制度探索积累统治经验，为北魏统一与整合奠定基础。<\/li><li><b>孝文帝汉化<\/b>：494年孝文帝迁都洛阳，禁胡服胡语、改鲜卑姓为汉姓、定族姓与汉人高门通婚、改籍贯为洛阳人，全面推行汉化。鲜卑贵族融入华夏士族之林，胡汉畛域渐消，民族融合深度空前，为隋唐统一之文化基础奠定根基。<\/li><li><b>胡汉双向交融<\/b>：北人习胡床貊炙，胡服骑射渐入中原生活，胡乐胡舞胡食风靡，汉族士民亦染胡风，双向涵化自然进行。民族界限在日用而不觉中消融，中华文明包容性由此增强，多元一体格局因之深化。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>徙戎论<\/b>：西晋江统作《徙戎论》，主张将内迁诸族迁回原居地，未被采纳；其后有永嘉之乱，遂成民族政策的警世之论<\/li><li><b>胡汉二重体制<\/b>：北朝以胡汉分治、双轨官制统御不同族群，是这一时期民族关系的突出特点<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-tho\"><h3 class=\"bigsec-h\"><span class=\"num\">五<\/span>社会·思想<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"11\">社会阶层与矛盾<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>士族门阀之盛<\/b>：两晋南朝士族以婚宦自守，王谢袁萧并称侨姓望族，平流进取、坐至公卿，不涉武事而清谈终日。门第成为社会分层之首要标准，皇权亦须仰士族鼻息，等级固化达于极致，寒门与士族之对立由此加深。<\/li><li><b>部曲佃客之依附<\/b>：士族豪强荫占佃客，部曲耕战皆隶于主家，世袭相承、身系于主，国家编户为其侵夺。依附人口不入版籍、不纳国税，税基萎缩而私门力厚，人身依附关系由此强化，成为此期社会结构之突出现象。<\/li><li><b>流民与孙恩之乱<\/b>：北方流民南下依人而食，东晋孙恩卢循以五斗米道聚众起事，纵横东海沿海十余年，建康为之震动。流民起事与门阀压迫交织，阶级矛盾与海寇之患并发，门阀统治之脆弱由此暴露。<\/li><li><b>奴婢与良贱之隔<\/b>：战俘掠卖没官者沦为奴婢，奴婢耕织供役、子孙相袭，良贱不婚、身份悬隔，赎免之途有限。贱口制度显示社会之不平等，奴婢与部曲构成依附阶层之底层，身份等级之制由此固化，影响至唐犹存。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"12\">思想<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>玄学清谈<\/b>：正始年间何晏王弼祖述老庄、倡贵无之论，名教出于自然之说风靡士林，竹林七贤纵酒放达抗礼法，清谈遂为士族日常。玄学使儒学独尊之局松动，思辨之风大兴，士人精神由经世转向超脱，思想解放由此开启。<\/li><li><b>佛教之盛<\/b>：般若学与弥陀信仰东传，道安整理经典、鸠摩罗什译经长安，大乘义理大畅，出家之风盛行，南朝郭祖深叹言僧尼之众。乱世民众皈依以求慰藉，寺院成为信仰与社会活动之中心，三教论争与交融由此展开。<\/li><li><b>儒玄交融<\/b>：南朝士人兼修三玄与经术，明经修礼者代不乏人，皇侃论语义疏兼采玄义，名教与自然之辩渐趋调和。儒学失去独尊而仍居官学之位，经学玄学化为其存续之道，三教并立之思想格局初步形成。<\/li><li><b>道教之定型<\/b>：葛洪抱朴子集神仙方术之大成，寇谦之清整天师道、制定戒律仪轨，得北魏太武帝崇奉，陆修静陶弘景整理经典斋仪于南方。道教由民间信仰升为国家承认之宗教，成熟教团体系由此确立，与儒佛鼎足而三。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>范缜《神灭论》<\/b>：以“形者神之质，神者形之用”驳佛教神不灭论，为南朝唯物思想的代表<\/li><li><b>慧远与庐山佛教<\/b>：东晋慧远结白莲社、倡因果报应与“沙门不敬王者”，推动佛教的中国化<\/li><li><b>北魏太武帝灭佛<\/b>：446年太武帝听信崔浩、道士寇谦之而下诏灭佛，为“三武一宗”之始<\/li><li><b>北周武帝灭佛<\/b>：574年周武帝下诏断佛道二教、毁寺还俗，为“三武一宗”之一<\/li><\/ul><\/div><\/div><\/div><\/section><section class=\"bigsec g-cul\"><h3 class=\"bigsec-h\"><span class=\"num\">六<\/span>文化·交流<\/h3><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"20\">对外交流<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>佛教东传之潮<\/b>：汉末安世高支娄迦谶始译经于洛阳，鸠摩罗什入长安主译场，法华维摩诸经大乘义理大备，译业蔚为大观。外来宗教深植中土，译经与义解并盛，中外思想交流之高潮由此开启，影响中国思想千年。<\/li><li><b>法显西行求法<\/b>：东晋法显以六十余岁高龄自长安西行，度流沙、越葱岭，历天竺三十余国求取戒律，浮海而归携经籍返国，撰佛国记记行程风物。中国人西行求法之始，中印交通之实录由此留存，地理知识因之扩展。<\/li><li><b>东亚册封往来<\/b>：孙吴遣使通辽东公孙氏与高句丽，倭国卑弥呼遣使入贡，魏封之为亲魏倭王，南朝亦与倭国百济相通。四夷使节往来，册封朝贡网络初步成形，汉字儒学随之东传，东亚文化圈之基础由此奠定。<\/li><li><b>丝路商旅不绝<\/b>：河西走廊虽经战乱，西域胡商东来未断，粟特商人络绎于凉州长安，祆教渐传中土，葡萄石榴等物种入华。分裂未能阻断欧亚贸易，商业往来维系文明交流之脉，中西互通之格局由此延续。<\/li><\/ul><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"21\">史学发展<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>三国志与后汉书<\/b>：陈寿撰《三国志》，分立魏书蜀书吴书，行文简净而有良史之称；范晔撰《后汉书》，增设类传、论赞精深，表彰党锢气节。二书与《史记》《汉书》并列前四史，纪传体正史在乱世中延续，史学经世之传统由此传承。<\/li><li><b>裴注之学<\/b>：裴松之注三国志，博采群书百四十余种，补其阙、订其谬、辨其疑、存其异，注文所引史料多于本文。史注由训诂转向集解考异，史料范围大为扩展，考据之学由此发端，为史学方法之重要进步。<\/li><li><b>十八家晋书之修<\/b>：两晋南朝私修晋史蔚然成风，臧荣绪晋书勒成一家，王隐虞预干宝诸家并存，唐初官修晋书出而诸家渐废。当代史私家竞修展现史家自主精神，史才史识互见长短，官修史书体制由此酝酿形成。<\/li><li><b>世说新语之纂<\/b>：刘义庆招集文士纂汉末至东晋名士言行，分德行言语政事文学等三十六门，刘孝标为之作注，援引详博。志人小说之代表，摹写人物风神传神入微，清谈风气与士族生活之史料由此留存，文史价值兼备。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>《洛阳伽蓝记》<\/b>：东魏杨衒之撰，记北魏洛阳佛寺与市井，兼具地理与史料价值<\/li><li><b>《十六国春秋》<\/b>：北魏崔鸿撰，记十六国史事，为研究十六国的重要史书<\/li><\/ul><\/div><\/div><\/div><div class=\"topic\"><h4 class=\"topic-h\" data-c=\"22\">成就<\/h4><div class=\"q-wrap\"><ul class=\"bullets\"><li><b>圆周率之算<\/b>：祖冲之推圆周率——南朝祖冲之推算圆周率在三丈一尺四寸一分五厘九毫二秒六忽与七忽之间，又定约率密率，密率之值领先世界近千年。算学精度之高峰由此铸就，历算测地皆得其益，数学实测精神彰显于世。<\/li><li><b>齐民要术<\/b>：农学集大成——北魏贾思勰撰齐民要术十卷，起耕田讫制酱醋，备述谷蔬果木畜产鱼养酿造之法，引农谚古书百余种。黄河流域农耕经验之总结，精耕细作体系之集成，古代农学之地位由此奠定，后世农书奉为圭臬。<\/li><li><b>水经注<\/b>：郦道元注水经——北魏郦道元为水经作注，记水道千余条，兼述流域山川城邑物产风俗故实，文笔清丽如山水画卷。古代地学之集大成，山水散文之典范，地理志与游记文学之双重价值由此确立。<\/li><li><b>文心雕龙<\/b>：文论双星——南朝刘勰撰文心雕龙五十篇，论文体、剖情采、体大思精，钟嵘诗品品第汉魏以来诗人，溯源流、别高下。文学批评自成体系之始，创作与鉴赏之法则由此确立，南朝文风之总结影响后世文论。<\/li><li><b>石窟艺术<\/b>：云冈与龙门——北魏文成帝命昙曜开凿云冈五窟，帝佛合一、雄浑壮大，迁洛后龙门石窟继起，造像渐呈褒衣博带中原风韵，魏碑书法亦随之传世。造像艺术本土化进程由此开启，民族融合之艺术结晶传世至今。<\/li><li><b>脉经针灸<\/b>：医典之成——魏晋王叔和撰脉经，定二十四脉、明脉理证候，皇甫谧撰针灸甲乙经，厘定孔穴、明针灸之法，为针灸学第一部专书。诊断与针灸皆有经典可循，中医诊疗体系由此完备，济世之术泽被东亚。<\/li><\/ul><div class=\"supp\"><div class=\"supp-h\">补 充<\/div><ul><li><b>裴秀《禹贡地域图》<\/b>：西晋裴秀绘《禹贡地域图》，提出“制图六体”，为我国古代地图学奠基<\/li><li><b>祖冲之《大明历》<\/b>：南朝祖冲之创《大明历》，并推算圆周率精确到小数点后七位<\/li><li><b>王羲之与书法<\/b>：东晋王羲之被尊为“书圣”，《兰亭序》为行书典范；陶渊明开田园诗一派<\/li><li><b>《昭明文选》<\/b>：南朝梁昭明太子萧统主编，我国现存最早的诗文总集<\/li><\/ul><\/div><\/div><\/div><\/section>"}</script>

审美与埋葬观念", "cells": {"11": "• 前氏族公社：早期人类群居、实行血缘群婚，社会组织尚未成形\n• 向氏族公社过渡：中期出现较稳定的群体，晚期进入以血缘为纽带的氏族公社", "12": "• 原始宗教与审美萌芽：山顶洞人以赤铁矿粉随葬，出现埋葬观念与装饰习俗", "13": "• 采集与渔猎经济：以天然产物为食，尚无农业与家畜饲养", "15": "• 打制石器：旧石器时代的基本生产工具，由简单粗糙到规范多样，晚期出现间接打击法\n• 骨器与装饰品：晚期采用刮、磨、钻孔技术制作骨器、骨针与装饰品\n• 用火：北京人会用火并保存火种，山顶洞人已能人工取火", "22": "• 打制石器与用火技术\n• 骨器、骨针与装饰品\n• 中国境内丰富的古人类化石（元谋人、北京人、山顶洞人等）"}}, {"id": "p1", "name": "新石器时代", "isNew": true, "position": "农业革命与文明起源", "span": "约距今1.2万年—前2070年", "sub": "早期（前段/后段）· 中期 · 晚期", "feature": "新石器时代大约距今一万年开始，人类从狩猎、采集进入锄农业和畜牧业，磨制石器广泛使用，陶器被发明并大量使用。全国新石器遗址约一万余处，活动范围远较旧石器时代广阔。农业形成“南稻北粟”格局，社会由平等走向分化：仰韶、红山、大汶口属中期，马家窑、龙山、屈家岭、良渚属晚期；晚期青铜工具出现、玉器发达，中心聚落与城邦兴起，出现阶级贫富分化。苏秉琦提出“区系类型说”，说明中华文明多元起源。", "events": "• 定义（广义）：新石器时代＝中石器时代＋新石器时代（狭义）。中石器时代以打制石器为主、兼有局部磨光石器，是旧石器向新石器的过渡，并不普遍存在于世界各地\n• 早期前段（距今12000—9000年）：玉蟾岩遗址、仙人洞遗址、南庄头遗址；农业与畜牧业的分工基本完成，渔猎采集仍发挥重要作用\n• 早期后段（距今9000—7000年）：磁山文化、裴李岗文化、北辛文化、兴隆洼文化；磨制石器大量增加，陶器成为生活必需品，原始农业与畜牧业初步发展\n• 中期（距今7000—5000年）：仰韶文化、红山文化、大汶口文化；磨制石器精美，制陶技术进步，农业与畜牧业高度发展，出现大规模中心聚落与公共墓地\n• 晚期（距今5000—4000年）：马家窑文化、龙山文化、屈家岭文化、良渚文化；青铜工具出现，玉器发达，人口激增，出现城邦与阶级贫富分化\n• 裴李岗文化（示例）：因河南新郑裴李岗得名，距今约9000—7000年，是已知华北最早的新石器文化；磨制石器精致，陶器以泥质红陶为主，有房基、墓地等村落遗迹，农业以种粟为主，兼有饲养业\n• 区系分布：黄河中游（裴李岗—仰韶—河南龙山）、黄河下游（北辛—大汶口—典型龙山）、黄河上游（马家窑—齐家）、长江下游（河姆渡—马家浜—良渚）、长江中上游（城背溪—大溪—屈家岭/石家河）、东北与北方（红山、富河）\n• 区系类型说（苏秉琦）：将中国史前文化划为六大区系，各有渊源、特征与发展道路，区系之间又相互影响，对“中原中心”的传统观念提出挑战", "cells": {"11": "• 从平等到分化：中期公共墓地随葬品渐有差别，晚期贫富与阶级分化明显\n• 玉器与神权：红山、良渚大量玉琮、玉璧集中出土，财富与权力向神权、军事贵族集中", "12": "• 原始宗教与礼制雏形：良渚祭坛与玉琮玉璧、红山女神庙，反映神权与等级观念\n• 图腾与祖先崇拜：龙、凤等形象出现，为后世华夏观念的源头", "13": "• 南稻北粟：黄河流域以磁山、裴李岗为代表发展粟作农业，长江流域以河姆渡为代表发展稻作农业\n• 磨制石器与耒耜：翻土工具改进，锄农业成为主要生业", "15": "• 制陶：仰韶彩陶 → 龙山蛋壳黑陶，反映手工业的专业化\n• 玉器：红山玉龙、良渚玉琮玉璧，工艺与礼制意义并重\n• 建筑与纺织：出现干栏式建筑、木构水井等", "16": "• 以物易物：聚落之间已有原始交换，尚无固定货币", "18": "• 多元一体：六大区系各具特色又相互交融，为华夏族与中华文明“多元一体”格局奠基\n• 中原与周边：中原影响各地，各地也影响中原", "21": "• 区系类型说：苏秉琦《中华文明起源新探》提出中国史前文化六大区系，强调中华文明起源的多元性与区系间的相互影响", "22": "• 原始农业（南稻北粟）与家畜饲养\n• 磨制石器、陶器与玉器工艺\n• 中心聚落与城邦（如良渚古城）"}}, {"id": "p2", "name": "传说时代", "isNew": true, "position": "古史传说与军事民主制", "span": "约前3000—前2070年", "sub": "炎黄 · 三皇五帝 · 尧舜禹禅让", "feature": "传说时代指文字出现以前、靠口耳相传保存古史的阶段。炎黄二帝被奉为中华民族始祖；三皇五帝说法不一，却反映华夏先民由部落走向联盟的过程。颛顼“绝地通天”、帝喾“序三辰”，说明国家权力与机构已处萌芽。尧舜禹的“禅让”须经四岳十二牧同意，实为父系氏族公社末期部落联盟的军事民主制。近代以来古史研究经历信古、疑古到释古的转变，顾颉刚“层累地造成古史”、王国维“二重证据法”影响深远。", "events": "• 炎帝（神农氏）：居姜水流域，传说发明耒耜、教民耕种，又尝百草、教人治病\n• 黄帝（轩辕氏）：黄河流域著名部落首领；与炎帝联手在涿鹿之野击败九黎族、杀蚩尤，后又与炎帝战于阪泉之野而胜，遂在黄河流域长期繁衍\n• 三皇五帝：三皇说法不一（伏羲、女娲、神农／燧人、有巢等）；五帝一般指黄帝、颛顼、帝喾、尧、舜\n• 颛顼“绝地通天”：改革祭祀与官制、设官分职，说明国家权力与国家机构处于萌芽之中\n• 帝喾：能“序三辰以教民”，观测天象以安排农业生产\n• 尧舜禹与禅让：尧为部落联盟首领，经四岳十二牧同意传舜；舜又以同样方法传禹，史称“禅让时代”\n• 涿鹿之战与阪泉之战：部落联盟间的融合与冲突（传说）", "cells": {"3": "• 部落联盟与议事会：尧舜禅让须经四岳十二牧同意，“四岳十二牧”即联盟议事会成员，有权推选军事首长\n• 设官分职之萌芽：传说颛顼设官、各司其职，为国家机构之萌芽", "5": "• 禅让制：传贤不传子，属氏族公社选举制传统；禹之后传子启，世袭制取代禅让", "11": "• 军事民主制：父系氏族公社末期，部落联盟首领由议事会推选，军事首领权力渐增\n• 向阶级社会过渡：私有制与阶级分化发展，为夏代国家的建立准备条件", "18": "• 炎黄集团：炎帝、黄帝部落融合，构成华夏族的核心来源\n• 三大集团说（徐旭生）：华夏、东夷、苗蛮三大集团；又有“夷夏东西说”（傅斯年）", "19": "• 涿鹿之战：炎黄部落联合击败蚩尤所率的九黎族\n• 阪泉之战：黄帝战胜炎帝，奠定部落联盟格局", "21": "• 古史研究三阶段：信古 → 疑古 → 释古。顾颉刚《古史辨》提出“层累地造成中国古史”；王国维以“二重证据法”释古\n• 徐旭生《中国古史的传说时代》提出华夏、东夷、苗蛮三大集团说\n• 傅斯年《民族与古代中国史》提出夷夏东西说\n• 李学勤《走出疑古时代》，主张以考古新材料重建古史"}}, {"id": "p1", "name": "夏商西周", "position": "中华文明的奠基与勃兴", "span": "约前2070—前771年", "sub": "（夏：约前2070—前1600年 / 商：约前1600—前1046年 / 西周：前1046—前771年）", "feature": "夏商西周是中华文明的奠基期。夏启废禅让而行世袭，家天下取代公天下，二里头文化或见其踪；商以神权立国，甲骨占卜以通天，内外服制统御四方方国；西周大行分封、确立宗法，制礼作乐，井田为经济之本，构建出以血缘为纽带的天下秩序。此期国家形态由部落联盟演进为成熟王朝，血缘纽带与礼制等级构成统治骨架，青铜铸造与甲骨文成就卓绝，天命观与敬德保民思想萌芽，为后世华夏政治文化奠定深层基因。", "events": "• 启建夏与家天下：约前2070年禹死子启继位，废禅让而行世袭，公天下遂为家天下，王位血缘继承成为此后四千年通则。二里头文化的大型宫殿基址与青铜礼器群，显示国家形态已由部落联盟过渡到广域王权国家，中原地区首次出现能够调动大量人力营建宫室、铸造礼器的政治中心，为商周王朝国家奠定最初根基\n• 商汤灭夏：约前1600年商汤以亳为基地，用伊尹之谋，乘夏桀暴虐失民心而兴师，鸣条一战夏亡商兴。汤以夏亡为鉴而行宽政、减轻征敛，并以天命殛之论证伐桀之正当，天命转移与以德配天的政治理念由此萌芽，开启了商代五百余年神权政治的基本格局\n• 盘庚迁殷：约前1300年盘庚力排众议迁都于殷，结束此前屡迁不宁之局，商朝自此稳定二百余年，政治与文化中心定于洹水之滨。今所见甲骨卜辞多出此期，殷墟成为有直接文献可证的中国信史起点\n• 武王克商：前1046年周武王联合庸蜀羌髳等方国东征，牧野一战商纣兵败自焚，小邦周取代大邑商。周人随即大行分封以藩屏王室、制礼作乐以序等级，并提出天命靡常、敬德保民的合法性论述，把政权更替解释为失德失命而非单纯的武力胜负，深刻塑造了此后中国的政治观念\n• 国人暴动与共和行政：前841年周厉王专利弭谤，国人暴动攻王，厉王奔彘，召公周公二相共理朝政号曰共和。此年为中国历史确切纪年之始，王权首次因民众反抗而中断，显出国人在国野体制下的政治分量\n• 平王东迁：前770年犬戎破镐京、幽王死于骊山，平王东迁洛邑，王畿缩而诸侯强。周王室自此失去天下共主之实，血缘分封秩序崩解，诸侯竞起争霸，春秋时代由此开启", "cells": {"3": "• 夏设百官：夏后氏置牧正掌畜牧、车正掌车服、庖正掌膳食，以家臣管家事者理国事，官职粗设而分类未严，国家机器尚在草创，开后世设官分职之先声\n• 商之内服百官：商王之下设尹为最高辅政，伊尹曾放太甲而摄政，权位之重可见；多尹、小臣分掌农事与征伐，作册掌策命、卜巫掌占卜。官职依事务分设而神职权重，凡战伐、农事、疾病皆先贞问于龟，政教合一之特征鲜明，王权借神意而施行，凡事皆先卜而后行\n• 西周两寮并立：太师太保为王之辅弼，卿事寮掌军政民事、太史寮掌册命祭祀历法，两寮分理政务而相互牵制。册命金文显示官员须经王当面册命方得任职，职事与爵位由王授予而非世袭自专，早期中央行政已具文书与程序，为后世三省六部制之远源", "4": "• 夏之方国联盟：夏以姒姓王族为核心，各方国部落以服属朝贡维系，中央对地方控制松散而依赖血缘与威慑，尚非直属行政，国家结构呈松散联盟形态\n• 商之内服外服制：商王直辖王畿为内服，外服则侯甸男卫邦伯分封于四方。外服诸职对王承担戍边、纳贡、从征之义务而自治其地，叛服无常，商王须频繁征伐以维持畿服等差。畿服远近构成商代统御方国的基本框架，亦为西周分封制之直接前身，其制粗具而尚未严密\n• 西周分封诸侯：武王周公大封同姓子弟与异姓功臣，授土授民建国，鲁卫晋燕齐宋诸国以藩屏周室。诸侯于封国内世袭自治、自置官吏，对王室则朝觐、纳贡、从征。分封以血缘为经纬构拟天下秩序，把王室权威送到未曾设官的远方，同时也埋下诸侯坐大之隐患\n• 国野分治与层层封建：诸侯封国之内再分采邑于卿大夫，层层封建以控边鄙；国中设乡、郊外设遂而编民有别，地方治理依托血缘网络而非官僚行政，边地随分封而渐次开发", "5": "• 世卿世禄：官职与采邑依血缘世袭，公卿大夫之位父子相承，血缘身份即政治资格，寒庶无从进身。周之册命虽由王授，然所授者仍以世族子弟为主，任官不问贤能而问宗支远近，形成典型之贵族政治，至战国军功爵与养士之风起方逐步崩解，其制历数百年不改\n• 学在官府：学术典籍掌于王官，唯贵族子弟得入国学乡学受教，官师合一而无私学，文化垄断与世卿世禄互为表里，至春秋私学兴起、学术下移民间方被打破", "6": "• 多方监视与巡察：商王于外服方国设监、遣多尹小臣巡察四方，诸侯须按期朝觐述职，王以贞卜与军事威慑督察其叛服，监察尚未独立成制而寓于行政与征伐之中\n• 西周监国与巡守：周王于诸侯之国设监、遣卿士监其军政，诸侯定期朝觐述职、报政于王，王则巡守四方以考其政绩。管叔蔡叔监殷即为其例，三监之叛正说明监国者与被监者同出一宗，监察依托宗法血缘而难真正制衡，此制遂为秦汉监郡御史之先声\n• 国人议政：国人可聚议国事、评论君过，厉王弭谤而终招国人暴动，庶民舆论在国野体制下构成对王权之实际约束，为原始民主之遗存，秦汉以后不复存在", "7": "• 禹刑与汤刑：夏有禹刑三千条、商有汤刑，刑书虽不传而征于典籍，皆以维护王权与宗法秩序为务，罪刑尚无公开成文之法典，成文法尚处草创阶段，量刑一任王者之意\n• 西周九刑与吕刑：周有九刑，穆王时吕侯受命作吕刑，明德慎罚、刑罚世轻世重，并定赎刑之等差，五刑之属三千。吕刑强调疑罪从赦、非佞折狱惟良折狱，把司法裁判从单纯复仇转为有程序可循的刑罚体系，礼刑并用之治道由此成型，为后世律令之滥觞\n• 礼刑分施：礼不下庶人、刑不上大夫，贵族以礼约束而庶民以刑惩治，狱讼须纳钧金束矢始得受理，诉讼费用本身即构成等级门槛，司法之等级性贯穿全过程", "8": "• 井田编氓与人口著籍：土地划井字九区，八家共耕公田而各治私田，民著于地而不可徙，基层以井为编制单位。商代登人制度按族登记可征之众，西周则有版籍以纪民数，人口与土地双重绑定，赋役征发与兵员调集皆以此为凭，构成国家直接控制编户之最早形态\n• 国野乡遂之别：国中居国人、郊外野人居野人，乡以五家为比、五比为闾，遂以邻里酂鄙层级相属。城乡分治而身份有别，编制单位兼管教化、赋役与治安，构成西周基层控制网络", "9": "• 贡法助法与彻法：夏行贡法、商行助法、周行彻法，皆以井田为基础按什一税率取民。贡为定额纳献、助为藉民力以耕公田、彻则通计公私田而什一取之，力役地租为主要形态。三法之别实即剥削方式由固定贡纳转向按亩计征，赋役与土地制度浑然一体，随井田瓦解而崩坏\n• 军赋与力役之分：野人供田赋力役、国人当兵纳军赋，赋役依身份而异，兵农合一尚未完全分化，国家财政依附于井田与分封之人身依附关系，货币税尚无从谈起", "10": "• 族兵与族武装：夏商兵器由族众自备，战时族长率族兵从征，兵农合一而兵源依血缘组织，尚未有常备国家军队，战力取决于族之众寡与王之号召力\n• 西周六师与成周八师：王室设西六师戍镐京、成周八师镇东方，每师约二千五百人，甲士由国人充任而野人仅供后勤，兵役身份限制严格。战时以战车为核心，一车配甲士十人、徒卒二十人，车战成为衡量国力之标准，此制至春秋演为千乘之国、战国演为步骑为主\n• 兵器与战车：青铜戈矛钺剑为主要兵器，战车由两马或四马驾挽，车马坑与兵器作坊集中于都邑，青铜兵器由王室垄断铸造，军事技术优势为王朝控御四方之重要凭仗", "11": "• 贵族与奴隶对立：王、诸侯、卿大夫、士构成统治贵族，庶人、工、商为平民，臣妾、奚、仆为奴婢。商代殉葬坑动辄数百人，西周殉人渐少而以俑代之，然奴隶仍广泛用于畜牧、手工作坊与家内服役，无人身权而可赏赐买卖，阶级对立尖锐而缺乏流动渠道，殉人之盛衰即其直接写照\n• 国野身份之别：国人居城郊有参政、当兵、受教之权，野人耕于鄙野而不得与政，身份世袭不可逾越。此为西周社会最基本之等级分野，国人暴动即国人阶层政治能量之集中爆发\n• 礼不下庶人：礼制规范贵族之祭祀、婚丧、朝聘，刑则以治庶民，礼刑分施彰显等级鸿沟，庶人无与于礼而独受于刑，社会矛盾因身份固化而积蓄，至春秋礼崩乐坏而其制始溃\n• 工商食官与匠人：手工业者与商贾世袭其业而食于官，身份近于官府依附人口，技艺依族内父子相传，工商之人不得预于士列，职业与身份双重固化", "12": "• 天命神权：商以帝为至上神，王以占卜承天命治国，凡祭祖、征伐、农事、疾病皆贞问于龟，神意笼罩政治与人生一切领域。商王独占与帝沟通之权，贞人集团掌卜筮以助王决策，宗教神权为统治合法性之根本来源，人事尚未从神意中分立出来，王实为群巫之长，卜辞多出王之亲贞\n• 敬天保民：周以殷亡为鉴，提出天命靡常、惟德是辅，天之授命不专于一姓而视其德之有无，敬天而重保民。周公反复告诫成王无逸、先知稼穑之艰难，把政治重心由事神转向治民，德政观念初萌，政治思想由纯神权向德治理性迈出关键一步，为儒家仁政学说之远源\n• 礼乐思想：周公制礼作乐，以礼别异以序尊卑、以乐合同以和上下，礼乐为维系宗法等级之精神纽带。礼由祭祀仪节扩展为涵盖政治、军事、婚丧之规范体系，构成后世儒家思想之直接源头", "13": "• 井田制：土地划为井字九区，中为公田八家共耕、外为私田各家自给，田有沟洫疆界以为经界。土地名义属王有而实由贵族层层支配，庶人只有耕种之份而无处置之权，藉民力以耕公田即贵族剥削之主要形式，此制为西周经济制度之基石，亦为战国废井田之对象\n• 田里不鬻：土地不得买卖转让，田里皆受于上而归之于上，土地私有权尚未确立，贵族仅享占有权与收益权。此制维系分封宗法之经济根基，至春秋铁器牛耕开出私田而渐被冲破", "14": "• 贝币与交换萌芽：商代以海贝为交换媒介，贝产于南海而难得，故成贵重之交换物，商业初兴而多限于贵族间之贡赐与远程贸易，专业商人阶层尚未形成，交换经济规模有限\n• 工商食官：西周工商业由官府经营，工匠商贾世袭其业而食于官，市由官设、价由官定，交易以物易物为主而贝玉为辅。官府作坊集中于都邑，产品专供贵族礼器与兵器之需，私人商业受抑而无独立发展之余地，商业依附于贵族消费而存在，此制至春秋私营工商业兴起方被打破", "15": "• 青铜铸造：夏商周青铜冶铸达于鼎盛，司母戊鼎重八百三十二公斤、四羊方尊形制奇丽，皆用陶范合铸而成。青铜礼器之数量与形制按等级严格规定，天子九鼎八簋、诸侯七鼎，器即权力之象征。青铜文明冠绝当时世界，而铸铜所需之矿料、燃料与工匠皆由王室组织，手工业规模反映国家动员能力\n• 制陶与原始瓷：灰陶白陶并行，商周已见施釉之原始青瓷，陶器轮制技术普及而器类繁多，陶瓷工艺之进步为后世瓷器诞生奠定技术基础，殷墟与周原窑址皆可证\n• 玉器加工：商周治玉工艺精湛，玉琮玉璧玉戈为礼器重器，殷墟妇好墓出土玉器达七百余件，玉料多来自西域和田，治玉之精与远程取料之难，皆见手工业组织能力\n• 纺织与漆木：麻葛为庶民常服而丝织为贵族专用，商周已见提花丝织物与刺绣，髹漆工艺施于车舆棺椁，手工业分工细密而技艺专精，百工各守其业", "16": "• 天然贝币：商以海贝为货币，以朋为计量单位，一朋约十贝，贝因产于南海而难得，故成交换媒介与赏赐之物，货币尚处于实物阶段，称量与计数并行而未成定制\n• 铜贝与称量货币：商晚期出现铜仿贝，为金属铸币之先声；另有铜块、玉贝、龟贝流通，西周铜以锊为称量单位而行赏赐与罚赎。金属货币虽已萌芽而贝币仍为主导，交易多用实物与赏赐而非市场买卖，币制尚处原始阶段，至春秋战国金属铸币才广泛行用", "17": "• 五服制：周以王畿为中心，甸服侯服绥服要服荒服由近及远，各服依距王畿之远近承担不同贡赋义务，甸服日祭、荒服终王，畿服等差构成理想化之天下统御格局，多出于后人整理而非西周实制\n• 封疆与采邑：诸侯于封国之内再分封卿大夫采邑，层层封建以控边鄙，燕晋齐鲁诸国分踞四方以御戎狄，边地开发随分封而推进，疆域治理依托血缘网络而非官僚行政\n• 边患与军事戍守：商周与鬼方、羌方、土方、猃狁长期争战，甲骨文屡见登人三千、五千以伐某方之辞，王室于要地设戍、筑城以守。穆王征犬戎、宣王伐猃狁皆劳师无功，幽王时犬戎终破镐京，边患贯穿西周始终，边防失据成为西周覆亡最直接之原因，其患与国相终始", "18": "• 华夏与四夷：周人自称华夏而称四方之族为蛮夷戎狄，夷夏之辨以文化礼义而非血统分野，诸侯行夷礼则夷之、夷人进于中国则中国之，文化认同意识初萌，为后世民族观之源头\n• 方国与族际战争：商与鬼方羌方土方频战，武丁时期伐羌方用兵至万余人，战俘多沦为奴隶或用于殉祭；周亦长期与猃狁、荆楚、淮夷相攻。战争在掠夺人口与物资之同时带来族际接触，通婚、俘获与迁徙使各族交错杂居，华夏共同体在征伐与交往中渐次融合成形\n• 融合与文化扩展：周人分封齐鲁燕晋于边地，诸侯与当地夷狄杂处通婚，青铜礼器与农耕技术随封建向外扩散，华夏文化圈在政治扩张中逐步外延", "19": "• 鸣条与牧野之战：汤伐桀于鸣条、武王伐纣于牧野，皆以小克大、以一日之决战而定天下之归属。牧野之战纣发兵七十万而前徒倒戈，周以革车三百乘、虎贲三千人破之，战阵尚简而决于士气与人心向背，改朝易代以战争为杠杆，天命转移由此实现，兵民之向背决其胜负\n• 昭王南征与犬戎之祸：昭王南征荆楚丧六师于汉水，周室由盛转衰；穆王西征、宣王伐戎皆仅得小胜；幽王时犬戎破镐京而西周终。外患频仍与兵力耗竭相因，边防失据之教训深刻", "20": "• 玉石之路：商周玉器原料多来自西域和田，殷墟妇好墓玉料经鉴定出自新疆，玉石东输形成早期远程贸易通道，中原与西域之物质交往早在丝路开通前已存在，交流史远早于汉\n• 方国往来与技术传播：商周与周边方国通过贡赐、战争与迁徙相往来，青铜冶铸、车马与筑城技术向北方草原与长江流域扩散，四川三星堆、江西大洋洲出土青铜器既具地方风格又见中原影响，华夏文明圈在技术传播中渐次扩展，远及岭南与辽西，其迹具见于各地考古发现", "21": "• 甲骨文与金文记事：商代甲骨卜辞为现存最早之系统文字记录，内容涉祭祀、征伐、农事、天象、生育，一片之文少则数字多则百余字；西周金文铸于彝器以纪功烈、册命与诉讼，毛公鼎铭四百九十七字为最长。二者同属当时人记当时事之第一手史料，为商周史研究之直接依据\n• 史官制度：周设太史小史内史外史，掌记事、册命、天文历法与典籍，史官世守其职而直书其事，齐太史兄弟相继赴死以书崔杼弑君之例，开创中国史官记注与实录之传统\n• 尚书与诗经之史料价值：尚书存典谟训诰之文，诗经存商周史诗与农事歌谣，二书经后人整理而为先秦史研究之核心文献，诗可证史、史可释诗，诗史互证之传统自此开端", "22": "• 文字：甲骨文——契于龟甲兽骨之成熟文字体系，单字已逾四千、可识者千余，具备象形、指事、会意、形声诸法，汉字由此可考，为世界最古老文字之一。文字使政令、祭祀与历史得以记录传世，中华文明连续不断之文字载体由此奠定，亦为商史得以重建之唯一凭据\n• 冶金：青铜礼器——司母戊鼎重逾八百公斤，四羊方尊与曾侯尊盘形制奇丽，陶范合铸与分铸法并用，青铜文明标志国家权力与技术水平，为世界青铜时代之高峰代表\n• 天文历法：夏小正与殷历——夏小正载物候农时，殷历以干支纪日、置闰调节朔望，并记日月食与新星，天文历法服务于农事与祭祀，为传统历法体系之源头\n• 礼制：周公制礼作乐——确立吉凶宾军嘉五礼与乐舞制度，列鼎制度以器数定等级，礼乐文明塑造华夏文化性格，为儒家思想与东亚礼乐圈之共同源头\n• 文献：尚书与诗经——尚书为最早之政事文献汇编，诗经存西周至春秋诗歌三百余篇，二书开中国文献与文学传统，垂范后世两千年，为十三经之核心，亦为先秦史之渊薮"}}, {"id": "p2", "name": "春秋战国", "position": "大变革与大转型", "span": "前770—前221年", "sub": "（春秋：前770—前476年 / 战国：前475—前221年）", "feature": "春秋战国是大变革时代。平王东迁王室衰微，诸侯争霸，礼崩乐坏；铁犁牛耕推广催生私田，井田瓦解而土地私有渐立。各国变法图强，郡县制取代分封，官僚制取代世卿，法家主导改革，秦经商鞅变法骤强。思想上百家争鸣，儒墨道法诸子并起，奠定中国思想之轴心。此期由分裂走向统一，君主专制中央集权体制在各国变法中孕育成熟，前221年秦并六国，完成制度与疆域之双重一统。", "events": "• 春秋五霸迭兴：齐桓公尊王攘夷而九合诸侯，晋文公城濮败楚、楚庄王问鼎中原，霸主以会盟代行王政而周室名存实亡。争霸重塑列国格局，兼并加速而小国日蹙，为七雄并立铺路\n• 三家分晋与田氏代齐：前453年韩赵魏共灭智氏而分其地，前403年周威烈王正式命三家为诸侯；齐国田氏久专齐政，前386年田和列为诸侯而代姜氏有国。卿大夫以实力夺国、周王反而追认其位，说明宗法分封秩序已彻底崩解，战国七雄格局由此形成，周室之命徒为追认\n• 各国变法运动：魏文侯用李悝尽地力之教、楚悼王用吴起废公族疏远者、韩昭侯用申不害行术，变法由局部改良走向制度重构，中央集权体制在列国次第确立\n• 商鞅变法：前356年与前350年商鞅在秦两次变法，废井田开阡陌、奖励军功而定二十等爵、推行县制、什伍连坐、重农抑商、燔诗书而明法令，并徙木立信以取信于民。旧贵族以犯法难之而商鞅刑及公子虔、公孙贾，变法遂不可回。秦由是骤强于西陲，耕战体制成型，为并天下奠定制度与国力根基\n• 合纵连横：战国中期苏秦倡六国合纵以抗秦、张仪以连横事秦而破之，纵横家以利害说列国，外交与间谍并用，远交近攻之策渐为秦所常用，列国因相互猜忌而终被各个击破\n• 百家争鸣：士阶层崛起，儒墨道法名阴阳纵横农兵诸家并起，齐稷下学宫集其盛，各家著书立说、互相攻讦而相取，为中国思想史上最活跃之轴心时代，奠定此后两千年思想格局\n• 秦灭六国：前230至前221年秦王政以远交近攻、离间分化之策，次第灭韩、赵、魏、楚、燕、齐，王翦王贲父子主兵，十年之间并天下，六国之亡多缘自削其力而秦乘其敝。结束五百余年分裂，中国首次实现大一统，帝制时代自此开启，统一成为此后中国历史之主流与正统", "cells": {"3": "• 相与将分职：各国设相（相邦、令尹）总揽政务、将（大将军、上将军）主军事，文武分途而皆由王任免，不得世袭。相之位尊而权重，苏秦曾佩六国相印，秦则丞相与国尉分掌文武。世卿世禄由此被打破，官僚制初具规模，君主得以随时进退大臣，此制为秦汉丞相太尉之所本\n• 五官与内史：秦设内史掌京畿、少府掌王室财用、郎中令掌宿卫，各国置司徒司马司空司寇等职，职官依事务分设而非依血缘世守，体系渐趋专门化，为三公九卿制之直接前驱\n• 玺符之制：国君以玺印任官、虎符调兵，凡发兵五十人以上须合王符，任免与军权皆凭信物，官僚非世袭而由王意进退，君主专制之技术手段成熟，君臣关系由血缘依附转向权力授受\n• 秩禄之制：官僚酬劳由采邑改为谷物俸禄，以石定秩而按年发放，官之尊卑以秩级计而不以封地计，罢官则禄止。俸禄制使官职彻底脱离土地世袭，官僚成为领薪之王臣，为秦汉秩石制度所本", "4": "• 县之设：楚武王灭权而设县、秦武公伐邽冀戎而置县，县长官由国君直接任免、不得世袭，食禄而不食邑。县初设于新兼并之边地，其后推及内地，成为国君直辖之行政单位。封建采邑由此被逐步架空，官僚直辖取代贵族自治，中央集权之地方基础奠定，其制遂为秦汉所直承\n• 郡统县：郡初设于边地，因边地辽阔而分设数郡，郡守由王任命而统数县，位卑于县令而权重于内地。战国后期形成郡统县两级制，三晋与上郡、蜀郡皆然。边郡兼掌军政而内地县专理民政，地方行政层级由此确立，为秦行郡县之直接蓝本，秦汉因之而不改\n• 封君与采邑：各国仍有封君封邑，商君封于商、孟尝君封于薛、平原君封于东武城，然封君多不治民、不得世袭兵权，所食者不过其邑之租税，性质已异于西周诸侯国，为封建向郡县过渡之中间形态\n• 乡里什伍：县下设乡、里、聚，什伍编制民户以相纠察，基层行政组织严密化，国家权力首次直达编户齐民之身，控制深度远超封建时代，征赋、征兵与刑狱皆由此出\n• 上计制度：岁终县上计于郡、郡上计于国君，以户口、垦田、赋税、刑狱之数课其殿最，课殿者免、课最者赏。上计使中央得以数字考核地方长吏，官僚行政之考课体系由此成型", "5": "• 军功爵制：商鞅立二十等爵，按斩首之功授爵、赐田宅、予庶子，宗室非有军功不得属籍，虽富贵而不得为属籍者亦无爵秩。爵可累进亦可因罪夺，田宅依爵高下而差，兵民为爵位而战。世卿世禄被彻底否定，社会流动因战功而开，耕战合一之国家动员机制由此形成\n• 养士与荐举：战国四公子及吕不韦等养士数千，士以策论干谒自荐，朝秦暮楚而不以为耻，荐举与自荐并行，人才不依出身而依才能，官僚遴选由血缘标准转向能力标准\n• 客卿制度：秦广用客卿，商鞅、张仪、范雎、李斯皆以异国之士至将相，掌秦之枢要。选官突破国别与血缘界限，开放式用人成为秦统一之重要助力，郑国渠事起虽有逐客之议而终罢", "6": "• 御史之设：各国设御史掌记言记事兼纠察百官，赞书受事而监视群臣，监察职能渐从史官中分化独立，齐威王烹阿大夫而赏即墨大夫即其矫枉之举，为秦御史大夫之先声\n• 遣使巡察：国君遣亲信监县、察边，魏有监郡、秦有监御史之设，使者直禀于王而纠举不法，监察由临时遣使渐转为常设之官，为秦汉监御史与刺史之滥觞\n• 成文法公布：前536年郑子产铸刑书于鼎，叔向以民知争端将弃礼而征书责之；前513年晋赵鞅、荀寅铸刑鼎，孔子讥其失度。成文法由秘密转为公开并布之于民，贵族不得再任意裁断，司法由临事议罪转向依罪断罪，为李悝法经与秦汉律令开辟道路，二子之讥正见其变之深", "7": "• 法经与秦律：李悝撰法经六篇——盗、贼、囚、捕、杂、具，为第一部系统成文法典，以王者之政莫急于盗贼为纲。商鞅携之入秦，改法为律而增垦令、军爵诸篇，秦律由此严密。云梦睡虎地秦简所见田律、厩苑律、仓律诸条，事无巨细皆有法式，成文法典体系与律学传统自此发端，其篇目与体例为汉九章律所本\n• 严刑与连坐：商鞅行什伍连坐、告奸者赏同斩敌首，不告奸者腰斩、匿奸者与降敌同罚，弃灰于道者黥，轻罪重罚以禁奸止过。法律工具主义色彩浓厚，法家以刑去刑之理念主导立法实践，而秦政之苛酷亦由此为后世所诟", "8": "• 户籍之始：秦献公十年（前375）为户籍相伍，商鞅更令四境之内丈夫女子皆有名于上，生者著、死者削，民不得擅徙而逃亡者无所容。户籍载户主、妻妾、子女、田宅与奴隶，为赋役征发、兵员调集与身份控制之共同依据，编户齐民制度之雏形由此确立，秦汉遂承之不改\n• 什伍连坐：五家为伍、十家为什，相互纠察告奸，一人犯罪而什伍同坐，家有二男以上不分异者倍其赋。基层组织军事化，国家以连坐之法实现社会全面监控，秦制之苛酷处正在于此\n• 乡官里吏：乡设三老掌教化、啬夫掌赋税诉讼、游徼掌捕盗，里有里正、什有什长、伍有伍长，基层行政职官体系成型，国家权力经乡里直达民户，控制网络较封建时代严密数倍\n• 傅籍与徭役征发：男子年十七傅籍而始服役，岁为更卒、正卒一岁、戍卒一岁，凡傅籍者皆在征发之列，逃役者罚而匿者连坐，国家依户籍征发力役之制至此完备", "9": "• 初税亩与履亩而税：前594年鲁宣公行初税亩，按田亩之多少征税而不复分公田私田，公田之藉遂为履亩之税所代。前548年楚蒍掩书土田、量入修赋，郑子产作丘赋，各国相继以土地为征税对象。此举等于承认私田之合法，井田制加速瓦解而土地私有随之确立，为赋税制度之根本转折\n• 租赋役三分：各国按田征租、按户征赋、按丁征役，粟米之征、布缕之征、力役之征并行，赋税由力役地租向实物地租过渡，国家财政脱离井田之下的人身依附而建立在土地与户口之上\n• 重农抑商与徕民：商鞅奖励耕织、凡耕织致粟帛多者复其身，招徕三晋之民垦荒而给田宅、免三世之役，事末利及怠而贫者举以为收孥。赋役政策全然服务于耕战，农业劳动力为国家赋役之根本，农本思想由此制度化为国策", "10": "• 兵制变革：春秋以车战为主、国人当兵而野人不预，战则致师而卜，胜败决于一日；战国步卒骑兵兴起，兵员扩至数十万，长平之战秦坑赵卒四十余万可见其规模。战争目的由争盟主转为灭国夺地，战争形态由以礼节之的有限战转为歼灭战，国君以郡县征兵直接掌握兵源\n• 郡县征兵制：各国行郡县征兵，男子傅籍即服役，秦凡傅籍者皆有更卒、正卒、戍卒三役，征发严酷而刑徒亦编入行伍，兵农合一之制达到极致，国家军事动员能力达于前所未有的高度\n• 常备精兵：魏文侯以吴起练魏武卒，衣三属之甲、操十二石之弩、负矢五十个、日中而趋百里，中试者复其户、利其田宅；秦置锐士而荀子称其最为众强长久。各国皆以考选之法建精锐常备，兵之勇怯不再取决于族之大小而取决于训练与赏罚，此制为后世募选精兵之始\n• 兵器与战术革新：铁兵器取代青铜而铁剑铁矛广泛使用，弩机改良而强弓劲弩用于战阵，赵武灵王胡服骑射使骑兵成为独立兵种，城防攻守之术与云梯、地道皆精进，墨家更以守城之术著称", "11": "• 士阶层崛起：贵族降为士、庶人升为士，士以学识与权谋游说干政，孔子墨子皆出身非显而弟子遍天下，苏秦张仪以一布衣而操列国之权，布衣卿相之局形成。士无定主而择君而事，朝秦暮楚不为世人所责，社会阶层流动空前活跃，成为百家争鸣之社会基础\n• 地主与农民对立：土地私有使军功授田与买卖并行，军功地主与商人地主因之而起，以铁器牛耕与雇佣、租佃经营其地；自耕农力不足以自存则鬻田为佃，董仲舒所称富者田连阡陌、贫者无立锥之地即其后果。租佃剥削渐成主要形态，阶级对立由身份等级转向经济依附\n• 佃农与依附民：失去土地者或为佣耕、或为佃农而见税什五，或投豪强为宾客、庸客而脱于户籍，人身依附渐深而国家编户日削，此为战国末年各国共同之患\n• 官私奴隶：战国仍有大量官私奴隶，来源为战俘、罪犯及其家属，臣妾、胥靡、刑徒身份众多，亦可用于赏赐买卖，奴隶制残余与新兴租佃关系并存，社会结构呈过渡特征\n• 侠与刺客：专诸、豫让、聂政、荆轲之流以死报知己，轻生重义而犯禁，游侠之风盛于市井，墨家钜子之行即其渊源，汉以后任侠与豪强合流而终被禁绝，其风至汉而犹盛", "12": "• 儒家仁礼之学：孔子倡仁与礼，主张为政以德、克己复礼，以仁释礼而使其内在于人心，并首创私学、有教无类，弟子三千而身通六艺者七十二人。孟子道性善、倡仁政而发民贵君轻之论，荀子主隆礼重法而言性恶。儒家为政教伦理立说，经汉代独尊而成为此后两千年之正统思想\n• 道家自然无为：老子主道法自然、无为而无不为，祸福相因而辩证转化，其君人南面之术亦可为治国之用；庄子主齐物与逍遥，以庖丁解牛、曳尾涂中喻精神之自适，追求个体之精神超越\n• 墨家兼爱非攻：墨子倡兼爱、非攻、尚贤、节用、明鬼、尚同，代表小生产者之利益，其徒百八十人皆可使赴火蹈刃，且有钜子与严密的纪律组织，其名辩之学亦独树一帜，汉以后中绝而其精神入于侠\n• 法家法术势：商鞅重法而定赏罚、申不害重术而课群臣、慎到重势而尊君权，韩非集其大成，主张法术势三者结合、以法为教以吏为师，并言人性好利而不可用德化。法家为君主专制提供系统理论，其法布于众、刑无等级之说与贵族特权正相反对，遂成为秦治国之指导思想\n• 名家与阴阳家：名家惠施合同异、公孙龙离坚白，辩白马非马而极名实之辨，为中国古代逻辑学之高峰；阴阳家邹衍倡五德终始与大九州之说，以阴阳消长解释朝代更替，其说后被秦汉所采\n• 稷下学宫：齐设稷下学宫招致天下贤士，淳于髡、邹衍、田骈、慎到、环渊之徒七十六人皆赐列第为上大夫，不治而议论，各家并存切磋而相互吸收，战国末年的荀子与吕氏春秋已显综合之势", "13": "• 井田瓦解：铁犁牛耕使一家一户之力足以耕百亩，私田垦辟日广而民不肯尽力于公田，公田不治则藉法不行，井田制废弛。鲁宣公初税亩以履亩而税承认现实，晋作爰田、秦开阡陌皆顺势而为，土地制度遂由国有向私有发生彻底变革，其变至商鞅开阡陌而完成\n• 土地私有确立：前350年商鞅开阡陌封疆、允许土地买卖，军功授田与民间买卖并行，民得占田而可转让，土地私有制遂获法律认可。董仲舒所言秦用商鞅之法、改帝王之制、除井田、民得卖买即指此事。地主阶级之经济基础由此形成，此后两千年土地兼并问题之滥觞亦在于此\n• 国家授田制：各国按户籍授田于民而责其赋役，魏行尽地力之教、秦行辕田与授田，一夫百亩为常制，受田者不得自由迁徙而须力耕，国家授田与民间私有并存，呈国家干预与私有权并存之过渡形态\n• 兼并与贫富分化：土地可买可卖则兼并随之而起，富者连阡陌而贫者无立锥，孟子言今也制民之产仰不足以事父母，即战国土地集中之写照，贫富分化为各国共同之社会难题", "14": "• 私商崛起：工商食官格局被打破，范蠡三致千金而三散之、子贡结驷连骑以聘享诸侯、白圭乐观时变而人弃我取，富商大贾与诸侯分庭抗礼。白圭、猗顿以盐铁与畜牧致富，吕不韦以阳翟大贾而相秦，商业资本积累可观，商人阶层首次成为独立社会力量，商人之势遂不可抑\n• 城市与市：临淄七万户、邯郸、大梁、陶、宛等都会兴起，城内设市而市有市吏，市税与关税收入可观。城市由政治军事城堡向工商都会转化，陶以天下之中而富冠海内，区域经济联系因之加强\n• 重农抑商之始：商鞅令事末利及怠而贫者举以为收孥、重关市之赋以抑商人，荀子亦言工商众则国贫，农本商末思想首次化为制度。商业虽盛而政策受抑，此后两千年抑商传统由此开端", "15": "• 铁器与冶铸：春秋晚期已用人工冶铁，战国铁农具广泛使用于耒耜锸镰，铸铁柔化与渗碳制钢技术成熟，河北易县燕下都所出钢剑即为实证。铁器革命使深耕与大规模垦荒成为可能，农业与军事变革同获物质前提，生产力因之跃升，而冶铁作坊多为民营巨富所经营，其利尽归豪强\n• 青铜与漆器丝织：青铜器失蜡法与错金银工艺精进，曾侯乙尊盘玲珑剔透；楚地漆器轻巧彩绘而用途广泛；齐鲁丝织冠带衣履天下，长沙楚墓所出帛画与锦绣足证其精。手工业地域分工形成，官营与民营并行而民营渐盛\n• 考工记：成书于战国，记述攻木、攻金、攻皮、设色、刮摩、抟埴三十工种之工艺规范与制作标准，并载金有六齐之合金配比，为世界最早之手工业工艺学著作，反映手工业生产标准化与专业化之程度，亦为秦汉官营作坊所本，其匠人营国之制并及都城规划，其影响远及后世\n• 煮盐冶铁之利：齐有渠展之盐、燕有鱼盐枣栗之饶，猗顿以盐起、郭纵以铁冶成业与王者埒富，私营盐铁作坊规模宏大，手工业商品化倾向明显，而国家亦渐以盐铁之利为财源", "16": "• 四大货币体系：布币行于三晋两周、刀币行于齐燕、圜钱行于秦与周、蚁鼻钱行于楚，铜贝与金版（郢爰）亦并行于楚。货币形制依地域而异，刀布之别即农耕与渔猎经济之别，反映列国经济割据与区域贸易圈并存的格局，币制之统一遂有待于政治之统一\n• 铸币普及：各国铸币广泛流通，货币由称量转为计数，铸币权渐归国家而私铸受禁，货币经济深入民间，田宅奴隶皆可以钱计值，交换媒介之变革为商业繁荣提供技术条件\n• 秦圜钱与半两：秦行圜钱而钱文纪重，惠文王二年初行钱，后定半两为制，圆形方孔之形制由此奠定，为秦汉统一币制之形制基础，币制由多元走向统一之趋势已现", "17": "• 边郡与长城：秦昭王筑长城拒胡而置陇西、北地、上郡；赵武灵王破林胡楼烦而置云中、雁门、代郡，燕将秦开却东胡而置上谷、渔阳、右北平、辽西、辽东。边地设郡与筑城守塞并行，又移民实边以充之，边疆由军事防御与民政管辖兼治，郡县制遂率先推行于边地，其制为秦汉所因\n• 巴蜀与南土开发：前316年秦并巴蜀而置蜀郡、巴郡，李冰为蜀守而开都江堰；楚经营江南与百越，吴起南平百越而有洞庭、苍梧之地。边疆开发加速，华夏文化圈向南向西扩展，多民族国家之疆域基础在列国扩张中奠定\n• 胡地经营与骑射：赵武灵王胡服骑射，易胡服、习骑射而拓地至榆中，又收编林胡楼烦之众以为骑兵，边地之俗与中原之制因之交融，为中原驭胡之策开一新途", "18": "• 华夏认同强化：尊王攘夷与诸夏会盟强化华夏共同体意识，管仲言戎狄豺狼不可厌也、诸夏亲昵不可弃也，齐桓公存邢救卫而诸侯归之。夷夏之辨由血缘转向文化，杞用夷礼则夷之，楚自认蛮夷而后进于中国，文化认同成为民族凝聚之核心，为秦汉统一之精神基础，其力过于同宗\n• 民族融合加速：戎狄蛮夷与诸夏通婚杂居，晋献公娶骊姬、周襄王娶狄后，中山国为白狄所建而华化日深，其器物流行中原风格。赵武灵王胡服骑射主动吸收胡俗，融合在战争与交往中双向推进\n• 匈奴与东胡崛起：北方草原匈奴、东胡、林胡、楼烦渐强，与燕赵秦频战，头曼单于时匈奴已为秦之北患，始皇使蒙恬却之。游牧与农耕文明之对峙格局形成，此后两千年中原王朝之北方边患由此开端", "19": "• 争霸战争：春秋城濮、邲、鄢陵之战以争盟主为务，战则致师、不鼓不成列、不重伤不禽二毛，规模有限而重礼尚谋，胜国不灭其祀而仅服之。争霸维持列国均势，战争仍受旧礼约束，此风至战国而尽弃，旧礼之约束自此瓦解\n• 桂陵与马陵之战：前354年齐用孙膑围魏救赵而败魏于桂陵，前341年再以减灶诱敌败魏于马陵，庞涓死而魏武卒尽。魏之霸业由此衰落，齐秦东西并强，孙膑之谋略为后世兵家所宗\n• 长平之战：前260年秦赵相持于长平，秦用反间使赵以赵括代廉颇，白起佯败而断赵军粮道，困赵卒四十六日，降者四十余万尽坑之。赵国元气大伤而山东六国再无独力抗秦之国，战国均势就此倾覆，秦统一之势遂不可逆转，此役亦为先秦规模最大最惨烈之歼灭战\n• 秦灭六国之战：前230年灭韩、前228年灭赵、前225年灭魏、前223年灭楚、前222年灭燕、前221年灭齐，王翦王贲父子主兵，秦以远交近攻、离间六国君臣之策，十年之间并天下，楚地最大而王翦请兵六十万，坚壁不出、乘其引退而击破之。中国首次完成政治与疆域之大一统，分裂五百余年之局至此终结，帝制时代由此开启", "20": "• 与周边族群的交流：中原与匈奴、东胡、百越、西南夷通过战争、贸易与迁徙相往来，丝绸、漆器、铁器与铜镜外传而马匹、皮毛、玉石内输，赵武灵王胡服、楚地越式鼎皆其证。物质文化交流在冲突中推进，中原与周边经济互补之格局由此形成，其利虽在互市而其患常在边鄙，其效深远\n• 域外交通萌芽：公元前数世纪中原与中亚、印度已有间接联系，楚地所出蜻蜓眼玻璃珠含钠钙成分近于西亚，阿尔泰巴泽雷克墓葬出土战国丝织品与山字纹镜，中西交流早于丝路之正式开通", "21": "• 春秋与左传：孔子据鲁史作春秋，上起隐公元年下讫哀公十四年，寓褒贬于叙事而一字之贬严于斧钺，开编年史与春秋笔法之先河；左传详述春秋二百余年史事，长于叙战与行人辞令，晋楚城濮、秦晋殽之战皆赖之以传，编年体至此成熟，二书遂为经史兼摄之典\n• 国语与战国策：国语分国记言，周鲁齐晋郑楚吴越八语并陈，为国别史之始；战国策记纵横家游说之辞，铺张扬厉而辩丽恣肆，苏秦张仪之口辩赖此以存。二书保存大量先秦政治外交史料，文献价值极高\n• 竹书纪年：西晋汲郡魏襄王墓出土之魏国编年史，记事起于夏而终于魏襄王二十年，其舜囚尧、伊尹放太甲诸条多与传世文献相异，可正史记之误而补其阙。出土文献与传世文献之互证由此开端，为先秦史研究之重要补充，其书虽亡于宋而辑本犹存\n• 世本与谱牒之学：世本记帝王诸侯卿大夫之世系，兼及居篇、作篇、氏姓篇，记制作之起源如仓颉作书、容成造历，谱牒之学由此发端，亦为史记世表与世家之所本", "22": "• 农业：铁犁牛耕——铁农具与牛耕推广，深耕易耨而产量倍增，一夫挟五口治田百亩成为可能，小农经济由此确立并为百家争鸣提供物质基础，其法为后世农书所祖\n• 工程：都江堰（李冰，约前256）——于岷江出山处凿离堆、开宝瓶口，以鱼嘴分水、飞沙堰泄洪排沙，无坝引水而自流灌溉成都平原，化水患为水利，成都平原遂成天府之国，灌区历代扩建而两千余年仍在使用，为无坝引水工程之典范，其深淘滩低作堰之诀至今犹存\n• 工程：郑国渠（前246）——韩遣水工郑国入秦说秦凿泾水以疲之，渠成引泾水灌关中四万余顷，亩收一钟而关中为沃野无凶年，反为秦统一提供粮秣支撑，亦为关中水利之始\n• 科技：考工记——记述三十工种之工艺规范与金有六齐之合金配比，并及车制、弓制与都城营国之制，为世界最早之手工业工艺学著作，反映标准化生产水平与科技实证精神\n• 天文：甘石星经——甘德著天文星占、石申著天文，合称甘石星经，测定恒星百余座与行星运行周期，并记日食月食与彗星，为世界最早之星表之一，其测候之精度为后世所宗\n• 医学：黄帝内经（成书于战国至汉，存疑）——奠定中医藏象、经络、病因病机与阴阳五行理论，确立辨证施治与治未病之原则，中医理论体系之奠基之作，其说至今仍为医家所本\n• 思想：百家争鸣——儒墨道法名阴阳纵横诸子并起，著述宏富而成思想之轴心，其所论之天人、名实、义利、王霸诸题确立了中国学术之基本范畴，塑造此后两千年中国文化之性格，为世界文明轴心时代之重要组成部分，诸子相攻亦相取，其说至今不绝，其泽被于东亚\n• 文学：诗经与楚辞——诗经三百零五篇为现实主义之源，屈原以离骚、九歌开浪漫主义先河，风骚并称，中国文学两大传统于此确立，垂范后世两千年而不衰"}}, {"id": "p3", "name": "秦汉", "position": "统一帝国的确立与巩固", "span": "前221—220年", "sub": "（秦：前221—前207年 / 西汉：前202—8年 / 东汉：25—220年）", "feature": "秦汉奠定中国两千年帝制格局。秦废分封行郡县，书同文车同轨，确立中央集权帝制；汉承秦制而损益，郡国并行终归于一统，武帝外攘四夷内强集权，儒术定于一尊。经济上重农抑商与官营并行，丝路开通连通世界贸易；社会豪强渐起，编户齐民为本。此期制度框架、文化主轴与民族格局基本定型，汉族之名、儒家之统、郡县之制皆自此确立，影响直至近世。", "events": "• 秦灭六国与帝制确立：前230至前221年秦相继攻灭韩赵魏楚燕齐，结束数百年割据，嬴政称始皇帝，创皇帝制度，立三公九卿，废分封行郡县，统一文字度量衡与车轨。大一统中央集权帝制由此奠定，此后王朝皆以统一为正统。\n• 秦末民变与楚汉相争：秦法苛急、徭戍无度，陈胜吴广于大泽乡揭竿首倡，郡县蜂起；继而刘项相争，垓下一役项羽兵败自刎，刘邦称帝建汉。布衣将相之局首次出现，血缘贵族政治就此终结，开汉代布衣卿相政权之先例。\n• 文景之治与汉武集权：汉初承残破之局，文景轻徭薄赋、除肉刑、与民休息，府库渐盈；武帝即位后行推恩令削藩，置盐铁官营，北击匈奴，又独尊儒术。中央集权体制至此完备，外儒内法治国模式成型，影响后世历代王朝。\n• 新莽代汉与光武中兴：外戚王莽篡汉建新朝，托古改制行王田私属之禁，纷乱反致天下大乱，绿林赤眉继起；刘秀重建汉室，史称光武中兴，偃武修文而与民休息。改制失败证明复古不可行，东汉豪强坐大埋下分裂之隐患。\n• 东汉衰朽与黄巾之乱：东汉中后期外戚宦官交替专权，党锢之祸摧折士人，卖官鬻爵败坏吏治；张角以太平道发动黄巾起义，朝廷倚重州牧镇压，割据之势遂成。中央集权名存实亡，州牧豪强拥兵自重，三国分立由此开启。", "cells": {"3": "• 三公九卿之制：秦置丞相总领百官、太尉掌武事、御史大夫掌图籍监察，合称三公，九卿分掌宗庙财政诸务，皆直辖于皇帝。完整的中央官僚体系首次建立，为后世两千年中央官制奠定基本框架。\n• 内朝决策之立：武帝任用尚书、侍中等近臣组成中朝参决机要，以丞相为首的外朝渐沦为执行机构，相权被明显架空。君主借身边近臣侵削相权，开后世君主分割相权之常法，皇权与相权之张力由此贯穿整个帝制时代。\n• 尚书台之崛起：东汉光武帝以尚书台总揽章奏政务，三公徒拥虚名，实务尽归台阁，尚书令权重一时。中枢权力自三公移向皇帝近侍机构，成为魏晋尚书省与隋唐三省六部制演进之关键环节，中枢近臣化由此发端。", "4": "• 郡县制之确立：秦废分封，初分天下为三十六郡，郡守县令由皇帝直接任免、不得世袭，政令自朝廷直达闾里。中央直辖地方的行政体系由此确立，取代封建世袭自治，成为此后两千年地方建制的总体框架。\n• 郡国并行与推恩令：汉初封异姓诸侯旋加翦除，继封同姓王以屏藩皇室，终酿七国之乱；武帝采主父偃之议行推恩令，令诸侯分封子弟为侯，王国析小而名存实亡。分封残余就此清除，诸侯唯食租税不治民，中央集权终获巩固。\n• 州部监察与三级之变：武帝分全国为十三州部置刺史，本为监察之区；东汉末改刺史为州牧，州遂由监察区演变为郡以上行政区，地方成州郡县三级。行政层级增多而效率下降，州牧拥兵坐大，成为汉末割据之制度根源。", "5": "• 军功爵制：秦按斩首军功授予爵位田宅，废世卿世禄之制，斩一首者赐爵一级，平民可凭战功入仕拜爵，吏道出于刀笔弓马。社会流动因军功而大开，耕战体制由此确立，秦之骤强骤亡皆与此制相关。\n• 察举与征辟之制：汉令郡国岁举孝廉茂才，皇帝特诏征召名士，公府州郡辟除掾属；武帝立太学，博士弟子课试补官，儒生入仕之途大开。选官以德行学识为标准，儒学与利禄相结合，文官政治之基础由此奠定。\n• 任子与赀选之途：二千石官任职满三年可保举子弟一人为郎，称任子；家赀达到数额者可纳赀为郎，称赀选。二者与察举并行，官僚子弟与富室由此得径直入仕，寒门进身之途相对狭窄，为东汉豪族累世为官埋下伏笔。\n• 豪族把持察举：东汉察举重门第声望，举主与被举者互结恩私，累世公卿格局形成，汝南袁氏四世三公；寒俊进身无门，品评人物之风盛行。选官标准由才德转向门第，士族政治初见雏形，成为魏晋门阀政治之先声。", "6": "• 御史监郡之制：秦以御史大夫为副相纠察百官，各郡遣监御史驻守监察，中央与地方双层监察网络初步铺开。独立的监察系统由此确立，为汉代司直、司隶校尉与刺史制度之源头，后世御史台制度亦导源于此。\n• 刺史六条问事：武帝分全国为十三州部，每部置刺史一人，依六条问事，专察郡国守相与强宗豪右，秩仅六百石而能监二千石。以卑临尊使监察有效制衡地方，成为后世监察制度之重要借鉴，以小监大之术由此确立。\n• 刺史权重之变：东汉刺史权限渐宽，渐及行政民政，灵帝时改称州牧，总揽一州军政大权，刘表袁绍之流各据一方。监察区转化为行政区，地方失控之势由此形成，成为汉末分裂割据的重要制度根源。", "7": "• 秦律之严苛：秦法本于商鞅，繁密严酷，什伍连坐，轻罪重罚，徒刑名目繁多，刑徒遍布工程边戍，时人称赭衣塞路、囹圄成市。民畏法而国力强，然积怨更深，陈胜振臂一呼而天下响应，严刑峻法成为秦亡之重要原因。\n• 约法三章与九章律：刘邦入关与父老约法三章，尽除秦苛法以收人心；萧何摭拾秦法制定九章律，增户律兴律厩律诸篇，汉律章程由此奠定。承秦制而删其苛，宽严相济，成为后世历代律典修撰之蓝本。\n• 春秋决狱：董仲舒倡导以春秋经义断狱，原心定罪，动机善恶重于行为后果，儒生遂得操持刑名之权。儒家伦理渗入司法审判，引礼入法由此发端，开启礼法融合之漫长进程，成为中华法系之思想源头。", "8": "• 自实田宅与什伍连坐：秦令民自报田宅户口，隐匿者受罚，又行什伍编制、连坐相纠，户籍遂为赋役征发与兵源调拨之根据。国家首次系统掌握全国人口与土地数字，编户制度由此确立，成为历代户籍管理之常制。\n• 编户齐民之制：西汉民皆著籍，籍载人口田宅年龄，官府据以征收租赋、征发徭役兵役，乡里组织负责查验督课。平民摆脱贵族私属身份而直隶于国家，成为帝国赋役兵源之基本承担者，个体小农经济支撑帝国财政。\n• 乡亭三老之制：秦汉县下置乡，乡设三老掌教化、啬夫掌听讼收税、游徼掌巡逻禁盗，十里一亭、十亭一乡，刘邦即起家亭长。乡官体系将国家权力延伸至村落，教化行政治安合一，成为后世乡里制度之雏形。", "9": "• 秦赋役之酷：秦田租口赋之外，成年男子须服正卒戍卒更卒诸役，修长城、戍五岭、营建骊山陵，征发无度而民不堪命。赋役重压成为秦末民变之直接导火索，为汉初轻徭薄赋政策提供反面教训，暴政虐民终致覆亡。\n• 轻徭薄赋与算赋口赋：汉初行十五税一，文帝降为三十税一，算赋口赋按人头征收，正卒戍卒更卒之役轮番而相对轻简。民力得以休养生息，文景之治的物质基础由此奠定，编户齐民安居乐业而垦田日广。\n• 盐铁官营与均输平准：武帝因对匈奴用兵财用匮乏，行盐铁官营与酒榷，设均输平准调剂运输物价，以桑弘羊主其事。国家垄断山林川泽之利，府库充盈而商贾受抑，官营专卖制度由此开创，国与民争利之争端长期延续。\n• 算缗告缗之令：武帝令商人自报资产纳缗钱，车船奴婢皆计税，又颁告缗令鼓励举告隐匿，违令者财产没官、告发者分其半。中产以上商贾大抵破产，国库充盈，然民间蓄积受挫，流通顿衰，国家与民争利之局由此大开。", "10": "• 征兵更戍之制：秦汉男子傅籍之后，须服正卒一年、戍卒屯戍边地，另有更卒每年一月役于本郡县，兵农合一、轮番更代。耕战结合使兵源广大而军费低廉，然戍边转输劳苦民力，闾左戍卒之怨由此积成大变之因。\n• 南北军之制：汉代京师驻军分南军北军，南军由卫尉统之宿卫宫城，北军由中尉统之拱卫京师，武帝又增期门军羽林军，选六郡良家子充任。禁卫兵力分统而互相牵制，兵柄集中于皇帝，京师环卫之制由此确立。\n• 募兵之渐：武帝置八校尉，募知兵之人充任，又有屯兵戍卒久驻边地，渐罢征发而募兵代兴，兵与农分离。职业化军队战力增强而供养费用日重，东汉以降募兵屯兵并行，兵制演变由此开启新的方向。", "11": "• 四民与奴婢之等：秦汉社会士农工商四民分业，各有著籍，奴婢列为贱口，附属于主人而不入编户。身份等级秩序分明，奴婢问题贯穿两汉，董仲舒、王莽皆有解放奴婢之议，然贱口之制终汉不改，成为两汉持续之社会难题。\n• 豪强兼并与民变：富者田连阡陌、贫者无立锥之地，土地兼并成为两汉顽疾，师丹限田、王莽王田、光武度田诸策皆告失败。豪强役使贫民、荫庇户口，无路之民相继起事，绿林赤眉与黄巾皆由此酝酿，周期性社会危机由此定型。\n• 布衣卿相与豪族之兴：汉初布衣将相执掌朝政，此后军功地主让位于经学世家，累世经学、累世公卿之家勃兴。社会上层由流动趋于固化，士人凭经学结成门第，豪族地主与皇权共治之势渐显，成为魏晋门阀政治之胚胎。", "12": "• 焚书坑儒与以吏为师：秦始皇纳李斯之议焚毁民间诗书百家语，唯医药卜筮种树之书得存，又坑杀方士儒生于咸阳，令学者以吏为师。法家学说定于一尊而学术遭禁锢，思想专制激化士人离心，成为秦失人心之重要原因。\n• 黄老之学与无为而治：汉初君臣惩秦之败，尊奉黄老之学，清静无为、省刑薄赋、不扰农时，曹参以清静治齐相汉遂成典范。无为而治契合战后休养之需，促成文景之治，然难应集权扩张之要求，思想转折终由此完成。\n• 罢黜百家与独尊儒术：武帝采董仲舒对策，罢黜百家、表章六经，立五经博士与博士弟子员，以儒术取士，经学遂为利禄之途。儒学由诸子之一跃升为国家意识形态，两千年思想主轴由此确立，经学章句之繁琐亦随之而生。\n• 谶纬盛行与佛教东传：东汉以谶纬附会经义，光武帝以图谶断决疑事，儒学染上神学色彩；明帝永平年间遣使西域求法，佛教传入中土，洛阳首建白马寺。儒学神学化而理性稍衰，异域宗教入华，思想多元之局由此开启。", "13": "• 名田制之立：秦按军功爵级授予田宅，明定尊卑爵秩等级，土地私有制获得法律承认，民间得买卖田地。授田与私有并行，小农经济与地主经济同时成长，土地兼并之门亦由此开启，为两汉田制问题种下远因。\n• 限田之议与兼并：西汉土地买卖频繁，富室豪强竞相兼并，富者田连阡陌而贫者无立锥之地；哀帝时师丹孔光拟限田限奴婢，以贵戚反对而搁置。国家干预屡告失败，兼并之势不可遏止，成为两汉社会危机之总根源。\n• 王莽王田之制：王莽托古改制，宣布天下田曰王田、奴婢曰私属，皆不得买卖，一家男丁不满八口而田逾一井者分余田予宗族邻里。改制触怒豪强、扰害小民，三年而罢，复古理想彻底破产，土地私有不可逆转之势由此印证。\n• 代田法之推行：武帝末赵过为搜粟都尉，推行代田法，一亩三甽，播种于甽而苗生后以垄土培根，岁代处而地力可复。关中公田与边郡屯田先行试验，所收常过缦田一斛以上，亩产提高，精耕细作技术体系由此充实。\n• 区种法之创：成帝时氾胜之督三辅种麦，著氾胜之书，载区田之法：划地为区、深掘加肥、等距密植，集中用水用肥，瘠田山地亦可获丰收。集约经营之术由此确立，与小农精耕传统相合，后世代田区田并称，农学经验赖此传世。", "14": "• 重农抑商之政：秦徙天下豪富十二万户于咸阳，商人另立市籍，不得衣丝乘车，徭役谪戍先发贾人，抑商作为国策确立。商人社会地位受制度贬抑，农商之别森严，商业资本被迫转向土地，重本抑末之政由此定型。\n• 弛山泽之禁与五都：汉初惠帝高后时弛禁，开关梁、弛山泽之禁，富商大贾周流天下；设洛阳邯郸临淄宛成都五都，为区域商业中心。商品经济随之活跃，城市商业网络形成，为丝绸之路贸易奠定国内市场基础。\n• 盐铁官营与商贾受抑：武帝盐铁酒榷与均输平准垄断大宗利源，商人资本受排挤，私营空间收窄；告缗后商贾中家以上破产。官营压制私营之格局形成，民间商业活力受抑，官商消长成为两千年经济政策之长期议题。", "15": "• 冶铁与炒钢之技：西汉冶铁官营，铁犁牛耕推广至边郡，炒钢与百炼钢技术相继出现，铁农具与铁兵器全面普及，冶铁规模宏大。冶铁技术领先世界，农战之利皆赖铁器，为帝国强盛奠定物质基础。\n• 丝织业之盛：临淄与襄邑设服官，长安织室规模宏大，素纱禅衣轻薄如云，锦缎纹样精美，丝帛行销西域中亚。丝织为国家财源与外销大宗，纺织技艺冠绝东亚，丝绸之国之名由此传扬，外销成为外贸大宗。\n• 蔡伦改进造纸：东汉和帝元兴元年，尚方令蔡伦总结前人经验，以树皮麻头敝布鱼网捣浆抄纸，纸质轻薄廉价，进呈后天下通行，谓之蔡侯纸。书写材料由简帛转向纸张，知识传播成本大降，文教普及与世界文明进程皆受其惠。", "16": "• 半两钱之统一：秦废六国异形币，行圆形方孔半两钱，货币形制、重量、文字归于统一，钱重如其文。币制统一与政治统一同步完成，外圆内方形制沿用两千余年，成为中华货币之标准形制。\n• 皮币白金之造：武帝元狩年间以白鹿皮方尺缘饰为皮币，值四十万钱，强令王侯宗室朝觐必以皮币荐璧；又铸银锡为白金三品，皆虚值大钱。意在敛富商之财而民不乐用，盗铸蜂起，币制紊乱，由此反证五铢钱制之良善。\n• 五铢钱之定制：武帝元狩五年始铸五铢钱，重如其文、轻重适宜，又置水衡都尉属官上林三官专铸，郡国铸币之权收归中央。五铢钱制作精整、信用稳固，行用七百余年直至隋代，成为中国古代最成功之钱币。", "17": "• 南平百越与北筑长城：秦南抚百越，置桂林南海象郡，开凿灵渠以通粮道，又遣蒙恬北逐匈奴、连接秦赵燕旧城筑万里长城。岭南首次纳入郡县版图，农耕游牧分界线由此划定，多民族国家疆域格局奠定。\n• 河西四郡与西域都护：汉武帝于河西走廊置武威张掖酒泉敦煌四郡，隔绝匈奴与羌人；宣帝神爵二年设西域都护府，治乌垒城，统领西域南北两道。中央政权自此直辖西域，丝路交通由此获得制度保障。\n• 西南夷与东南之治：武帝平南越东瓯闽越，通夜郎滇国置犍为牂柯越巂诸郡，西南夷地区渐次纳入郡县体系，东北置玄菟乐浪等四郡。郡县制推广至四方边地，边疆各族与华夏交融加深，统一多民族国家格局由此形成。", "18": "• 汉匈和战之变：汉初国力凋敝，以和亲岁奉羁縻匈奴；武帝时国用丰饶，遣卫青霍去病数次大规模出击，漠北一役匈奴远遁，漠南无王庭。汉匈关系由守转攻，和战交替成为此后历代边疆政策之基本模式。\n• 昭君出塞：竟宁元年呼韩邪单于入朝，自请为汉婿，元帝以宫人王嫱赐之，号宁胡阏氏，此后边城晏闭、牛马布野数十年。和亲由被迫屈辱转为主动怀柔，成为处理民族关系之重要方式，为边疆安定提供和平范例。\n• 诸族内迁与融合：匈奴分化而南单于附汉入塞，羌人内迁关中，越人徙于江淮，各族与汉人错居杂处、互通婚俗。华夏认同随交往加深，汉族以融合而成之名渐固，多元一体格局由此奠基，统一多民族国家结构趋于成熟。", "19": "• 秦并六国之役：秦用王翦王贲诸将，远交近攻、各个击破，十年之间韩赵魏楚燕齐相继覆灭，海内归于统一，六国贵族政治就此闭幕。皇帝制度与郡县体制随之确立，战国割据之局终结，统一成为此后政治之正统目标。\n• 楚汉战争：项羽分封十八诸侯引发纷争，刘邦还定三秦，经彭城之败、荥成相持，垓下一役四面楚歌，项羽自刎乌江，刘邦即皇帝位。五年相争以汉胜楚亡告终，布衣天子由此产生，分封与郡县并存之汉初格局开启。\n• 汉匈漠北之战：前119年武帝令卫青霍去病各将五万骑深入漠北，霍去病封狼居胥山，匈奴远遁而漠南无王庭。汉初以来匈奴之患基本解除，然海内虚耗、户口减半，扩张之役亦由此埋下财政危机之伏笔。\n• 汉武帝四夷之略：平南越、定东瓯闽越，灭卫氏朝鲜置四郡，通西南夷置郡县，开河西而通西域，兵锋所指、郡县随之。汉朝疆域远超秦代，华夏政治圈层扩展，多民族国家之规模由此奠定，声教远被于四裔。", "20": "• 张骞凿空西域：武帝时张骞两度奉使西行，联络大月氏乌孙以断匈奴右臂，历经拘扣险阻，遍历大宛康居大夏，得闻西域诸国风土。中原与中亚交通自此开通，史称凿空，丝路贸易与文明交流由此开启，物产技术双向传播。\n• 甘英使大秦与班超经营：明帝时班超出使西域，经营三十余年，官至西域都护；和帝永元九年甘英奉命出使大秦，抵条支临大海欲渡而还，所记风土远及西亚。汉人对西方认知达到当时极限，中西交往之线由此延续未绝。\n• 倭奴金印之赐：光武帝建武中元二年，倭奴国遣使奉贡朝贺，光武赐以印绶，汉委奴国王金印于日本出土可证，此后东海海上交往渐开。中日官方往来见载于史册，汉文化东传之端由此开启，东亚交流网络初步形成。", "21": "• 史记之创体：司马迁忍辱发愤，撰成中国第一部纪传体通史，上起黄帝下讫当代，本纪表书世家列传五体具备，究天人之际、通古今之变。纪传体由此成为正史标准体裁，史学独立意识确立，后世誉之为史家之绝唱。\n• 汉书之断代：班固继承父业撰汉书，起高祖终王莽，包举一代，十志详载典章制度，为第一部纪传体断代史。断代为史适应王朝更迭之需，后世正史皆奉为准则，官方修史之传统由此强化。\n• 七略与今古文之争：成帝时诏刘向校理群书，刘歆续成七略，总群书为六大类，为中国第一部目录学著作；又倡立古文经，与今文经学相争不下。文献整理与经学分派并进，目录校雠成为治学门径，学术分野影响深远。", "22": "• 造纸术：蔡伦改进造纸——元兴元年尚方令蔡伦以树皮麻头敝布鱼网捣浆抄纸，纸质轻廉，代简帛而行，人称蔡侯纸。书写载体成本骤降，文籍流布大易，文教下逮民间，造纸术后经西域传向世界，成为推动文明传播之巨制。\n• 九章算术：数学体系成型——成书于东汉，集方田粟米衰分少广商功均输盈不足方程勾股九章，详载分数运算、比例分配、开方与正负数运算，联立方程解法领先世界。古代数学体系由此确立，田亩赋税工程测算皆有法可循。\n• 纪传史学：史记汉书双璧——史记为纪传通史之祖，汉书为断代史之首，一究天人古今之变，一包举一代典章，叙事严谨、文质相称。二书垂为正史典范，廿四史体例由此定型，中国古代史学之独立地位由此确立。\n• 工程大成：长城驰道灵渠——万里长城连接燕赵秦旧塞控扼北边，驰道直道以咸阳为心通达郡国，灵渠沟通湘漓二水济岭南通漕。三大工程控边畅轴通漕各显其用，帝国之筋骨由此坚密，大规模劳动组织能力亦由此彰显。\n• 汉赋乐府：辞章之乐并兴——司马相如子虚上林铺张扬厉、极骋辞之能事，乐府机构采民间歌谣配乐而歌，孔雀东南飞等叙事长篇亦兴。辞赋存帝国气象，乐府存里巷风情，雅俗文学由此并存互渗，文学体裁之疆域大为拓展。\n• 地动浑仪：天文器械创制——张衡造候风地动仪，八个方位龙口含铜丸，地震则丸落铜蟾蜍之口，验之准确；又制浑天仪以水力转动模拟天象。观测仪器由此开创先例，天学实测之术精进，堪称当时世界科技之冠冕。"}}, {"id": "p4", "name": "三国两晋南北朝", "position": "大分裂与大融合", "span": "220—589年", "sub": "（三国：220—280年 / 西晋：266—316年 / 东晋十六国：317—420年 / 南北朝：420—589年）", "feature": "三国两晋南北朝是大分裂与大融合时期。东汉崩解后魏蜀吴鼎立，西晋短暂统一旋即陷于八王之乱与永嘉之乱，晋室南渡而北方十六国迭兴，终由北魏统一北方，与南朝长期对峙。此期政权更迭频繁而战乱相循，然民族融合空前深入，北方少数民族汉化与汉族胡化双向进行；士族门阀政治盛极而衰；江南经济首次大规模开发；儒玄佛道多元思想并存，佛教广泛传播；九品中正、均田制、府兵制等制度创新为隋唐盛世奠基。分裂中孕育着新的统一因素。", "events": "• 三国鼎立之局：220年曹丕代汉称帝建魏，刘备继立蜀汉，孙权后称帝于吴，魏蜀吴三分疆宇，各据一方而制度竞争并进。中原一统之局就此终结，南北对峙与区域开发并行，分裂中孕育再统一之因素，影响绵延至隋唐。\n• 司马氏代魏：司马懿发动高平陵之变诛曹爽而夺中枢，其子司马师司马昭相继秉政，专权弑君，司马炎终受魏禅建立晋朝。禅代以宫廷政变之形完成，曹魏权臣柄政之局移植于晋室，门阀政治由此开局。\n• 西晋灭吴与短暂统一：太康元年王濬率益州楼船东下，铁锁横江不攻自破，吴主孙皓出降，三分归一。晋颁占田课田与户调之式，偃武修文，太康间户口滋殖，史称太康之治。然惩魏氏孤立而大封宗室，任诸王典兵出镇，统一根基未固，武帝身没而八王之乱继起，短暂一统旋为永嘉之祸所乘，盛业如昙花一现，分裂格局自此定型。\n• 永嘉之乱与西晋亡：晋室诸王内讧耗竭国力，匈奴刘渊举兵建汉，其子刘聪攻陷洛阳、俘虏怀帝，晋愍帝出降于长安，西晋覆灭。中原士民大规模南渡，北方陷于五胡十六国之纷争，华夏政治重心南移之端由此开启。\n• 淝水战后南北均势：苻坚统一北方后大举南侵，兵败淝水，前秦土崩瓦解，北方重陷分裂；东晋乘势北进，江南转危为安。南北均势由此再延百余年，胡族政权转向内部整合，为北魏统一北方预留空间，均势之局赖此维系。\n• 侯景之乱与梁衰：东魏降将侯景举兵叛梁，攻陷台城，梁武帝忧愤而死于台城，建康与三吴惨遭焚掠，士族聚居之地荡然残破。江南经济文化中心受创至深，南朝实力一蹶不振，南北均势逆转，六朝繁华由此走向衰落。", "cells": {"3": "• 中书省之设：曹魏置中书省，以中书监令典掌机密诏命，草诏之权自尚书移于中书，皇帝近臣居于决策之枢。中书监令位卑权重，中枢决策机制由此重构，三省分权体制之先例由此开启。\n• 尚书省之定型：魏晋尚书台改称尚书省，总领行政中枢，下统诸曹郎分曹理事，南朝诸省并立而尚书居执行之要。行政中枢机构层级化、部门化，六部之雏形由此肇端，隋唐三省六部制之骨架初步形成。\n• 录尚书事与门阀柄政：东晋士族首领以录尚书事总揽朝纲，王导以丞相当国，朝野倚重，庾亮桓温相继执政，皇权拱手而士族主政。门阀与皇权共治之格局确立，君臣之界因之模糊，门阀政治成为此期中枢政治之最大特色。\n• 门下省之兴起：侍中职掌由宫内傧赞渐转为审议诏令，封驳谏诤之权渐重，与中书尚书并立而相互制衡。三省鼎立之势初步具备，决策审议执行之分工日明，中枢体制趋向分权制衡，为隋唐三省体制奠定基础。", "4": "• 侨州郡县之置：永嘉之后中原流民南徙，东晋于江南侨立州郡县以安置流人，保持其原籍名号，侨人免纳调役。政区名实错乱、版籍混淆，土著侨民之别酿成赋役不均，土断之政由是屡兴，行政制度因乱而生变，影响深远。\n• 土断之政：东晋南朝屡行土断，省并侨置郡县，令侨流断入白籍、就地著籍纳课，兴宁二年庚戌土断由桓温主持，最为严整。流民著籍使国家税基稍复，侨土之别趋于消弭，户籍与赋役之整理由此推进。\n• 都督与方镇之势：魏晋于要州置都督诸州军事，都督兼掌军政、节制刺史，出镇方面、兵权在握，扬州荆州尤为重镇。方镇坐大而中央控御之力衰减，外
